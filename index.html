原电池组成", "q": "腐蚀原电池的四个组成部分为：阳极、阴极、电解质溶液和____。", "ans": ["电路"], "points": "腐蚀原电池是只能导致腐蚀而不能对外做功的短路原电池，4个组成部分为阳极、阴极、电解质溶液、电路；3个过程为阳极过程、阴极过程、电流流动。"}, {"tag": "腐蚀倾向", "q": "电化学腐蚀倾向判据：ΔG____0时腐蚀反应可能发生。", "ans": ["\u003c", "小于"], "points": "ΔG\u003c0腐蚀反应可能发生，而且越负越不稳定；ΔG>0腐蚀反应不可能发生。ΔG=nFE，满足ΔG\u003c0的必要条件是E>0，即阳极电位小于阴极电位。"}, {"tag": "腐蚀破坏区", "q": "金属电化学腐蚀的破坏集中出现在____区。", "ans": ["阳极"], "points": "腐蚀原电池的电流在阳极和阴极间流动，金属的腐蚀破坏集中出现在阳极区。"}, {"tag": "奥氏体形成元素", "q": "不锈钢中的奥氏体形成元素包括：Ni、C、N、Mn、Cu、____。", "ans": ["Co"], "points": "铁素体形成元素：Cr、Mo、Si、Ti、Nb等；奥氏体形成元素：Ni、C、N、Mn、Cu、Co等。铬当量和镍当量的综合作用结果决定不锈钢的组织。"}, {"tag": "敏化温度", "q": "Cr-Ni奥氏体不锈钢在____℃的温度范围内时效处理，可考察不锈钢晶间腐蚀的敏感性（填写温度范围）。", "ans": ["450~800"], "points": "奥氏体不锈钢在450~800℃（焊缝及热影响区）时效时沿晶界析出(Cr,Fe)₂₃C₆，晶界附近产生贫Cr区（低于1/8定律临界值），产生晶间腐蚀敏感性；敏化处理和敏感性的关系用TTS曲线表示。"}, {"tag": "固溶处理温度", "q": "奥氏体不锈钢固溶处理温度一般为____℃（填写常用温度范围）。", "ans": ["1050~1100"], "points": "奥氏体不锈钢固溶处理温度一般为1050~1150℃，比较常用1050~1100℃；为保证高温奥氏体不发生分解，固溶处理后冷速应较快，多采用水冷；固溶处理是奥氏体不锈钢最大程度的软化处理，此时奥氏体具有最大合金度和最高的耐蚀性能。"}, {"tag": "双相不锈钢", "q": "双相不锈钢指铁素体与奥氏体各约占50%，一般较少相的含量最少也需要达到____%。", "ans": ["30"], "points": "双相不锈钢（DSS）指铁素体与奥氏体各约占50%，一般较少相的含量最少也需要达到30%；通过正确控制化学成分和热处理工艺，使DSS兼有铁素体不锈钢和奥氏体不锈钢的优点。"}]}], "part3": [{"ch": 1, "title": "第一章 材料单向静拉伸的力学性能", "sa": [{"tag": "名词解释", "q": "名词解释：弹性变形、弹性模量、塑性变形、形变强化。", "points": "弹性变形：构成材料的原子（离子）或分子自平衡位置产生可逆位移的反应，卸载后变形可恢复。\n弹性模量：线弹性阶段应力与应变成正比σ=Eε的比例系数E，是度量材料刚度的系数，表征材料对弹性变形的抗力，组织不敏感。\n塑性变形：微观结构的相邻部分产生永久性位移而不引起材料破裂的现象；金属塑性变形主要形式为滑移和孪生。\n形变强化（应变硬化）：材料进入塑性变形阶段后，随变形量增大变形应力不断提高的现象，可用Hollomon方程S=Kεp^n描述。"}, {"tag": "强度与塑性", "q": "金属材料的强度和塑性之间有什么关系？", "points": "一般材料的强度和塑性是相互矛盾的：塑性好的材料往往强度不是很高。强度表征材料抵抗变形和断裂的能力，塑性表征材料断裂前产生塑性变形的能力；两者共同决定材料的韧性（断裂前吸收能量进行塑性变形的能力）。工程上通过强化手段（固溶、形变、沉淀弥散、晶界强化）提高强度的同时，往往伴随塑性下降，需综合权衡。"}, {"tag": "屈服强度强化途径", "q": "提高金属材料屈服强度的思路和途径有哪些？", "points": "屈服强度的影响因素分为内在因素和外在因素。内在因素对应四种强化机制：（1）固溶强化（溶质元素引起晶格畸变）；（2）形变强化（应变硬化）；（3）沉淀强化和弥散强化（第二相细小弥散或不可变形第二相）；（4）晶界和亚晶界强化（细化晶粒，Hall-Petch关系）。外在因素：降低使用温度、提高应变速率、改变应力状态等。"}, {"tag": "塑性指标与工程意义", "q": "体现金属材料塑性的指标有哪些？塑性变形对金属材料的工程意义是什么？", "points": "指标：伸长率δ和断面收缩率Ψ（通过拉伸试验得到）。工程意义：（1）塑性好可保证成型工艺顺利进行（轧制、拉拔、挤压等），如低碳钢、低碳合金钢，而铸铁塑性低不能压力加工成型；（2）塑性好使零部件使用中安全可靠，即使工作应力超出屈服强度也不至于突然破坏。"}, {"tag": "真应力真应变辨析", "q": "辨析：工程应力与真应力、工程应变与真应变（写出关系式并说明大小关系）。", "points": "工程应力σ=F/A0（A0为原始截面积），真应力S=F/A（A为瞬时截面积）；真应变e=ln(1+ε)，工程应变ε=ΔL/L0。关系式：S=σ(1+ε)，e=ln(1+ε)。大小关系：真应力S恒大于工程应力σ；真应变e恒小于工程应变ε。原因：拉伸过程中截面不断收缩，真应力按真实截面积计算而增大；真应变按瞬时长度积分而小于按原始长度计算的工程应变。"}, {"tag": "断裂类型辨析", "q": "辨析：韧性断裂与脆性断裂（从征兆、断口特征、危害三方面）。", "points": "韧性断裂：断裂前发生明显塑性变形，能警告人们注意，不会造成严重事故；断口为杯形（杯锥状），呈暗灰色纤维状，有三要素纤维区、放射区、剪切唇。脆性断裂：没有明显征兆，危害性极大；断裂后断口齐平，由无数小平面的结晶状组成，纤维区很小、剪切唇几乎没有。"}, {"tag": "断裂类型辨析2", "q": "辨析：穿晶断裂与沿晶断裂；解理断裂与剪切断裂。", "points": "按裂纹扩展路线分：穿晶断裂（裂纹穿过晶粒内部）与沿晶断裂（裂纹沿晶界扩展）。按微观断裂机理分：解理断裂（正应力下原子结合键破坏、沿解理面发生的脆性穿晶断裂，断口河流状花样）与剪切断裂（切应力下沿滑移面滑移分离造成的断裂，断口锋利的锲形、暗灰色纤维状；微孔聚集型断裂是其常见形式，微观为韧窝）。"}]}, {"ch": 2, "title": "第二章 材料在其他状态下的力学性能", "sa": [{"tag": "硬度名词解释", "q": "名词解释：硬度；并说明布氏、洛氏、维氏三种硬度各自的测量参量（测什么）。", "points": "硬度：材料抵抗硬物压入其表面的能力，是衡量材料软硬的指标（物理意义为材料抵抗变形或破裂的能力）。布氏硬度测压痕面积（HB=P/S）；洛氏硬度测压痕深度（压入越深越软）；维氏硬度测单位压痕面积上的载荷（金刚石四棱锥、压入角恒定）。"}, {"tag": "布氏洛氏对比", "q": "简述布氏硬度与洛氏硬度各自的优缺点。", "points": "布氏硬度：优点——压痕大、误差小，能反映较大区域内各组成相的平均性能，数据稳定、重复性高；缺点——压痕大，不宜在成品上直接检验，对硬度差异大的材料需更换P、D，压痕直径测量麻烦，需保持压力一定时间。洛氏硬度：优点——操作简便迅速、压痕小、可直接对工件测量、不同标尺可测软硬厚薄不一试样；缺点——误差大、代表性差、重复性差、数据分散度高，不同标尺下测得值不能比较和换算。"}, {"tag": "扭转试验应用", "q": "简述扭转试验的特点及应用（为什么能精确测定高塑性材料的变形及抗力）。", "points": "特点：（1）扭转时整个长度方向塑性变形始终均匀，试样截面和标距基本不变，不出现颈缩、鼓涨，故可精确测定塑性材料尤其是高塑性材料的变形及抗力；（2）截面应力应变分布对表面缺陷显示很大敏感性，可用于表面处理分析及质量监控，对心部缺陷不敏感；（3）材料受较大切应力，可用于研究对切应力敏感的力学行为；（4）可明确区分正断与切断，根据断口判断抗拉（压）强度与抗扭（剪）强度的相对大小。"}, {"tag": "扭转断口正断切断", "q": "扭转试验如何根据断口区分正断与切断？有何工程意义？", "points": "塑性材料断口与试样轴线垂直、平整并有回旋状塑性变形痕迹，是切应力造成的切断；脆性材料断口与轴线成45°、呈螺旋状，是正应力造成的正断；若轴向切断抗力比横向低，可出现层状断口。意义：根据扭转试样断口特征确定断裂原因，可判断材料抗拉（压）强度与抗扭（剪）强度的相对大小。"}, {"tag": "压缩试验特点", "q": "简述压缩试验的特点，为什么塑性材料一般不采用压缩方法检验？", "points": "特点1：压缩主要用于脆性材料，表征其在静拉伸韧性状态下不能反映的力学行为（如铸铁等脆性材料拉伸为脆性正断，压缩时发生一定塑性变形并有沿轴线45°切断特征）。特点2：压缩与拉伸受力方向相反，载荷-变形曲线、塑性及断裂形态差别较大，且压缩试验不能使塑性材料断裂（被压扁而不断裂），故塑性材料一般不采用压缩方法检验。"}]}, {"ch": 3, "title": "第三章 材料的冲击韧性和低温脆性、材料的断裂韧性", "sa": [{"tag": "冲击韧性及意义", "q": "什么是冲击韧性？冲击韧性试验有哪些工程意义？", "points": "冲击韧性：材料在冲击载荷作用下吸收塑性变形功和断裂功的大小（冲击韧性值aKV=AKV/AN，单位J/cm²），表示材料塑性变形和断裂全过程吸收能量的能力，是材料强度和塑性的综合表现。工程意义：（1）反映冶金和热加工的质量；（2）测定材料韧脆性转变温度；（3）对σs大致相同的材料，可根据AK判断大能量冲击下缺口敏感性。"}, {"tag": "低温脆性原因", "q": "简述材料产生低温脆性的原因。", "points": "（1）屈服强度σs和断裂强度σc随温度变化，温度下降σs急剧增加，材料在断裂前难以塑性变形；（2）位错在晶体中运动的阻力σi随温度变化（热激活作用减弱）；（3）体心立方金属存在迟屈服现象：在大于σs的高速载荷下材料不立即屈服，需经孕育期才开始塑性变形，这段时间有利于裂纹扩展。FCC金属位错密度大、一般不显示低温脆性。"}, {"tag": "韧脆转化温度测定", "q": "韧脆转化温度的实验测定方法有哪些？分别说明。", "points": "研究低温脆性的主要问题是确定韧脆转化温度（安全使用温度必须在tk以上20~60℃，越高越安全），实验方法有能量法、塑性变形法、断口形貌法三类。断口形貌法：取结晶状断口面积占50%时的温度（50%FATT）。能量法：（1）V15TT——V型切口冲击功AK=15尺磅(20.3N·m)对应温度（低碳钢经验）；（2）NDT零塑性温度——低阶能开始上升的温度，以下断口100%结晶状；（3）FTP——高阶能开始降低的温度，以上断口100%纤维状；（4）FTE——高阶能与低阶能平均值对应温度。"}, {"tag": "影响低温脆性因素", "q": "影响材料低温脆性的因素有哪些？", "points": "（1）晶体结构：bcc金属及合金存在低温脆性，fcc一般不存在；（2）化学成分：溶质元素含量增加高阶能下降、韧脆转变温度提高，杂质S、P、Pb、Sn、As降低韧性（偏聚晶界、降低晶界强度），Ni、Mn增大层错能提高低温韧性；（3）显微组织：细化晶粒降低tk；（4）强度水平组织：低强度水平回火索氏体（调质钢）最佳；相同强度下典型上贝氏体韧脆转变温度高于下贝氏体；（5）温度（蓝脆）、加载速度（提高→tk提高）、试样形状尺寸（曲率半径越小tk越高、尺寸增加tk增高）。"}, {"tag": "KI与KIC辨析", "q": "辨析：应力强度因子KI与断裂韧度KIC（从属性、单位、影响因素三方面）。", "points": "KI是力学参量，反映裂纹尖端区域应力场的强度，综合反映外加应力、裂纹位置（类型）和裂纹长度三个方面；KIC是力学性能指标，表示材料在平面应变状态下抵抗裂纹失稳扩展的能力。单位相同：MPa·m^1/2。影响因素：KI取决于外加应力、裂纹尺寸和裂纹类型；KIC取决于材料成分、组织结构等内在因素（也受温度、应变速率等外在因素影响）。两者关系类似σ与σs：当KI达到临界值KIC时裂纹失稳扩展。"}, {"tag": "断裂韧度影响因素", "q": "影响材料断裂韧度的内在因素有哪些？", "points": "（1）化学成分：细化晶粒的合金元素提高强度与塑性、提高断裂韧度；强烈固溶强化的合金元素降低塑性和韧性；形成金属间化合物并呈第二相析出的合金元素降低塑性和韧性。（2）基体相结构和晶粒尺寸：基体相易塑性变形则断裂韧性高（如面心立方钢高于体心立方）；晶粒尺寸无一致规律。（3）夹杂和第二相：非金属夹杂和脆性第二相降低断裂韧度，韧性第二相形态数量适当时可提高。（4）显微结构：低碳钢回火马氏体高于贝氏体；高碳钢回火马氏体高于上贝氏体、低于下贝氏体。（5）特殊改性处理：亚温淬火、超高温淬火、形变热处理。"}, {"tag": "平面应力平面应变辨析", "q": "辨析：平面应力状态与平面应变状态（从板厚、约束、应力特点说明）。", "points": "平面应力状态：薄板情况，裂纹尖端沿板厚方向应变不受约束，σz=0，只有两向拉应力。平面应变状态：厚板情况，裂纹尖端沿板厚方向应变受约束，εz=0，呈三向拉应力。断裂韧度KIC（平面应变）是材料抵抗裂纹失稳扩展能力的标准指标，厚板三向拉应力下更易满足平面应变条件。"}]}, {"ch": 4, "title": "第四章 材料的疲劳性能", "sa": [{"tag": "疲劳破坏特点", "q": "简述疲劳破坏的特点及疲劳断口的宏观特征。", "points": "特点：（1）疲劳破坏是突发性破坏，断裂前无明显的塑性变形；（2）疲劳破坏是低应力循环延性破坏（断裂应力低于抗拉强度、屈服强度）；（3）疲劳对缺陷（缺口、裂纹及组织）十分敏感。断口宏观特征：裂纹源（多在表面，常与缺口、刀痕、蚀坑等缺陷相连）、疲劳裂纹扩展区（较光滑、有贝纹线/海滩花样，凹侧指向疲劳源）、瞬断区（裂纹失稳扩展，较粗糙，脆性材料呈结晶状，韧性材料心部放射状或人字纹状、边缘剪切唇）。"}, {"tag": "疲劳裂纹扩展阶段", "q": "简述疲劳裂纹扩展的两个阶段及其特征。", "points": "Ⅰ阶段：裂纹沿最大切应力方向扩展，仅个别微裂纹延伸，断口难辨析，扩展速度很慢。Ⅱ阶段：沿垂直于拉应力方向扩展形成主裂纹，直至最后形成剪切唇；电子显微观察有疲劳条带（疲劳辉纹，呈弯曲并相互平行的沟槽状花样，与扩展方向垂直）。"}, {"tag": "高低周疲劳辨析", "q": "辨析：低周疲劳与高周疲劳（从寿命、应力水平、控制参量、条带特征比较）。", "points": "低周疲劳：寿命10^2~10^5次；交变应力较高，接近或超过屈服强度，是塑性应变循环下的疲劳（塑性疲劳/应变疲劳）；寿命取决于塑性变形幅；可能有几个裂纹源，形核期短（约10%），条带较粗、间距较宽、常不连续；应注意考虑强度。高周疲劳：寿命大于10^5次；应力较低，弹性变形为主；寿命取决于应力幅；应在保持一定强度基础上尽量提高塑性和韧性。"}, {"tag": "影响疲劳强度因素", "q": "影响材料或机件疲劳强度的因素有哪些？", "points": "（1）工作条件：载荷条件（应力状态、应力比、平均应力、过载、次载锻炼、间歇效应、载荷频率）、温度（降低→疲劳强度升高；升高→降低）、环境介质（腐蚀介质降低）。（2）表面状态和尺寸因素：缺口刀痕擦伤等缺陷降低疲劳强度；尺寸增大疲劳强度下降（尺寸效应）。（3）表面处理及表面强化：喷丸、滚压、表面淬火、化学热处理、复合强化——提高表面强度并产生表面压应力。（4）材料因素：化学成分（碳的固溶/弥散强化）、非金属夹杂物及冶金缺陷、显微组织（细化晶粒提高；回火马氏体>屈氏体>索氏体）。"}, {"tag": "提高疲劳强度方法", "q": "表面强化为什么能提高机件疲劳强度？列举主要表面强化方法。", "points": "原理：（1）疲劳破坏往往从工件表面开始，提高表面强度就能提高疲劳寿命；（2）产生表面压应力，能减小工件表面的拉应力，提高疲劳强度。方法：表面喷丸（形变强化+残余压应力，适合形状复杂构件）、表面滚压（作用相似，适合大工件、形状简单）、表面热处理和化学热处理（获得表硬心韧+表面残余压应力）、复合强化（渗碳+表面淬火、渗碳+喷丸、表面淬火+喷丸）。"}, {"tag": "σ-1与ΔKth辨析", "q": "辨析：疲劳强度σ-1与疲劳裂纹扩展门槛值ΔKth。", "points": "σ-1：光滑试样的无限寿命疲劳强度（对称循环疲劳极限），适用于传统的疲劳强度设计和校核（无裂纹件的无限寿命设计）。ΔKth：疲劳裂纹不扩展的ΔKI临界值（da/dN=0时对应的ΔKI），代表裂纹试样的无限寿命疲劳性能，适用于裂纹件的设计和疲劳强度校核；含裂纹件不发生疲劳断裂的校核公式为ΔKI=YΔσ√a≤ΔKth。"}, {"tag": "过载持久值与损伤界", "q": "辨析：过载持久值与过载损伤界。", "points": "过载持久值：材料在高于疲劳强度的应力下工作，发生疲劳断裂的循环周次，即有限疲劳寿命，由疲劳曲线倾斜部分确定，表征抗过载能力。过载损伤界：短期过载对材料性能的影响取决于过载应力和过载周次，把每个过载应力下运行能引起损伤的最少循环周次连接起来得到过载损伤界；过载损伤界到过载持久值之间的影线区为过载损伤区。工程上选材时，有时宁可疲劳强度选低些，也要选疲劳损伤区窄的材料。"}, {"tag": "热疲劳", "q": "什么是热疲劳？提高材料热疲劳性能应考虑哪些因素？", "points": "热疲劳：由周期变化的热应力或热应变引起的材料破坏（如热轧辊、气轮机叶片、热锻模、柴油机活塞、制动盘）；产生条件：温度循环变化+热变形受到约束；完全约束时热应力Δσ=EαΔT。影响因素：金属中夹渣、气孔、裂纹等缺陷降低热疲劳强度和寿命；陶瓷气孔能抑制微裂纹钝化裂尖、但也隔热使局部温度更高；导热系数高热疲劳性能好；弹性模量高热疲劳性能差；塑性和韧性好热疲劳性能好；组织稳定性（铁素体/珠光体相变产生相变应力）影响。"}]}, {"ch": 5, "title": "第五章 材料的磨损性能", "sa": [{"tag": "磨损三阶段", "q": "简述材料磨损过程中不同阶段的磨损行为差别。", "points": "（1）跑合（磨合）阶段：开始时摩擦表面具有一定粗糙度，真实接触面积较小，磨损速率很大；随表面逐渐被磨平，真实接触面积增大，磨损速率减慢趋于稳定。（2）稳定磨损阶段：接触表面趋于平滑，磨损稳定，磨损量较低，磨损速率基本保持恒定。（3）剧烈磨损阶段：随时间或摩擦行程增加，接触表面间隙逐渐扩大，磨损速率急剧增加，造成摩擦副温度升高、机械效率下降、精度丧失，甚至完全失效。"}, {"tag": "接触疲劳失效机制", "q": "接触疲劳磨损的失效机制及分类是什么？", "points": "失效机制：接触综合切应力高于材料接触疲劳强度时，在最大切应力处（次表层Z=0.786b处约0.3σzmax，或摩擦系数>0.2时移到表面）长期循环作用下萌生裂纹并扩展，最终剥落。分类（按最大切应力位置深浅）：点蚀（麻点剥落，深0.1~0.2mm，表面接触应力较小、滑动摩擦力较大或表面质量较差时出现）；浅层剥落（0.2~0.4mm，次表层0.5~0.7b处最大循环切应力引起）；深层剥落（>0.4mm，发生在强化但强化深度不足的工件，裂纹源位于强化与未强化结合处）。渗碳淬火试样：切应力/抗剪切强度比值>0.55大块剥落，0.5~0.55混合，\u003c0.5麻点剥落。"}, {"tag": "粘着与磨粒辨析", "q": "辨析：粘着磨损与磨粒磨损（从定义、机理、特征比较）。", "points": "粘着磨损（咬合磨损）：两种材料某些表面接触点局部应力超过该材料局部屈服强度发生粘合并拽开而产生的表面损伤；机理为微凸体塑性变形→保护膜破坏→凸体熔合→相对运动拉开脱落形成磨屑；表面特征为大小不等的结疤；易发生在相对滑动速度小、氧化膜脆弱、润滑差、接触应力大的滑动摩擦条件下。磨粒磨损（磨料磨损）：摩擦副一方表面存在坚硬细微凸起或接触面间存在硬质粒子时产生的磨损；机理为微切削、塑性变形犁皱、疲劳破坏或脆性断裂；主要特征是摩擦面上有擦伤或明显犁皱形成的沟槽；分两体/三体，低应力擦伤式/高应力辗碎式/凿削式。"}, {"tag": "减少磨损措施", "q": "减少粘着磨损和磨粒磨损的主要措施有哪些？", "points": "减少粘着磨损：（1）合理选择摩擦副材料，尽量减少互溶性小、粘着倾向小的材料配对；（2）避免或减少两摩擦副间直接接触；（3）增强氧化膜的稳定性，提高氧化膜与基体的结合力；（4）降低接触表面粗糙度，改善表面润滑条件；（5）采用表面渗碳、渗磷、渗氮等表面工艺，使磨屑多沿接触表面剥落。减少磨粒磨损：（1）低应力磨粒磨损设法提高表面硬度（含碳量高并经热处理获得马氏体组织）；（2）重载荷冲击载荷磨损基体用高硬度良好韧性的贝氏体；（3）合金钢控制改变碳化物数量、分布、形态；（4）对渗碳、碳氮共渗提高表面硬度的材料，对构件、润滑油防尘过滤；（5）确定材料硬度以Hm=1.3Ha为依据（Hm摩擦副材料硬度、Ha磨粒硬度）；（6）高锰钢是公认的理想抗凿削磨损材料。"}, {"tag": "磨损转化因素", "q": "影响磨损类型转化的因素有哪些？", "points": "磨损类型并非固定不变，在不同外部条件和材料特性下损伤机制会发生转化。外部条件：摩擦类型（滚动或滑动）、摩擦表面相对滑动速度和接触压力的大小。材料特性：（1）材料与氧的化学亲和力以及形成的氧化膜性质；（2）材料在常温和高温下抗粘着能力；（3）材料的常规力学性能；（4）材料的耐热性；（5）材料与润滑剂相互作用的能力。"}, {"tag": "氧化磨损", "q": "为什么生产中常创造条件使其它磨损形态转化为氧化磨损？", "points": "氧化磨损是腐蚀磨损中经常见到的一种，摩擦状态下氧化反应速度比通常的氧化速度快；氧化磨损速率主要取决于所形成的氧化膜性质和它与基体的结合强度，同时也与基体表层的塑性变形抗力有关。和其它磨损类型比较，氧化磨损具有最小的磨损速度，因此生产中总是创造条件使其它可能出现的磨损形态（如粘着磨损、磨料磨损等）转化为氧化磨损，以防止发生严重磨损。"}]}, {"ch": 6, "title": "第六章 材料的高温蠕变性能", "sa": [{"tag": "指标名词解释", "q": "名词解释：蠕变极限、持久强度、应力松弛（并说明各自的工程用途）。", "points": "蠕变极限：在高温长时间载荷作用下，机件不产生过量塑性变形的抗力指标，表示材料对高温蠕变变形的抗力；两种表示——规定第二阶段蠕变速率下的应力值，或规定时间内的蠕变应变量对应应力值；用于选用高温材料、设计高温服役构件。持久强度：材料在规定温度和时间内不发生蠕变断裂的最大应力（σtT，如σ1000/600=200MPa），是高温长时载荷下材料对断裂的抗力指标；用于只要求规定温度时间内不发生断裂的零件（如高温吊具），重要零件（发动机涡轮叶片）两者都是设计依据。应力松弛：材料总应变保持不变但应力随时间自行降低的现象，材料抵抗应力松弛的能力称松弛稳定性；用于评价高温下紧固件的预紧能力，如高温管道接头螺纹需定期再拧紧防泄漏。"}, {"tag": "细晶强化高温", "q": "细晶强化为什么不适用于高温服役材料？", "points": "常温下，细化晶粒是唯一可以同时提高材料强度、硬度和塑性的方法（晶界强化，Hall-Petch关系）。但高温下晶界强度降低比晶体强度快，存在等强温度：等强温度以上晶界强度低于晶体强度，晶间断裂成为蠕变断裂的普遍形式；细化晶粒使晶界面积增加，反而使材料强度下降、蠕变极限和持久强度降低。因此在等强温度以上工作时，应使晶粒适当粗化，减少晶界面积和高能晶界，减缓晶界扩散。使用温度低于等强温度时细化晶粒仍可提高强度。"}, {"tag": "蠕变三阶段特征", "q": "简述蠕变曲线三个阶段的特征。", "points": "第一阶段（ab，减速蠕变阶段）：蠕变速度随时间增长而下降，主要发生形变硬化，位错开动和滑动阻力增大导致蠕变速率降低。第二阶段（bc，恒速蠕变阶段）：蠕变速度恒定，形变硬化和回复软化达到动态平衡，蠕变速率取决于位错攀移速率，此阶段持续时间最长。第三阶段（cd，加速蠕变阶段）：蠕变速度随时间急剧增大直至断裂。应力较小或温度较低时第二阶段持续时间长甚至无第三阶段；应力较大或温度较高时第二阶段短甚至完全消失，很快进入第三阶段断裂。"}, {"tag": "蠕变机理", "q": "简述蠕变变形的三种机理。", "points": "（1）位错滑移蠕变机理：高温给原子和空穴提供激活能，使原子克服常温下无法逾越的阻碍继续变形；蠕变中位错滑动和攀移交替进行，位错攀移是软化过程；第Ⅲ阶段硬化与回复软化动态平衡时蠕变速率取决于位错攀移速率。（2）原子扩散机理：高温下原子空位热激活扩散，拉应力长时间作用下多晶体存在不均匀应力场，晶界受拉处空位浓度增加、受压处减少，空位沿应力梯度从拉伸区扩散到压应力区、原子反向运动；包括体扩散机理和晶界扩散机理，晶粒沿拉伸方向伸长、垂直方向收缩。（3）晶界滑动蠕变机理：高温下晶界在外力作用下相对滑动产生明显塑性变形；温度较高时晶界滑移占总蠕变量比例约10%。"}, {"tag": "蠕变影响因素", "q": "影响材料高温蠕变性能的因素有哪些？", "points": "（1）合金化学成分：基体选熔点高、自扩散激活能大或层错能低的金属及合金（熔点越高自扩散越慢；层错能低易形成扩展位错、位错难以割阶交滑移攀移）；加入Cr、Mo、W、Nb等固溶强化并降低层错能，形成弥散相强烈阻碍位错滑移；加入硼、稀土等增加晶界扩散激活能、阻碍晶界滑动并增大晶界裂纹面表面能；控制硫、磷、锡、铅等有害元素。（2）组织结构：采用正火加高温回火工艺，正火温度较高使碳化物充分均匀溶解，回火温度高于使用温度100~150℃以上提高组织稳定性。（3）晶粒尺寸：使用温度低于等强温度时细化晶粒提高强度；高于等强温度时粗化晶粒提高蠕变极限和持久强度；晶粒太大降低高温塑性和韧性（GH36合金平均晶粒0.15mm时650℃持久性能最好，奥氏体耐热钢及镍基合金以2~4级晶粒度为宜）。（4）应力：高应力蠕变速率高，低应力扩散机制控制、中高应力位错机制控制。（5）温度：蠕变是热激活过程，温度升高蠕变变形量增加、蠕变速率增大。"}, {"tag": "高温疲劳蠕变交互", "q": "简述高温疲劳与蠕变的交互作用。", "points": "高温疲劳的最大特点是与时间有关（加载频率、波形、应变速率等）。降低加载应变速率或加载频率、增加循环中拉应力保持时间都会缩短疲劳寿命：引起沿晶蠕变增加损伤，并增加环境腐蚀（拉应力使裂纹张开后的氧化侵蚀）的时间；高温下原子沿晶界扩散快，环境腐蚀主要沿晶界发展，断口形貌从穿晶断裂过渡到穿晶加沿晶甚至完全沿晶断裂。高温疲劳裂纹可看作是疲劳和蠕变分别造成裂纹扩展量的叠加：低载荷时蠕变裂纹扩展速率较低，以疲劳对裂纹扩展的贡献为主；较高载荷时以蠕变贡献为主。两种损伤过程存在瞬时交互作用和顺序交互作用，交互作用的结果可能加剧损伤过程。"}]}, {"ch": 7, "title": "第七章 材料的热学性能", "sa": [{"tag": "名词解释", "q": "名词解释：热容、比热容、摩尔热容；并说明Cp与Cv的关系及原因。", "points": "热容：在没有相变、化学反应、对外热交换的条件下，物体温度升高1 K所吸收的热量，单位J/K，CT=ΔQ/ΔT。\n比热容（质量热容）：单位质量物质的热容，单位J/(kg·K)。\n摩尔热容：1 mol物质的热容，单位J/(mol·K)。\nCp>Cv：恒压加热时物体除温度升高外还要对外做功（膨胀功），故温度升高1 K需吸收更多能量；从试验观点Cp测定方便，从理论上讲Cv更有意义。"}, {"tag": "名词解释", "q": "名词解释：杜隆—珀替定律；柯普定律。", "points": "杜隆—珀替定律：大多数固态单质的原子热容几乎都相等，1 mol单原子固体的摩尔定容热容Cv,m=3R≈25 J/(K·mol)，即固体热容是与温度无关的常数；适用于高温区（室温下适用于大多数金属和一些非金属），低温时与实验相差大。\n柯普定律：化合物分子热容等于构成此化合物各元素原子热容之和，C=ΣniCi；在较高温度下固体热容具有加和性，对573 K以上大多数氧化物和硅酸盐化合物符合较好。"}, {"tag": "理论比较", "q": "比较爱因斯坦热容模型与德拜热容模型的要点及优缺点。", "points": "共同点：都基于量子化概念（能量量子hv——声子），得出热容与温度有关、T→0 K时Cv→0。\n爱因斯坦模型：假设晶格中每个原子独立振动且频率都相同，把原子振动看作谐振子；优点是可以得到Cv,m随温度变化且低温趋于0，与实验一致；不足是低温时Cv与T成指数关系，而实验结果是T3关系（忽略了原子振动之间的耦合与频率差异）。\n德拜模型：考虑原子间的相互作用，把晶体看作连续介质，原子振动谱为0~νmax；低温时得到德拜T立方定律Cv∝T3，与实验非常相符；不足是低温/高温下还不能完全相符（低温晶格振动被冻结、高温电子热容比例增大），也解释不了超导现象。"}, {"tag": "热容影响因素", "q": "影响材料热容的因素有哪些？", "points": "1）与材料构成形式关系不大：如CaO与SiO2的混合物与CaSiO3的热容-温度曲线基本相符。\n2）相变：一级相变在临界点Tc热容发生突变；二级相变（有序—无序）在一个温度范围内进行，热焓突然升高、热容急剧增大。\n3）温度：Cp=Ce+Cg=γT+βT3；低温时电子热容较小，热容与温度成T3关系；温度较高时晶格热容较小，热容与温度呈线性关系。\n4）高温下固体热容具有加和性（柯普定律）。"}, {"tag": "导热方式", "q": "叙述固体的三种导热方式及影响材料热传导性能的主要因素。", "points": "三种导热方式：①自由电子运动导热，λe=Ceυele/3，金属主要靠它；②晶格振动（声子）导热，λρ=Cρυρlρ/3，非金属（离子晶体等）主要靠它；③光子辐射导热，λr=16σn²T³lr/3。\n影响因素：①纯金属：电导率高则热导率高；晶粒粗大热导率高、晶粒愈细愈低；立方晶系热导率与晶向无关，非立方晶系各向异性；杂质强烈影响。②温度：晶体材料在常用温度范围内λ随温度升高而下降。③晶体结构：结构越复杂导热率越低；导热率有方向性，膨胀系数低的方向导热率大；同种材料多晶体导热率比单晶体小，非晶态材料导热系数较小。④化学组成：轻元素、结合能大的元素导热率较大；溶质浓度增加导热率降低（连续互溶固溶体在原子浓度50%处最低）。⑤气孔：气孔率升高导热率下降（隔热耐火材料利用此点）。"}, {"tag": "热膨胀影响因素", "q": "影响材料热膨胀系数的主要因素有哪些？", "points": "1）合金成分：形成均一单相固溶体时α介于组元α之间（如Ag-Au合金近似Vegard直线定律）；加入过渡族元素α无规律；键强度高的材料（如SiC）α低；结构紧密的晶体α较大，松散的非晶态玻璃结构α较小（多晶石英α=12×10⁻⁶K⁻¹，石英玻璃仅0.5×10⁻⁶K⁻¹）。\n2）与热容关系（格律乃森定律）：膨胀系数与热容随温度变化特征基本一致，低温下皆按T3变化。\n3）原子序数：IA族α随原子序数增大而增大，其它A族随原子序数增大而减小；过渡族元素α低、碱金属偏高。\n4）硬度：金属本身硬度愈高，膨胀系数愈小。\n5）相变：一级相变比容突变、膨胀量缓变；二级相变α有转折且下降、膨胀量变化不明显且趋势减弱。"}, {"tag": "热膨胀应用", "q": "热膨胀性能在工程中有哪些应用？简述热膨胀系数的测定方法。", "points": "应用：双金属控温器；机械装配（过盈配合）；复合材料（Al/石墨纤维、Al/SiC）；釉的膨胀系数应比陶瓷适当小，使陶瓷坯内产生一定压应力；用膨胀法测定钢的过冷奥氏体等温转变曲线TTT（过冷奥氏体在不同温度区间转变时体积皆膨胀，且膨胀量与转变量成比例）；研究晶体缺陷（缺陷存在或消失引起的相对体积变化为10⁻⁴量级，可确定空位或位错密度）。\n测定方法：①望远镜（放大镜）直读法：放大倍率大于10倍的望远镜直接读出试样长度；②顶杆式间接法：用顶杆压住试样，通过位移传感器或千分表测量线膨胀；③光杠杆法：利用光杠杆原理根据光杠杆参数得到伸长量。"}]}, {"ch": 8, "title": "第八章 材料的磁学性能", "sa": [{"tag": "名词解释", "q": "名词解释：磁化强度、磁感应强度、磁化率、磁导率。", "points": "磁化强度M：单位体积内所有原子固有磁矩的总和，M=Σmi/V（A/m），磁化强度就是附加磁场H′。\n磁感应强度B：通过一个垂直于磁场方向单位面积的磁力线数，单位为特斯拉（T）。\n磁化率χ：表征磁化强度与外加磁场关系的参量，M=χH，其值可正可负（抗磁体为负、顺磁体为正）。\n磁导率（磁导系数）μ：反映磁感应强度随外加磁场H的变化速率；相对磁导率μr=μ/μ0，μr\u003c1为抗磁质、μr>1为顺磁质、μr>>1为铁磁质。"}, {"tag": "三类磁性差异", "q": "简述抗磁材料、顺磁材料和铁磁材料的差异。", "points": "按磁化后对磁场所产生的影响分类：\n①抗磁性材料：磁化磁场M与外加磁场H方向相反，磁化率χ\u003c0（约10⁻⁶），使磁场减弱（如Cu、Ag、Au、Hg、Zn、Bi等）。\n②顺磁性材料：M与H方向相同，磁化率χ>0（约10⁻³~10⁻⁶）且常数很小，M与H呈直线关系，外磁场去除磁场随即去除，使磁场略有增强（如Pt、Pd、奥氏体不锈钢、稀土金属、Al等）。\n③铁磁性材料：弱的H便能产生很大的M，χ是很大的正数（10²~10⁴量级）且与外磁场呈非线性关系，使磁场强烈增强，具有自发磁化和磁畴结构（如Fe、Co、Ni）；高于居里温度TC后变成顺磁体。"}, {"tag": "名词解释", "q": "名词解释：磁畴；畴壁。", "points": "磁畴：铁磁质相邻原子的电子因自旋存在强的交换耦合作用，使得在无外磁场作用时，电子自旋磁矩能在小区域内自发地平行排列，形成自发磁化达到饱和状态的微小区域，称为磁畴；1907年提出，1932年通过实验观察到。各个磁畴的方向不相同，因此大块磁铁对外不显示磁性；当铁磁晶体尺寸足够小（强铁磁材料临界尺寸约1微米）时成为单畴颗粒。\n畴壁：相邻磁畴之间原子磁矩不是骤然转向，而是经过一个磁矩方向逐渐变化的过渡区域，这种过渡区域叫畴壁；铁晶体畴壁约含1000个原子层，磁畴宽度一般介于10⁻²~10⁻⁵ cm。"}, {"tag": "磁滞回线参数", "q": "说明磁滞回线上饱和磁化强度Ms、剩余磁化强度Mr、矫顽力Hc及磁滞损耗的含义。", "points": "饱和磁化强度Ms：达到Hs时M达到的饱和值，Ms对应的Bs称为饱和磁感应强度。\n剩余磁化强度Mr：H=0时保留的磁化强度。\n矫顽力Hc：去掉剩磁的临界外磁场。\n磁滞损耗：磁滞回线包围的面积，相当于磁化一周所产生的能量损耗。\n另可根据磁滞回线形状划分软磁材料（瘦小回线、高导磁率低Hc）和硬磁材料（肥大回线、高Hc、Mr、(BH)m）。"}, {"tag": "自发磁化条件", "q": "产生铁磁性（自发磁化）的基本条件是什么？为什么Mn、Cr不是铁磁性元素？", "points": "基本条件：①内壳层未被填满的原子或离子，使原子本征磁矩不为零；②点阵常数与电子壳层半径之比Rab/r>3，使电子交换积分A>0，相邻磁矩同向排列、交换能最小，即需具备一定的晶体结构，产生自发磁化。\nFe、Co、Ni的3d层分别有4、3和2个空位（未被抵消的自旋数），且A为较大的正值，表现为铁磁性；Mn、Cr虽在3d上有5个空位（满足第一条件），但不满足Rab/r>3（A不为正），所以不是铁磁性元素。通过合金化改变晶格常数可使Mn、Cr合金成为铁磁体（如Mn-Cr-Al、MnAs、MnSb、MnBi、CrTe）。"}, {"tag": "三类铁磁区别", "q": "简述铁磁性、亚铁磁性与反铁磁性的区别。", "points": "铁磁性：在某一宏观尺寸大小的范围内，原子磁矩的方向趋于一致（自发磁化），χ很大为正且非线性，如Fe、Co、Ni及其合金；T>TC后变顺磁体。\n亚铁磁性：大小不同的原子磁矩反平行排列，但二者没有完全抵消，χ类似铁磁体但值没那么大，如各种铁氧体（Fe₃O₄等）。\n反铁磁性：当电子交换积分A\u003c0时，相邻原子磁矩相等且反平行排列，相互抵消，不能形成自发磁化区域，自发磁化强度为零，χ是小的正数；低于尼尔点TN呈反铁磁性，高于TN行为象顺磁体（χ=C/(T+Θ)，Θ≈TN），如α-Mn、Cr、NiO、MnO等。"}]}, {"ch": 9, "title": "第九章 材料的电学性能", "sa": [{"tag": "名词解释", "q": "名词解释：电导率、电阻率；固体按电阻率分为哪三类？", "points": "电导率σ：表征材料导电能力的主要参量，欧姆定律微分形式J=σE，单位S/m。\n电阻率ρ：ρ=1/σ，单位Ω·m，有时用Ω·cm。\n固体按电阻率ρ的范围分三类：导体ρ\u003c10⁻² Ω·m；半导体ρ为10⁻²~10¹⁰ Ω·m；绝缘体ρ>10¹⁰ Ω·m。"}, {"tag": "导电机理", "q": "金属导电有哪三种理论？简述能带理论的基本概念。", "points": "三种理论：①经典自由电子理论——价电子完全自由弥散于晶格点阵中，有电场时沿电场方向运动形成电流，与金属离子碰撞形成电阻，导电性取决于自由电子数量、平均自由程、平均运动速度；②量子自由电子理论——价电子按量子化规律具有不同能量状态（能级），外电场使正反向运动的电子数量不等而导电，电磁波被离子点阵散射干涉而形成电阻，0 K时理想晶体中电子波传播不受阻碍、电阻为零（超导）；③能带理论——研究金属中价电子在周期势场作用下的能量分布。\n能带理论基本概念：能隙（能带分裂后某些能态电子不能取值）、禁带（电子不可具有的能级组成的能带）、允带（电子可具有的能级组成的能带）、导带（允带中未被填满的能级）、满带（允带中所有能级都被填满）；金属导带部分充填且能带重叠，半导体和绝缘体区别在禁带宽度。"}, {"tag": "超导电性", "q": "名词解释：超导电性；超导体的三大性能指标是什么？", "points": "超导电性：某些材料在临界温度以下进入以零阻值为特征的新物态（超导态）的性质；1911年昂内斯发现汞在4.2 K时直流电阻突然消失。\n两大特征：零电阻（直流，永久电流）和完全抗磁性（迈斯纳效应，内部磁通量保持为零）。\n三大性能指标：①临界转变温度Tc（越接近室温越好，金属氧化物Tc最高约140 K）；②临界磁场强度Hc，Hc(T)=Hc(0)(1-T²/Tc²)，超过时磁力线穿入破坏超导态；③临界电流密度Jc，要保持超导态须限制最大输入电流密度。三个值越大应用范围越广。"}, {"tag": "热电效应", "q": "简述三种热电效应（塞贝克效应、珀耳帖效应、汤姆逊效应）及其应用。", "points": "塞贝克效应（1821年）：两种不同金属构成闭合回路、两个接头存在温差时回路中产生电流，电流大小与金属种类、温差和电阻值有关；实质是接触电势差（取决于电子逸出功和有效电子密度）；是温差发电和热电偶测量的技术基础。\n珀耳帖效应（1834年）：塞贝克效应的逆效应，回路中存在直流电流时两个接头之间产生温差（吸热或放热），可逆，是电子致冷所依赖的效应；珀耳帖热与电流方向有关，焦耳热与方向无关。\n汤姆逊效应（1851年）：电流在温度不均匀的导体中流过时除焦耳热外还吸收或放出一定热量；反过来金属棒两端温度不同时形成电势差（自由电子热扩散）。应用：热电偶测温、温差发电、电致冷。"}, {"tag": "导电影响因素", "q": "影响材料导电性的主要因素有哪些？", "points": "①温度：温度升高离子振动加剧、电子自由程减小、散射率增加；德拜温度以上纯金属电阻率近似线性增加（α≈10⁻³/K），德拜温度以下ρ∝T⁵。\n②冷塑性变形和应力：冷塑性变形点阵畸变、缺陷增加，电阻增大；回复降低点缺陷浓度，再结晶消除点阵畸变和缺陷，淬火保留高温点缺陷；拉应力原子间距增大电阻增大、压应力减小。\n③合金化：固溶体ρ随溶质原子增多而增大（点阵畸变散射+有效电子数减少）；金属化合物ρ比组元小得多（键合性质改变）；多相合金ρ约为两相ρ的加权平均值（与组成相的导电性、相对含量及形貌有关）。"}, {"tag": "介电常数与击穿", "q": "名词解释：介电常数；介电击穿。绝缘材料有哪几种击穿形式？", "points": "介电常数ε：表征介质极化大小的宏观物理量以及电介质贮存电能能力的大小，为电容器有电介质时的电容同真空状态电容的比值。\n介电击穿：在强电场（10⁷~10⁸ V/m）中，随着电场强度进一步升高，材料突然从介电状态变成导电状态，绝缘材料丧失绝缘性能。\n击穿形式：①电击穿——强电场下少数自由电子撞击介质内离子产生次级电子、三级电子，连锁反应形成电子潮（雪崩），电流迅速增大而击穿，瞬息完成（约10⁻⁷~10⁻⁸秒）；②热击穿——部分电能损耗转为热能，介质受散热限制被急剧加热，温度超过一定限度出现烧裂、熔融等；③化学击穿——长期运行在高温、潮湿、高电压或腐蚀性气体环境下出现（离子式电导漏导损耗增大发热、封闭气孔引起气体电化学击穿两种机理）。"}, {"tag": "介质极化", "q": "介质极化有哪几种微观机制？各有什么特点？", "points": "①电子位移极化（形变极化）：外电场作用下原子外围电子云相对原子核发生位移或非均匀形变导致正负电荷重心分离；电子很轻、反应很快，可以光频（10¹⁴ Hz以上）跟随外电场变化，且与温度无关。\n②离子位移极化：离子晶体在电场作用下离子间键合被拉长、电偶极矩增加；离子质量大，极化建立时间约10⁻¹²~10⁻¹³秒，随温度变化增强。\n③松弛（弛豫）极化：弱联系电子、离子和偶极子等松弛质点在一定温度下电场作用占主导发生极化；有统计性质（热松弛极化），建立时间长（可达10⁻²~10⁻³秒）且需吸收能量，是不可逆过程，随温度变化有极大值，多发生在聚合物分子晶体缺陷处或玻璃体内（含电子松弛极化、离子松弛极化）。\n④偶极子取向极化：沿外场方向取向的固有偶极矩的偶极子数大于反向的偶极子数，出现宏观偶极矩；取向极化需要较长时间（约10⁻²~10⁻¹⁰秒），极化率比电子极化高2个数量级，随温度变化有极大值。"}]}, {"ch": 10, "title": "第十章 材料的耐蚀性能", "sa": [{"tag": "名词解释", "q": "名词解释：化学腐蚀；电化学腐蚀。", "points": "化学腐蚀：金属和化学介质直接产生化学反应造成的腐蚀，发生在非离子导体介质中（干燥气体、非电解质溶液），如铁在高温下的氧化4Fe+3O₂→Fe₂O₃；这种反应不产生腐蚀电流，在反应表面形成一层化学生成物。\n电化学腐蚀：金属表面与电解质溶液（离子导体介质）发生的反应，有腐蚀电流产生；典型情形如不同金属直接接触（铜与钢）、同一金属在浓差介质中的浓差电池、不同电位的显微组织形成的微电池（生锈、金相组织腐蚀）、成分不均匀（晶界与晶粒内部）、应力不均匀（铁丝弯曲处易蚀）等。"}, {"tag": "腐蚀形式", "q": "金属腐蚀按破坏形式主要分为哪几种？各有什么特点？", "points": "①均匀腐蚀：腐蚀均匀地在材料表面产生，损坏大量材料，容易发现，危害性不是很大。\n②点腐蚀：由于应力等原因使腐蚀集中在材料表面不大的区域，向深处发展，最后甚至能穿透金属。\n③晶界腐蚀：腐蚀过程沿晶界进行，危害性最大。\n④应力腐蚀：钢在拉应力状态下发生应力腐蚀破坏，没有什么预兆，危害性比较大。\n⑤磨损腐蚀：在腐蚀介质中同时有磨损，腐蚀和磨损相互促进、相互加速。"}, {"tag": "腐蚀原电池", "q": "名词解释：腐蚀原电池。说明其组成、过程及腐蚀破坏集中的区域。", "points": "腐蚀原电池：只能导致金属腐蚀而不能对外做功的短路原电池。\n4个组成部分：阳极、阴极、电解质溶液、电路。\n3个过程：阳极过程、阴极过程、电流流动（电流在阳极和阴极间流动）。\n金属的腐蚀破坏集中出现在阳极区。\n电化学腐蚀倾向判据：ΔG\u003c0腐蚀可能发生且越负越不稳定（ΔG=nFE，须阳极电位小于阴极电位）；ΔG只能判断倾向大小，不能判断腐蚀速度。"}, {"tag": "提高耐蚀途径", "q": "提高钢耐腐蚀性能的途径有哪些？为什么说“耐蚀是相对的”？", "points": "途径：①形成稳定保护膜，Cr、Al、Si有效；②提高固溶体电极电位或形成稳定钝化区，Cr、Ni、Si（Ni贵而紧缺、Si易使钢脆化，Cr是理想的）；③获得单相组织，Ni、Mn可获得单相奥氏体组织；④机械保护措施或覆盖层，如电镀、发兰、涂漆等。\n耐蚀的相对性：“耐蚀”是针对具体介质而言的，在某种介质中耐蚀，在另一介质中不一定耐蚀，没有完全不腐蚀的钢；必须根据工作介质的特点正确选择使用不锈耐蚀钢钢种。"}, {"tag": "晶间腐蚀", "q": "奥氏体不锈钢产生晶间腐蚀的原因是什么？防止晶间腐蚀可采取哪些措施？", "points": "原因：奥氏体不锈钢焊接后在腐蚀介质中工作时，在离焊缝不远处产生严重晶间腐蚀；在焊缝及热影响区（450~800℃）沿晶界析出了(Cr,Fe)₂₃C₆，晶界附近区域产生贫Cr区（低于1/8定律的临界值），导致晶间腐蚀。Ni、Co、Si促进产生晶间腐蚀，Mo、Ti、Nb、Mn、V能不同程度地阻止晶间腐蚀倾向；钢中含碳量提高，晶间腐蚀倾向增大。\n措施：①降低钢中的含C量；②加入Ti、Nb，析出特殊碳化物，稳定组织；③进行1050~1100℃的固溶处理，保证Cr含量；④对非稳定性A不锈钢进行退火处理，使奥氏体成分均匀化，消除贫Cr区；⑤对稳定性钢，通过热处理形成Ti、Nb的特殊碳化物，以稳定固溶体中Cr含量。"}, {"tag": "铁素体不锈钢脆性", "q": "高铬铁素体不锈钢的脆性主要有哪些方面？", "points": "①粗大的原始晶粒：由于原子扩散快，晶粒粗化温度低和粗化速率高，600℃以上晶粒就开始长大（奥氏体不锈钢相应为900℃）。\n②475℃脆性：当Cr>15%时随Cr含量升高脆化倾向增大，在400~525℃长时间加热或缓慢冷却时钢变得很脆，以475℃加热为最甚；原因是铬有序化形成α″相，与母相共格产生大内应力，使冲击韧度αK降低。\n③金属间化合物σ相的形成：σ相具有高硬度、大的体积效应，且常沿晶界分布，使钢产生很大脆性。"}]}], "appendix": [{"title": "课后作业（PPT第一章末）", "items": [["名词解释：弹性变形、弹性模量、弹性比功、塑性变形、形变强化", "弹性变形：原子（离子）或分子自平衡位置产生可逆位移的反应，卸载后变形恢复。弹性模量：σ=Eε的比例系数E，度量刚度、表征对弹性变形的抗力，组织不敏感。塑性变形：微观结构相邻部分产生永久性位移而不引起材料破裂的现象，主要形式为滑移和孪生。形变强化：进入塑性变形后随变形量增大变形应力不断提高的现象（Hollomon方程S=Kεp^n）。注：弹性比功课件未展开定义，建议按教材补充（弹性变形阶段单位体积材料吸收的变形功）。"], ["金属材料的强度和塑性之间的关系", "一般材料的强度和塑性相互矛盾：塑性好的材料往往强度不高。强度表征抵抗变形和断裂的能力，塑性表征断裂前产生塑性变形的能力，两者共同决定韧性（断裂前吸收能量进行塑性变形的能力），工程上需综合权衡。"], ["提高金属材料屈服强度的思路和途径有哪些？", "内在因素对应四种强化机制：（1）固溶强化（溶质元素引起晶格畸变）；（2）形变强化（应变硬化）；（3）沉淀强化和弥散强化；（4）晶界和亚晶界强化（细化晶粒，Hall-Petch关系）。外在因素：降低温度、提高应变速率、改变应力状态等。"], ["体现金属材料塑性的指标有哪些？塑性变形对金属材料的工程意义？", "指标：伸长率δ、断面收缩率Ψ。工程意义：（1）塑性好可保证轧制、拉拔、挤压等成型工艺顺利进行；（2）塑性好使零部件使用中安全可靠，工作应力超出屈服强度也不至于突然破坏。"]]}, {"title": "课后作业（PPT第四章末）", "items": [["经退火后的某碳钢晶粒大小为每平方毫米16个时，疲劳强度σ-1=100MPa；每平方毫米4096个时σ-1=250MPa。试求晶粒大小为每平方毫米256个时的σ-1。", "解答：疲劳强度与晶粒尺寸满足类Hall-Petch关系σ-1=σ0+k·d^(-1/2)。设每平方毫米晶粒数为n，晶粒面积∝1/n，则d∝n^(-1/2)，d^(-1/2)∝n^(1/4)。n=16→n^(1/4)=2，σ-1=100；n=4096→n^(1/4)=8，σ-1=250。斜率k=(250-100)/(8-2)=25，σ0=100-25×2=50。n=256→n^(1/4)=4，σ-1=50+25×4=150MPa。"]]}, {"title": "课后作业（PPT第六章末，其中第3、4题对应第五章内容）", "items": [["以上指标的含义？（蠕变极限、持久强度、应力松弛）", "蠕变极限：高温长时间载荷下机件不产生过量塑性变形的抗力指标（规定蠕变速率或规定时间应变量两种表示）；持久强度：规定温度时间内不发生蠕变断裂的最大应力σtT；应力松弛：总应变保持不变而应力随时间自行降低的现象，材料抵抗能力称松弛稳定性。"], ["细晶强化为什么不适用于高温服役材料？", "常温下细化晶粒（晶界强化）可同时提高强度、硬度和塑性；但高温下晶界强度降低比晶体快，等强温度以上晶界强度低，晶间断裂成为普遍形式，细化晶粒增加晶界面积反而使强度下降、蠕变极限和持久强度降低，故应粗化晶粒（减少晶界面积和高能晶界）。"], ["简述材料在磨损过程中不同阶段的磨损行为差别。", "跑合阶段：表面粗糙、真实接触面积小、磨损速率大后趋稳；稳定磨损阶段：表面平滑、磨损速率基本恒定、磨损量低；剧烈磨损阶段：间隙扩大、磨损速率急剧增加，温度升高、精度丧失直至失效。"], ["接触疲劳磨损的失效机制及分类。", "机制：接触综合切应力高于材料接触疲劳强度，在最大切应力处（次表层Z=0.786b约0.3σzmax，摩擦系数>0.2时移到表面）长期循环萌生裂纹并扩展剥落。分类：点蚀（0.1~0.2mm）、浅层剥落（0.2~0.4mm）、深层剥落（>0.4mm）。"]]}, {"title": "课后作业（PPT第九章末）", "items": [["名词解释：杜隆—珀替定律、柯普定律、德拜热容理论。", "杜隆—珀替定律：大多数固态单质的原子热容几乎都相等，1mol单原子固体的摩尔定容热容Cv,m=3R≈25J/(K·mol)，即固体热容是与温度无关的常数；适用于高温区（室温适用于大多数金属和一些非金属），低温时相差很大。\n柯普定律：化合物分子热容等于构成此化合物各元素原子热容之和，C=ΣniCi；在较高温度下固体热容具有加和性，对573K以上大多数氧化物和硅酸盐化合物符合较好。\n德拜热容理论：考虑原子间相互作用、把晶体看作连续介质，原子振动谱0~νmax；低温时得德拜T立方定律Cv∝T³，与实验非常相符；不足是低温、高温不完全相符，解释不了超导现象。"], ["叙述固体的三种导热方式及影响材料热传导性能的因素。", "三种导热方式：①自由电子运动导热λe=Ceυele/3（金属主要）；②晶格振动（声子）导热λρ=Cρυρlρ/3（非金属主要）；③光子辐射导热λr=16σn²T³lr/3。\n影响因素：①纯金属（电导率高则热导率高；晶粒粗大热导率高；立方晶系与晶向无关、非立方晶系各向异性；杂质强烈影响）；②温度（晶体材料在常用温度范围λ随温度升高而下降）；③晶体结构（结构越复杂导热率越低、有方向性；多晶\u003c单晶；非晶态小）；④化学组成（轻元素、结合能大导热率大；溶质浓度增加导热率降低，连续互溶固溶体在50%浓度处最低）；⑤气孔（气孔率升高导热率降低）。"], ["画出常见材料的几种磁化曲线及其对应的典型金属材料。", "（画图题，参考PPT第八章）抗磁体：B-H曲线略低于直线（μr略小于1），典型Cu、Ag、Au、Hg、Zn、Bi；顺磁体：B-H曲线略高于直线（μr略大于1），典型Al、Pt、Pd、奥氏体不锈钢、稀土金属；铁磁体：B-H曲线非线性（磁化曲线三阶段加磁滞回线，μr>>1），典型Fe、Co、Ni及硅钢；亚铁磁体曲线类似铁磁体但饱和值较低（Fe₃O₄、铁氧体）。"], ["自发磁化的基本条件。", "①内壳层未被填满的原子或离子，使原子本征磁矩不为零（Fe、Co、Ni的3d层分别有4、3、2个空位）；②点阵常数与电子壳层半径之比Rab/r>3，使电子交换积分A>0，相邻磁矩同向排列、交换能最小，即需具备一定的晶体结构、能产生自发磁化。Mn、Cr满足第一条件但不满足第二条件，需通过合金化改变晶格常数才能成为铁磁体（如Mn-Cr-Al、MnAs、MnSb、MnBi、CrTe）。"]]}]};

/* ========== 常量与状态 ========== */
const TYPE_NAME = {mcq:"单选题", fill:"填空题", sa:"简答/辨析"};
const LS_KEY = "msxb_prop_v1";
let state = loadState();

function emptyState(){
  return {answers:{}, wrong:[], fav:[], stats:{done:0, ok:0, byCh:{}, firstAt:{}}, cards:{}};
}
function loadState(){
  let s = emptyState();
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ Object.assign(s, JSON.parse(raw)); }
  }catch(e){}
  migrateLegacy(s);
  return s;
}
/* 旧版本记录迁移：数字键 → id 键；旧键名合并 */
function migrateLegacy(s){
  let changed = false;
  const legacy = {answers:["msxb_answers","answers"], wrong:["msxb_wrong","wrong"],
                  fav:["msxb_fav","fav"], cards:["msxb_cards","cards"]};
  for(const k in legacy){
    for(const key of legacy[k]){
      try{
        const raw = localStorage.getItem(key);
        if(raw){
          const obj = JSON.parse(raw);
          if(k==="answers"){
            for(const qk in obj){
              if(/^\d+$/.test(qk)){ const id="q"+qk; if(!s.answers[id]){s.answers[id]=obj[qk];} changed=true; }
              else if(!s.answers[qk]){ s.answers[qk]=obj[qk]; changed=true; }
            }
          }else if(Array.isArray(obj)){
            for(const it of obj){
              const id = /^\d+$/.test(String(it)) ? "q"+it : it;
              if(!s[k].includes(id)){ s[k].push(id); changed=true; }
            }
          }
          localStorage.removeItem(key); changed = true;
        }
      }catch(e){}
    }
  }
  if(changed) saveState();
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

function renderNav(){
  const nav = $("#nav"); nav.innerHTML = "";
  NAV_DEFS.forEach(d=>{
    if(d.type==="label"){
      const g = document.createElement("div"); g.className="group"; g.textContent=d.text; nav.appendChild(g);
    }else if(d.type==="ch"){
      const b = document.createElement("button");
      b.className="item"; b.innerHTML = ICONS["ch"+d.no] + '<span>'+esc(d.label)+'</span><span class="cnt">'+countOfCh(d.no)+'</span>';
      b.onclick = ()=>{ mode="chapter"; curChapter=d.no; sIdx=0; session=[]; sessionAns={}; render(); };
      if(mode==="chapter" && curChapter===d.no) b.classList.add("on");
      nav.appendChild(b);
    }else{
      const b = document.createElement("button");
      b.className="item"; b.innerHTML = (ICONS[d.icon]||"") + '<span>'+esc(d.label)+'</span>';
      b.onclick = ()=>{ enterMode(d.key); };
      if(mode===d.key) b.classList.add("on");
      nav.appendChild(b);
    }
  });
}
function countOfCh(no){
  return QUESTIONS.filter(q=>q.ch===no).length;
}

function enterMode(m){
  mode = m; sIdx = 0; session = []; sessionAns = {}; cardsSession = [];
  render();
}

/* ========== 移动端底部 TabBar ========== */
const MTABS = [
  {key:"random", label:"随机", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>'},
  {key:"chapter", label:"章节", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-6 3 3 4-7"/></svg>'},
  {key:"wrong", label:"错题", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'},
  {key:"fav", label:"收藏", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'},
  {key:"stats", label:"统计", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>'},
];
function renderMTabbar(){
  const bar = document.getElementById("mTabbar"); if(!bar) return;
  bar.innerHTML = MTABS.map(t=>
    '<button class="mtab'+(mode===t.key?' on':'')+'" data-k="'+t.key+'">'+t.icon+'<span>'+t.label+'</span></button>'
  ).join("");
  bar.querySelectorAll(".mtab").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k;
      if(k==="chapter"){ showMSheet(); }
      else { enterMode(k); closeMSheet(); }
    };
  });
}
function showMSheet(){
  const sheet = document.getElementById("mSheet"), mask = document.getElementById("mMask");
  if(!sheet) return;
  const chs = CHAPTERS.map(c=>'<button class="sh-ch" data-no="'+c.no+'">'+ICONS["ch"+c.no]+'<span>'+c.title.replace(/^第[一二三四五六七八九十百]+章\s*/,"")+'</span><span class="cnt">'+countOfCh(c.no)+'题</span></button>').join("");
  sheet.innerHTML = '<div class="sh-h"><span>选择章节</span><button class="sh-x" id="shX">×</button></div><div class="sh-grid">'+chs+'</div>';
  sheet.querySelectorAll(".sh-ch").forEach(b=>{
    b.onclick = ()=>{
      mode="chapter"; curChapter=+b.dataset.no; sIdx=0; session=[]; sessionAns={};
      closeMSheet(); render();
    };
  });
  document.getElementById("shX").onclick = closeMSheet;
  if(mask) mask.classList.add("show");
  sheet.classList.add("show");
}
function closeMSheet(){
  const mask = document.getElementById("mMask"), sheet = document.getElementById("mSheet");
  if(mask) mask.classList.remove("show");
  if(sheet) sheet.classList.remove("show");
}
(function(){ const m = document.getElementById("mMask"); if(m) m.onclick = closeMSheet; })();

/* ========== 会话构建 ========== */
function buildSession(){
  let ids = [];
  if(mode==="chapter"){
    ids = QUESTIONS.filter(q=>q.ch===curChapter).map(q=>q.id);
  }else if(mode==="random"){
    const all = QUESTIONS.map(q=>q.id);
    for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    ids = all;
  }else if(mode==="wrong"){
    ids = state.wrong.slice();
  }else if(mode==="fav"){
    ids = state.fav.slice();
  }else if(mode==="cards"){
    ids = QUESTIONS.map(q=>q.id);
  }
  return ids;
}

/* ========== 渲染主视图 ========== */
function render(){
  renderNav();
  renderMTabbar();
  updateSideFoot();
  if(mode==="stats"){ renderStats(); return; }
  if(mode==="docs"){ renderDocs(); return; }
  if(session.length===0) session = buildSession();
  if(mode==="cards"){ renderCards(); return; }
  if(session.length===0){ renderEmpty(); return; }
  if(sIdx>=session.length) sIdx = 0;
  renderQuestion(sIdx);
}

function renderEmpty(){
  $("#pageTitle").textContent = {wrong:"错题本", fav:"我的收藏"}[mode] || "刷题";
  $("#pageCrumb").textContent = "暂无题目";
  $("#progressWrap").style.display="none";
  const v = $("#view");
  const msg = mode==="wrong" ? "错题本是空的，做完并答错的题会自动收录" : "收藏夹是空的，答题时点星标即可收藏";
  v.innerHTML = '<div class="empty"><div class="t">'+msg+'</div><div>答对后可在这里复习巩固</div></div>';
}

function setProgress(){
  $("#progressWrap").style.display = (mode==="cards") ? "none" : "block";
  if(mode==="cards") return;
  const total = session.length, cur = Math.min(sIdx+1, total);
  $("#progText").textContent = cur + " / " + total;
  $("#progPct").textContent = Math.round(cur/total*100) + "%";
  $("#progBar").style.width = (cur/total*100) + "%";
}

function renderQuestion(i){
  const q = qById(session[i]);
  setProgress();
  const ch = CHAPTERS_BY_NO[q.ch];
  $("#pageTitle").textContent = modeTitle();
  $("#pageCrumb").textContent = ch.title + " · 考点：" + q.tag;
  const v = $("#view");
  const answered = !!state.answers[q.id];
  v.innerHTML = questionCardHTML(q, answered);

  // 绑定事件
  if(q.type==="mcq") bindMcq(q);
  else if(q.type==="fill") bindFill(q);
  else bindSa(q);
  bindCommon(q);
}

function modeTitle(){
  if(mode==="chapter") return "按章节刷题";
  if(mode==="random") return "随机刷题";
  if(mode==="wrong") return "错题本";
  if(mode==="fav") return "我的收藏";
  return "刷题";
}

function questionCardHTML(q, answered){
  const ch = CHAPTERS_BY_NO[q.ch];
  let body = "";
  if(q.type==="mcq"){
    body = '<div class="opts" id="opts">' + q.opts.map((o,ix)=>{
      const letter = "ABCD"[ix];
      const cls = answered ? (letter===q.ans ? " right dis" : (state.answers[q.id] && state.answers[q.id].v===letter ? " wrong dis" : " dis"))
                            : "";
      return '<button class="opt'+cls+'" data-k="'+letter+'"><span class="key">'+letter+'</span><span>'+esc(o)+'</span></button>';
    }).join("") + '</div>';
    if(answered){ body += feedbackHTML(q); }
  }else if(q.type==="fill"){
    const cur = answered ? esc(state.answers[q.id].v || "") : "";
    body = '<div class="fill-row">' +
      '<input class="fill-input" id="fillIn" placeholder="输入答案后提交" value="'+cur+'" '+(answered?"disabled":"")+'>' +
      '<button class="btn btn-pri" id="fillOk">提交</button></div>';
    if(answered){ body += feedbackHTML(q); }
  }else{
    body = '<div class="rate-row" id="saRate" style="margin-top:0">' +
      '<button class="btn btn-ghost" id="saShow">查看参考答案</button></div>';
    if(answered){ body += feedbackHTML(q, true); }
  }

  const favOn = state.fav.includes(q.id) ? " on" : "";
  const starIco = '<svg width="14" height="14" viewBox="0 0 24 24" fill="'+(state.fav.includes(q.id)?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

  return '<div class="card">' +
    '<div class="q-head"><span class="badge b-'+q.type+'">'+TYPE_NAME[q.type]+'</span>' +
    '<span class="q-no">'+q.id+'</span><span class="q-tag">'+esc(q.tag)+'</span></div>' +
    '<div class="q-text">'+formatStem(q.q)+'</div>' + body +
    '<div class="q-foot"><div class="links">' +
    '<button class="iconbtn'+favOn+'" id="btnFav">'+starIco+'收藏</button>' +
    (mode==="wrong" ? '<button class="iconbtn" id="btnUnWrong">移出错题本</button>' : "") +
    '</div><div class="navbtns">' +
    '<button class="btn btn-line" id="btnPrev">上一题</button>' +
    '<button class="btn btn-pri" id="btnNext">下一题</button></div></div></div>';
}

function formatStem(s){
  return esc(s).replace(/____/g, '<span class="blank">____</span>');
}

function feedbackHTML(q, isSa){
  let ansLine = "";
  if(q.type==="mcq") ansLine = '正确答案：<span class="f-ans">'+q.ans+'</span>';
  else if(q.type==="fill") ansLine = '参考答案：<span class="f-ans">'+esc(q.ans[0])+'</span>';
  const ok = q.type==="sa" ? true : (state.answers[q.id] && state.answers[q.id].ok);
  const title = q.type==="sa" ? "参考答案要点" : (ok ? "回答正确" : "回答错误，记住这个考点");
  const cls = q.type==="sa" ? "ok" : (ok ? "ok" : "no");
  let extra = "";
  if(q.type==="sa"){
    const r = state.answers[q.id] && state.answers[q.id].rate;
    extra = '<div class="rate-row"><button class="btn btn-ghost" data-rate="good">已掌握</button>' +
            '<button class="btn btn-ghost" data-rate="ok">模糊</button>' +
            '<button class="btn btn-ghost" data-rate="bad">未掌握</button></div>';
    if(r){ extra = '<div class="rate-row"><span style="font-size:13px;color:var(--ink3)">自评：'+({good:"已掌握",ok:"模糊",bad:"未掌握"}[r])+'（可重新自评）</span></div>' + extra.replace('<div class="rate-row">','<div class="rate-row" style="display:none">'); }
  }
  return '<div class="feedback show '+cls+'" id="fb">' +
    '<div class="f-title">'+title+'</div>' + ansLine +
    '<div class="f-points">'+esc(q.points)+'</div>' + extra + '</div>';
}

/* ========== 答题交互 ========== */
function bindMcq(q){
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>{
      if(state.answers[q.id]) return;
      const k = b.dataset.k;
      const ok = k===q.ans;
      recordAnswer(q, {t:"mcq", v:k, ok});
      rerenderCurrent();
    };
  });
}
function bindFill(q){
  const okBtn = $("#fillOk");
  const onCheck = ()=>{
    if(state.answers[q.id]) return;
    const val = $("#fillIn").value;
    if(!norm(val)){ toast("请先输入答案"); return; }
    const ok = q.ans.some(a=>norm(a)===norm(val) || norm(a).includes(norm(val)) || norm(val).includes(norm(a)));
    recordAnswer(q, {t:"fill", v:val, ok});
    rerenderCurrent();
  };
  okBtn.onclick = onCheck;
  $("#fillIn").addEventListener("keydown", e=>{ if(e.key==="Enter") onCheck(); });
}
function bindSa(q){
  const show = $("#saShow");
  show.onclick = ()=>{
    state.answers[q.id] = Object.assign({}, state.answers[q.id], {t:"sa", v:"", ok:true, shown:true});
    saveState(); rerenderCurrent();
  };
  const fb = $("#fb");
  if(fb){
    fb.querySelectorAll("[data-rate]").forEach(b=>{
      b.onclick = ()=>{
        state.answers[q.id] = Object.assign({}, state.answers[q.id], {rate:b.dataset.rate});
        saveState(); rerenderCurrent();
      };
    });
  }
}
function bindCommon(q){
  $("#btnFav").onclick = ()=>{
    const i = state.fav.indexOf(q.id);
    if(i>=0){ state.fav.splice(i,1); toast("已取消收藏"); }
    else{ state.fav.push(q.id); toast("已收藏，可在「我的收藏」复习"); }
    saveState(); renderNav(); updateSideFoot();
    const fb = $("#btnFav");
    if(fb){ fb.classList.toggle("on", state.fav.includes(q.id)); }
  };
  const ub = $("#btnUnWrong");
  if(ub){
    ub.onclick = ()=>{
      const i = state.wrong.indexOf(q.id);
      if(i>=0){ state.wrong.splice(i,1); saveState(); }
      session.splice(sIdx,1);
      if(session.length===0){ render(); return; }
      if(sIdx>=session.length) sIdx = session.length-1;
      renderQuestion(sIdx);
    };
  }
  $("#btnPrev").onclick = ()=>{
    if(sIdx>0){ sIdx--; renderQuestion(sIdx); }
    else toast("已经是第一题");
  };
  $("#btnNext").onclick = ()=>{
    if(sIdx<session.length-1){ sIdx++; renderQuestion(sIdx); }
    else if(mode!=="chapter"){ toast("本轮已结束"); render(); }
    else { sIdx=0; renderQuestion(0); }
  };
}

function recordAnswer(q, rec){
  state.answers[q.id] = Object.assign({}, state.answers[q.id], rec, {ts:Date.now()});
  if(!sessionAns[q.id]){
    sessionAns[q.id] = true;
    state.stats.done++;
    if(rec.ok) state.stats.ok++;
    const key = String(q.ch);
    state.stats.byCh[key] = state.stats.byCh[key] || {a:0,o:0};
    state.stats.byCh[key].a++;
    if(rec.ok) state.stats.byCh[key].o++;
  }
  if(q.type!=="sa"){
    const wi = state.wrong.indexOf(q.id);
    if(rec.ok){ if(wi>=0) state.wrong.splice(wi,1); }
    else if(wi<0){ state.wrong.push(q.id); }
  }
  saveState(); renderNav(); updateSideFoot();
}
function rerenderCurrent(){ renderQuestion(sIdx); }

function updateSideFoot(){
  $("#sfDone").textContent = state.stats.done;
  $("#sfAcc").textContent = state.stats.done ? Math.round(state.stats.ok/state.stats.done*100)+"%" : "—";
  $("#sfWrong").textContent = state.wrong.length;
  $("#sfFav").textContent = state.fav.length;
}

/* ========== 页内复习资料（Word 内容内嵌，无需外部文件） ========== */
function renderDocs(){
  $("#pageTitle").textContent = "复习资料（页内版）";
  $("#pageCrumb").textContent = "Word 内容已内置本页 · 知识点 / 题库 / 简答 / 附录";
  $("#progressWrap").style.display = "none";
  const v = $("#view");
  v.innerHTML = docsHTML();
}

function docChHTML(ch){
  let h = '<div class="doc-ch">'+esc(ch.title)+'</div>';
  h += '<div class="doc-intro">'+esc(ch.intro)+'</div>';
  h += '<div class="doc-h3">知识框架要点</div>';
  ch.points.forEach(p=>{ h += '<div class="doc-point"><b>【'+esc(p[0])+'】</b>'+esc(p[1])+'</div>'; });
  h += '<div class="doc-h3">易混名词辨析</div>';
  h += '<table class="d-table"><tr><th>概念对</th><th>核心区别</th></tr>';
  ch.disc.forEach(d=>{ h += '<tr><td>'+esc(d[0])+'</td><td>'+esc(d[1])+'</td></tr>'; });
  h += '</table>';
  return h;
}

function docBankHTML(ch){
  let h = '<div class="doc-ch">'+esc(ch.title)+'</div>';
  h += '<div class="doc-h3">一、单选题</div>';
  ch.mcq.forEach(q=>{
    h += '<div class="d-q"><div class="d-qhead"><span class="d-type mcq">单选题</span><span class="d-tag">考点：'+esc(q.tag)+'</span></div>' +
         '<div class="d-qtext">'+formatStem(q.q)+'</div>' +
         '<div class="d-opts">'+q.opts.map((o,i)=>esc("ABCD"[i]+"．"+o)).join("<br>")+'</div>' +
         '<details class="d-ans"><summary>答案与解析</summary><div class="a-line">答案：'+esc(q.ans)+'</div><div class="p-line">'+esc(q.points)+'</div></details></div>';
  });
  h += '<div class="doc-h3">二、填空题</div>';
  ch.fill.forEach(q=>{
    h += '<div class="d-q"><div class="d-qhead"><span class="d-type fill">填空题</span><span class="d-tag">考点：'+esc(q.tag)+'</span></div>' +
         '<div class="d-qtext">'+formatStem(q.q)+'</div>' +
         '<details class="d-ans"><summary>答案与解析</summary><div class="a-line">参考答案：'+esc(q.ans.join(" / "))+'</div><div class="p-line">'+esc(q.points)+'</div></details></div>';
  });
  return h;
}

function docSAHTML(ch){
  let h = '<div class="doc-ch">'+esc(ch.title)+'</div>';
  ch.sa.forEach((q,i)=>{
    h += '<div class="d-sa-q">'+(i+1)+'. '+formatStem(q.q)+'（考点：'+esc(q.tag)+'）</div>';
    h += '<div class="d-block"><div class="lb">参考答案要点</div>'+esc(q.points).replace(/\n/g,"<br>")+'</div>';
  });
  return h;
}

function docsHTML(){
  const st = DOCS_DATA.stats;
  const rows = [];
  let tot = {mcq:0, fill:0, sa:0, total:0};
  for(let c=1;c<=6;c++){
    const s = st[c];
    rows.push('<tr><td>第'+c+'章</td><td>'+s.mcq+'</td><td>'+s.fill+'</td><td>'+s.sa+'</td><td>'+s.total+'</td></tr>');
    tot.mcq+=s.mcq; tot.fill+=s.fill; tot.sa+=s.sa; tot.total+=s.total;
  }
  rows.push('<tr><td>合计</td><td>'+tot.mcq+'</td><td>'+tot.fill+'</td><td>'+tot.sa+'</td><td>'+tot.total+'</td></tr>');

  let h = '<div class="docs">';
  h += '<div class="docs-toolbar">' +
    '<button class="btn btn-pri" onclick="enterMode(\'chapter\')">返回刷题</button>' +
    '<span class="jump">跳转：</span>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dp1\').scrollIntoView()">第一部分 · 知识点</button>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dp2\').scrollIntoView()">第二部分 · 题库</button>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dp3\').scrollIntoView()">第三部分 · 简答专题</button>' +
    '<button class="btn btn-line" onclick="document.getElementById(\'dap\').scrollIntoView()">附录 · 思考题</button>' +
    '</div>';

  h += '<div class="doc-h3">题库构成一览</div><table class="d-table">' +
    '<tr><th>章节</th><th>单选题</th><th>填空题</th><th>简答/辨析</th><th>合计</th></tr>' +
    rows.join("") + '</table>';

  h += '<div class="doc-sec" id="dp1">第一部分　章节知识点梳理</div>';
  DOCS_DATA.part1.forEach(ch=>{ h += docChHTML(ch); });

  h += '<div class="doc-sec s2" id="dp2">第二部分　快速记忆题库</div>';
  DOCS_DATA.part2.forEach(ch=>{ h += docBankHTML(ch); });

  h += '<div class="doc-sec s2" id="dp3">第三部分　简答题与名词解释专题（考试重点）</div>';
  DOCS_DATA.part3.forEach(ch=>{ h += docSAHTML(ch); });

  h += '<div class="doc-sec s2" id="dap">附录　课后思考题参考</div>';
  h += '<div class="d-note">以下题目来自课程PPT各章末尾的作业/思考题，按章节归类整理，参考答案基于课件内容编写；课件未展开的概念已注明。</div>';
  DOCS_DATA.appendix.forEach(ap=>{
    h += '<div class="doc-ch">'+esc(ap.title)+'</div>';
    ap.items.forEach((it,i)=>{
      h += '<div class="d-sa-q">'+(i+1)+'. '+formatStem(it[0])+'</div>';
      h += '<div class="d-block"><div class="lb">参考答案</div>'+esc(it[1]).replace(/\n/g,"<br>")+'</div>';
    });
  });
  h += '<div class="empty" style="padding:26px 0 10px"><div class="t">已到底部</div><div>本页为 Word 复习资料的内容内嵌版，无需再打开外部文件。</div></div>';
  h += '</div>';
  return h;
}

/* ========== 统计视图 ========== */
function renderStats(){
  $("#pageTitle").textContent = "答题统计";
  $("#pageCrumb").textContent = "学习进度一览";
  $("#progressWrap").style.display = "none";
  const acc = state.stats.done ? Math.round(state.stats.ok/state.stats.done*100) : 0;
  const doneTotal = QUESTIONS.length;
  let mastered = 0, fuzzy = 0, unlearned = 0;
  Object.keys(state.cards).forEach(id=>{
    const r = state.cards[id];
    if(r==="good") mastered++; else if(r==="ok") fuzzy++; else unlearned++;
  });
  const v = $("#view");
  let rows = CHAPTERS.map(c=>{
    const s = state.stats.byCh[c.no] || {a:0,o:0};
    const n = countOfCh(c.no);
    const pct = n? Math.round(s.a/n*100) : 0;
    return '<div class="ch-row"><span class="ch-name">'+esc(c.title)+'</span>' +
      '<span class="ch-bar"><i style="width:'+pct+'%"></i></span>' +
      '<span class="ch-num">已答 '+s.a+'/'+n+' · 正确 '+s.o+' · 正确率 '+(s.a?Math.round(s.o/s.a*100):0)+'%</span></div>';
  }).join("");
  v.innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat"><div class="k">累计答题</div><div class="v">'+state.stats.done+'<small> / '+doneTotal+'</small></div></div>' +
      '<div class="stat accent"><div class="k">正确率</div><div class="v">'+acc+'<small>%</small></div></div>' +
      '<div class="stat"><div class="k">错题本</div><div class="v">'+state.wrong.length+'</div></div>' +
      '<div class="stat"><div class="k">掌握 · 模糊 · 未掌握</div><div class="v">'+mastered+' · '+fuzzy+' · '+unlearned+'</div></div>' +
    '</div>' +
    '<div class="card ch-stats"><div class="q-head"><span class="badge b-mcq">各章进度</span></div>'+rows+'</div>' +
    '<div class="empty" style="padding:34px 0 10px"><div class="t">提示</div><div>答题与自评记录自动保存在本机浏览器（localStorage），换设备或清缓存会丢失；重新加题时记录会自动迁移保留。</div></div>';
}

/* ========== 速记卡片 ========== */
function renderCards(){
  $("#pageTitle").textContent = "速记卡片";
  $("#pageCrumb").textContent = "翻牌回忆 · 自评掌握程度";
  $("#progressWrap").style.display = "none";
  const v = $("#view");
  if(cardsSession.length===0){
    cardsSession = QUESTIONS.slice();
    for(let i=cardsSession.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cardsSession[i],cardsSession[j]]=[cardsSession[j],cardsSession[i]]; }
  }
  if(cardsSession.length===0){ renderEmpty(); return; }
  const q = cardsSession[0];
  const ch = CHAPTERS_BY_NO[q.ch];
  const back = q.type==="mcq" ? ("正确答案："+q.ans+"　"+q.opts["ABCD".indexOf(q.ans)]+"\n\n"+q.points)
            : q.type==="fill" ? ("参考答案："+q.ans.join(" / ")+"\n\n"+q.points)
            : q.points;
  v.innerHTML =
    '<div class="flash-wrap"><div class="flash" id="flash">' +
      '<div class="f-front"><div class="cap">'+ch.title+' · '+TYPE_NAME[q.type]+' · '+esc(q.tag)+'</div>' +
        '<div class="big">'+formatStem(q.q)+'</div></div>' +
      '<div class="f-back"><div class="cap">参考答案</div><div class="back-body">'+esc(back)+'</div></div>' +
    '</div>' +
    '<div class="flash-ctl">' +
      '<button class="btn btn-ghost" id="flip">翻看答案</button>' +
      '<button class="btn btn-ghost" data-rate="good">已掌握</button>' +
      '<button class="btn btn-ghost" data-rate="ok">模糊</button>' +
      '<button class="btn btn-ghost" data-rate="bad">未掌握</button>' +
    '</div></div>';
  $("#flip").onclick = ()=>{ $("#flash").classList.toggle("flipped"); };
  v.querySelectorAll("[data-rate]").forEach(b=>{
    b.onclick = ()=>{
      state.cards[q.id] = b.dataset.rate;
      saveState(); cardsSession.shift(); renderCards();
    };
  });
}

/* ========== 启动 ========== */
const __chipT = document.getElementById("chipTotal");
const __chipC = document.getElementById("chipChs");
if(__chipT){ __chipT.textContent = QUESTIONS.length + " 题"; }
if(__chipC){ __chipC.textContent = Object.keys(CHAPTERS_BY_NO).length + "章全覆盖"; }
/* 移动端打开即刷题：小屏/手机默认直接进入随机刷题 */
if(/Android|iPhone|iPad|iPod|Mobile|MicroMessenger|Opera Mini/i.test(navigator.userAgent) || innerWidth<=860){
  mode = "random";
}
render();
</script>
