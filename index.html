, "Hc(T)=Hc(0)exp(-T/Tc)"], "ans": "A", "points": "临界磁场强度Hc超过时磁力线穿入超导体、破坏超导态，经验公式Hc(T)=Hc(0)(1-T²/Tc²)；超导体的三个性能指标为临界转变温度Tc、临界磁场强度Hc和临界电流密度Jc。", "id": "q234"}, {"ch": 9, "type": "mcq", "tag": "塞贝克效应", "q": "两种不同的金属构成闭合回路，当两个接头存在温差时回路中将产生电流，这一效应称为（　）。", "opts": ["珀耳帖效应", "塞贝克效应", "汤姆逊效应", "霍尔效应"], "ans": "B", "points": "塞贝克效应（1821年）：两种不同金属构成闭合回路、两个接头存在温差时回路中产生电流，电流大小与接合金属种类、温差和电阻值有关；是温差发电和热电偶测量的技术基础。其实质是两种金属接触时产生接触电势差，取决于电子逸出功和有效电子密度。", "id": "q235"}, {"ch": 9, "type": "mcq", "tag": "珀耳帖效应", "q": "珀耳帖效应是指（　）。", "opts": ["温差产生电流", "金属棒两端温度不同时形成电势差", "回路中存在直流电流时，两种金属接头之间产生温差（电流引起吸热或放热）", "强磁场下半导体电阻变化"], "ans": "C", "points": "珀耳帖效应（1834年）是塞贝克效应的逆效应：两种不同金属构成闭合回路，回路中存在直流电流时两个接头之间将产生温差；是可逆效应，由于电流引起吸热或放热，是电子致冷所依赖的效应。珀耳帖热与电流方向有关，焦耳热与方向无关。", "id": "q236"}, {"ch": 9, "type": "fill", "tag": "电阻率单位", "q": "电阻率ρ的单位为____（填写单位）。", "ans": ["Ω·m"], "points": "电阻率ρ的单位为Ω·m，有时用Ω·cm；电导率σ=1/ρ，单位S/m。", "id": "q237", "opts": []}, {"ch": 9, "type": "fill", "tag": "欧姆定律", "q": "欧姆定律的微分形式为J=____。", "ans": ["σE"], "points": "J=σE，J为电流密度、E为电场，表明导体中任意一点的电流密度与该点的电场强度成正比，且方向相同。", "id": "q238", "opts": []}, {"ch": 9, "type": "fill", "tag": "禁带", "q": "电子不可以具有的能级所组成的能带称为____。", "ans": ["禁带"], "points": "能带理论中：禁带是电子不可以具有的能级组成的能带；允带是电子可以具有的能级组成的能带（允带中每个能级只能允许两个自旋相反的电子存在）；导带是允带中未被填满电子的能级；满带是允带中所有能级都被电子填满。", "id": "q239", "opts": []}, {"ch": 9, "type": "fill", "tag": "导带", "q": "允带中未被填满电子的能级称为____。", "ans": ["导带"], "points": "导带是允带中未被填满电子的能级；金属材料中导带被部分充填因而具有电子导电性，半导体和绝缘体的导带都是空的。", "id": "q240", "opts": []}, {"ch": 9, "type": "fill", "tag": "低温电阻率", "q": "德拜温度以下，纯金属的电阻率ρ∝____（填写温度幂次）。", "ans": ["T5", "T^5"], "points": "德拜温度以上纯金属电阻率近似线性增加（α≈10⁻³/K）；德拜温度以下ρ∝T⁵。", "id": "q241", "opts": []}, {"ch": 9, "type": "fill", "tag": "迈斯纳效应", "q": "超导体的完全抗磁性也称____效应。", "ans": ["迈斯纳"], "points": "迈斯纳效应：将超导体放入磁场中，会将其内部磁场完全排除，内部磁通量保持为零；不论先降温后加磁场还是先加磁场后降温，只要进入超导态，超导体就把全部磁通量排出体外。", "id": "q242", "opts": []}, {"ch": 9, "type": "fill", "tag": "临界电流密度", "q": "要保持超导态，需要限制最大输入电流密度，即限制____（填写符号）。", "ans": ["Jc"], "points": "临界电流密度Jc：输入电流产生磁场，与外加磁场一起破坏超导态，要保持超导态须限制最大输入电流密度；超导体的三个性能指标为Tc、Hc、Jc，三个值越大应用范围越广。", "id": "q243", "opts": []}, {"ch": 9, "type": "fill", "tag": "汤姆逊效应", "q": "当电流在温度不均匀的导体中流过时，导体除产生不可逆的焦耳热外，还要吸收或放出一定的热量，称为____热。", "ans": ["汤姆逊"], "points": "汤姆逊效应（1851年）：电流在温度不均匀的导体中流过时除焦耳热外还吸收或放出一定热量（汤姆逊热）；反过来，金属棒两端温度不同时两端会形成电势差（自由电子热扩散）。", "id": "q244", "opts": []}, {"ch": 9, "type": "fill", "tag": "光敏条件", "q": "光敏电阻效应要求光子的能量必须大于半导体材料的____。", "ans": ["禁带宽度", "禁带"], "points": "半导体材料在光辐照下电子吸收光子后挣脱原子束缚形成自由电子，导电性能增加、电阻率下降，称光电导；要求光子能量必须大于禁带宽度。CdS明暗电阻相差2000多倍（照亮小于2kΩ、无光大于4MΩ）。", "id": "q245", "opts": []}, {"ch": 9, "type": "sa", "tag": "名词解释", "q": "名词解释：电导率、电阻率；固体按电阻率分为哪三类？", "points": "电导率σ：表征材料导电能力的主要参量，欧姆定律微分形式J=σE，单位S/m。\n电阻率ρ：ρ=1/σ，单位Ω·m，有时用Ω·cm。\n固体按电阻率ρ的范围分三类：导体ρ\u003c10⁻² Ω·m；半导体ρ为10⁻²~10¹⁰ Ω·m；绝缘体ρ>10¹⁰ Ω·m。", "id": "q246", "opts": [], "ans": ""}, {"ch": 9, "type": "sa", "tag": "导电机理", "q": "金属导电有哪三种理论？简述能带理论的基本概念。", "points": "三种理论：①经典自由电子理论——价电子完全自由弥散于晶格点阵中，有电场时沿电场方向运动形成电流，与金属离子碰撞形成电阻，导电性取决于自由电子数量、平均自由程、平均运动速度；②量子自由电子理论——价电子按量子化规律具有不同能量状态（能级），外电场使正反向运动的电子数量不等而导电，电磁波被离子点阵散射干涉而形成电阻，0 K时理想晶体中电子波传播不受阻碍、电阻为零（超导）；③能带理论——研究金属中价电子在周期势场作用下的能量分布。\n能带理论基本概念：能隙（能带分裂后某些能态电子不能取值）、禁带（电子不可具有的能级组成的能带）、允带（电子可具有的能级组成的能带）、导带（允带中未被填满的能级）、满带（允带中所有能级都被填满）；金属导带部分充填且能带重叠，半导体和绝缘体区别在禁带宽度。", "id": "q247", "opts": [], "ans": ""}, {"ch": 9, "type": "sa", "tag": "超导电性", "q": "名词解释：超导电性；超导体的三大性能指标是什么？", "points": "超导电性：某些材料在临界温度以下进入以零阻值为特征的新物态（超导态）的性质；1911年昂内斯发现汞在4.2 K时直流电阻突然消失。\n两大特征：零电阻（直流，永久电流）和完全抗磁性（迈斯纳效应，内部磁通量保持为零）。\n三大性能指标：①临界转变温度Tc（越接近室温越好，金属氧化物Tc最高约140 K）；②临界磁场强度Hc，Hc(T)=Hc(0)(1-T²/Tc²)，超过时磁力线穿入破坏超导态；③临界电流密度Jc，要保持超导态须限制最大输入电流密度。三个值越大应用范围越广。", "id": "q248", "opts": [], "ans": ""}, {"ch": 9, "type": "sa", "tag": "热电效应", "q": "简述三种热电效应（塞贝克效应、珀耳帖效应、汤姆逊效应）及其应用。", "points": "塞贝克效应（1821年）：两种不同金属构成闭合回路、两个接头存在温差时回路中产生电流，电流大小与金属种类、温差和电阻值有关；实质是接触电势差（取决于电子逸出功和有效电子密度）；是温差发电和热电偶测量的技术基础。\n珀耳帖效应（1834年）：塞贝克效应的逆效应，回路中存在直流电流时两个接头之间产生温差（吸热或放热），可逆，是电子致冷所依赖的效应；珀耳帖热与电流方向有关，焦耳热与方向无关。\n汤姆逊效应（1851年）：电流在温度不均匀的导体中流过时除焦耳热外还吸收或放出一定热量；反过来金属棒两端温度不同时形成电势差（自由电子热扩散）。应用：热电偶测温、温差发电、电致冷。", "id": "q249", "opts": [], "ans": ""}, {"ch": 9, "type": "sa", "tag": "导电影响因素", "q": "影响材料导电性的主要因素有哪些？", "points": "①温度：温度升高离子振动加剧、电子自由程减小、散射率增加；德拜温度以上纯金属电阻率近似线性增加（α≈10⁻³/K），德拜温度以下ρ∝T⁵。\n②冷塑性变形和应力：冷塑性变形点阵畸变、缺陷增加，电阻增大；回复降低点缺陷浓度，再结晶消除点阵畸变和缺陷，淬火保留高温点缺陷；拉应力原子间距增大电阻增大、压应力减小。\n③合金化：固溶体ρ随溶质原子增多而增大（点阵畸变散射+有效电子数减少）；金属化合物ρ比组元小得多（键合性质改变）；多相合金ρ约为两相ρ的加权平均值（与组成相的导电性、相对含量及形貌有关）。", "id": "q250", "opts": [], "ans": ""}, {"ch": 9, "type": "sa", "tag": "介电常数与击穿", "q": "名词解释：介电常数；介电击穿。绝缘材料有哪几种击穿形式？", "points": "介电常数ε：表征介质极化大小的宏观物理量以及电介质贮存电能能力的大小，为电容器有电介质时的电容同真空状态电容的比值。\n介电击穿：在强电场（10⁷~10⁸ V/m）中，随着电场强度进一步升高，材料突然从介电状态变成导电状态，绝缘材料丧失绝缘性能。\n击穿形式：①电击穿——强电场下少数自由电子撞击介质内离子产生次级电子、三级电子，连锁反应形成电子潮（雪崩），电流迅速增大而击穿，瞬息完成（约10⁻⁷~10⁻⁸秒）；②热击穿——部分电能损耗转为热能，介质受散热限制被急剧加热，温度超过一定限度出现烧裂、熔融等；③化学击穿——长期运行在高温、潮湿、高电压或腐蚀性气体环境下出现（离子式电导漏导损耗增大发热、封闭气孔引起气体电化学击穿两种机理）。", "id": "q251", "opts": [], "ans": ""}, {"ch": 9, "type": "sa", "tag": "介质极化", "q": "介质极化有哪几种微观机制？各有什么特点？", "points": "①电子位移极化（形变极化）：外电场作用下原子外围电子云相对原子核发生位移或非均匀形变导致正负电荷重心分离；电子很轻、反应很快，可以光频（10¹⁴ Hz以上）跟随外电场变化，且与温度无关。\n②离子位移极化：离子晶体在电场作用下离子间键合被拉长、电偶极矩增加；离子质量大，极化建立时间约10⁻¹²~10⁻¹³秒，随温度变化增强。\n③松弛（弛豫）极化：弱联系电子、离子和偶极子等松弛质点在一定温度下电场作用占主导发生极化；有统计性质（热松弛极化），建立时间长（可达10⁻²~10⁻³秒）且需吸收能量，是不可逆过程，随温度变化有极大值，多发生在聚合物分子晶体缺陷处或玻璃体内（含电子松弛极化、离子松弛极化）。\n④偶极子取向极化：沿外场方向取向的固有偶极矩的偶极子数大于反向的偶极子数，出现宏观偶极矩；取向极化需要较长时间（约10⁻²~10⁻¹⁰秒），极化率比电子极化高2个数量级，随温度变化有极大值。", "id": "q252", "opts": [], "ans": ""}, {"ch": 10, "type": "mcq", "tag": "腐蚀定义", "q": "材料腐蚀的本质是（　）。", "opts": ["纯机械磨损过程", "物质表面因发生化学或电化学反应而受到破坏的自发过程", "物理溶解过程", "热胀冷缩过程"], "ans": "B", "points": "腐蚀是物质表面因发生化学或者电化学反应而受到破坏的现象，由于环境介质作用于材料或物质本身，使之发生质的变化；材料的腐蚀是一种自发进行的过程。", "id": "q253"}, {"ch": 10, "type": "mcq", "tag": "化学腐蚀介质", "q": "化学腐蚀发生在（　）。", "opts": ["非离子导体介质中（干燥气体、非电解质溶液）", "电解质溶液（离子导体介质）中", "任何介质中", "只有高温介质中"], "ans": "A", "points": "按机理分类：化学腐蚀发生在非离子导体介质中（干燥气体、非电解质溶液），金属和化学介质直接产生化学反应，不产生腐蚀电流；电化学腐蚀发生在离子导体介质（电解质溶液）中，金属表面与电解质溶液发生反应。", "id": "q254"}, {"ch": 10, "type": "mcq", "tag": "晶界腐蚀", "q": "下列腐蚀形式中危害性最大的是（　）。", "opts": ["均匀腐蚀", "点腐蚀", "晶界腐蚀", "磨损腐蚀"], "ans": "C", "points": "晶界腐蚀是指腐蚀过程沿着晶界进行，危害性最大；均匀腐蚀容易发现、危害性不大；点腐蚀集中于表面不大的区域向深处发展甚至穿透金属；应力腐蚀无预兆危害也较大。", "id": "q255"}, {"ch": 10, "type": "mcq", "tag": "应力腐蚀", "q": "关于应力腐蚀，下列说法正确的是（　）。", "opts": ["有明显的塑性变形预兆", "只发生在高温环境下", "只在压应力状态下发生", "钢在拉应力状态下发生，没有什么预兆，危害性比较大"], "ans": "D", "points": "钢在拉应力状态下能发生应力腐蚀破坏；应力腐蚀没有什么预兆，所以其危害性也比较大。", "id": "q256"}, {"ch": 10, "type": "mcq", "tag": "腐蚀原电池", "q": "腐蚀原电池是指（　）。", "opts": ["能够对外做功的电池", "只能导致金属腐蚀而不能对外做功的短路原电池", "电解池", "浓差电池"], "ans": "B", "points": "腐蚀原电池是只能导致金属腐蚀而不能对外做功的短路原电池；具有4个组成部分（阳极、阴极、电解质溶液、电路）和3个过程（阳极过程、阴极过程、电流流动），金属的腐蚀破坏集中出现在阳极区。", "id": "q257"}, {"ch": 10, "type": "mcq", "tag": "腐蚀破坏区", "q": "金属电化学腐蚀的破坏集中出现在（　）。", "opts": ["阳极区", "阴极区", "电解质溶液中", "整个表面均匀分布"], "ans": "A", "points": "腐蚀原电池中电流在阳极和阴极间流动，金属的腐蚀破坏集中出现在阳极区（阳极发生氧化溶解）。", "id": "q258"}, {"ch": 10, "type": "mcq", "tag": "腐蚀倾向判据", "q": "关于金属腐蚀倾向的判据，下列说法正确的是（　）。", "opts": ["ΔG>0时腐蚀反应可能发生", "ΔG=0时腐蚀最容易发生", "腐蚀倾向与ΔG无关", "ΔG\u003c0时腐蚀反应可能发生，而且越负越不稳定"], "ans": "D", "points": "ΔG\u003c0腐蚀反应可能发生，而且越负越不稳定；ΔG>0腐蚀反应不可能发生。ΔG只能判断金属腐蚀倾向的大小，不能判断腐蚀速度的大小；ΔG=nFE，只有当阳极电位小于阴极电位时才满足E>0。", "id": "q259"}, {"ch": 10, "type": "mcq", "tag": "电极电位判据", "q": "要使电化学腐蚀反应满足ΔG\u003c0（E>0）的条件，必须满足（　）。", "opts": ["阳极电位大于阴极电位", "阳极电位等于阴极电位", "阳极电位小于阴极电位", "电极电位与腐蚀倾向无关"], "ans": "C", "points": "电化学反应所作的有用功等于系统反应自由能的减少ΔG=nFE；满足ΔG\u003c0的必要条件是E>0，即只有当阳极电位小于阴极电位时，腐蚀才能自发进行；常用标准电极电位作为电化学腐蚀倾向的热力学判据。", "id": "q260"}, {"ch": 10, "type": "mcq", "tag": "耐蚀分级", "q": "腐蚀速度小于0.01 mm/年的不锈钢称为（　）。", "opts": ["完全耐蚀", "耐蚀", "耐酸钢", "不锈耐酸钢"], "ans": "A", "points": "仅能抵抗大气、水等介质腐蚀的钢叫不锈钢：腐蚀速度小于0.01 mm/年的不锈钢称为完全耐蚀，小于0.1 mm/年的称为耐蚀；在酸碱等介质中具有抗腐蚀能力的钢称耐酸钢，腐蚀速度小于0.1 mm/年的耐酸钢称为完全耐蚀，小于1 mm/年的称为耐蚀。", "id": "q261"}, {"ch": 10, "type": "mcq", "tag": "提高耐蚀性", "q": "提高钢耐腐蚀性能途径中，通过提高固溶体电极电位或形成稳定钝化区最理想的元素是（　）。", "opts": ["镍", "铬", "锰", "铜"], "ans": "B", "points": "提高钢耐蚀性的途径：①形成稳定保护膜（Cr、Al、Si有效）；②提高固溶体电极电位或形成稳定钝化区（Cr、Ni、Si，其中Ni贵而紧缺、Si易使钢脆化，Cr是理想的）；③获得单相组织（Ni、Mn→单相奥氏体）；④机械保护措施或覆盖层（电镀、发兰、涂漆）。", "id": "q262"}, {"ch": 10, "type": "mcq", "tag": "475℃脆性", "q": "高铬铁素体不锈钢的475℃脆性是指（　）。", "opts": ["在1000℃以上淬火产生的脆性", "在低温下产生的冷脆", "含铬>15%的钢在400~525℃长时间加热或缓慢冷却时变脆，以475℃加热为最甚", "含镍量过高引起的脆性"], "ans": "C", "points": "当Cr>15%时随Cr含量增加脆化倾向增大，在400~525℃长时间加热或缓慢冷却时钢变得很脆，以475℃加热为最甚；原因是脆化温度范围内长期停留时铬有序化形成α″相，与母相共格产生大内应力，使冲击韧度αK降低。", "id": "q263"}, {"ch": 10, "type": "mcq", "tag": "奥氏体不锈钢成分", "q": "世界各国奥氏体不锈钢的典型成分是（　）。", "opts": ["13Cr", "17Cr-2Ni", "9Cr18", "18Cr-8Ni"], "ans": "D", "points": "奥氏体不锈钢的主要合金成分是Cr和Ni，18Cr和8Ni的配合是世界各国奥氏体不锈钢的典型成分；Cr+Ni=18+8=26，耐蚀电位接近n/8定律中n=2的电位值，具有良好钝化性能，耐蚀性达到较高水平。", "id": "q264"}, {"ch": 10, "type": "fill", "tag": "腐蚀分类", "q": "按腐蚀机理，金属腐蚀分为化学腐蚀和____腐蚀两大类。", "ans": ["电化学"], "points": "按腐蚀机理分为：化学腐蚀（非离子导体介质：干燥气体、非电解质溶液）和电化学腐蚀（离子导体介质：电解质溶液）；按环境还可分为大气、海水、淡水、土壤、工业介质腐蚀。", "id": "q265", "opts": []}, {"ch": 10, "type": "fill", "tag": "腐蚀原电池组成", "q": "腐蚀原电池的四个组成部分为：阳极、阴极、电解质溶液和____。", "ans": ["电路"], "points": "腐蚀原电池是只能导致腐蚀而不能对外做功的短路原电池，4个组成部分为阳极、阴极、电解质溶液、电路；3个过程为阳极过程、阴极过程、电流流动。", "id": "q266", "opts": []}, {"ch": 10, "type": "fill", "tag": "腐蚀倾向", "q": "电化学腐蚀倾向判据：ΔG____0时腐蚀反应可能发生。", "ans": ["\u003c", "小于"], "points": "ΔG\u003c0腐蚀反应可能发生，而且越负越不稳定；ΔG>0腐蚀反应不可能发生。ΔG=nFE，满足ΔG\u003c0的必要条件是E>0，即阳极电位小于阴极电位。", "id": "q267", "opts": []}, {"ch": 10, "type": "fill", "tag": "腐蚀破坏区", "q": "金属电化学腐蚀的破坏集中出现在____区。", "ans": ["阳极"], "points": "腐蚀原电池的电流在阳极和阴极间流动，金属的腐蚀破坏集中出现在阳极区。", "id": "q268", "opts": []}, {"ch": 10, "type": "fill", "tag": "奥氏体形成元素", "q": "不锈钢中的奥氏体形成元素包括：Ni、C、N、Mn、Cu、____。", "ans": ["Co"], "points": "铁素体形成元素：Cr、Mo、Si、Ti、Nb等；奥氏体形成元素：Ni、C、N、Mn、Cu、Co等。铬当量和镍当量的综合作用结果决定不锈钢的组织。", "id": "q269", "opts": []}, {"ch": 10, "type": "fill", "tag": "敏化温度", "q": "Cr-Ni奥氏体不锈钢在____℃的温度范围内时效处理，可考察不锈钢晶间腐蚀的敏感性（填写温度范围）。", "ans": ["450~800"], "points": "奥氏体不锈钢在450~800℃（焊缝及热影响区）时效时沿晶界析出(Cr,Fe)₂₃C₆，晶界附近产生贫Cr区（低于1/8定律临界值），产生晶间腐蚀敏感性；敏化处理和敏感性的关系用TTS曲线表示。", "id": "q270", "opts": []}, {"ch": 10, "type": "fill", "tag": "固溶处理温度", "q": "奥氏体不锈钢固溶处理温度一般为____℃（填写常用温度范围）。", "ans": ["1050~1100"], "points": "奥氏体不锈钢固溶处理温度一般为1050~1150℃，比较常用1050~1100℃；为保证高温奥氏体不发生分解，固溶处理后冷速应较快，多采用水冷；固溶处理是奥氏体不锈钢最大程度的软化处理，此时奥氏体具有最大合金度和最高的耐蚀性能。", "id": "q271", "opts": []}, {"ch": 10, "type": "fill", "tag": "双相不锈钢", "q": "双相不锈钢指铁素体与奥氏体各约占50%，一般较少相的含量最少也需要达到____%。", "ans": ["30"], "points": "双相不锈钢（DSS）指铁素体与奥氏体各约占50%，一般较少相的含量最少也需要达到30%；通过正确控制化学成分和热处理工艺，使DSS兼有铁素体不锈钢和奥氏体不锈钢的优点。", "id": "q272", "opts": []}, {"ch": 10, "type": "sa", "tag": "名词解释", "q": "名词解释：化学腐蚀；电化学腐蚀。", "points": "化学腐蚀：金属和化学介质直接产生化学反应造成的腐蚀，发生在非离子导体介质中（干燥气体、非电解质溶液），如铁在高温下的氧化4Fe+3O₂→Fe₂O₃；这种反应不产生腐蚀电流，在反应表面形成一层化学生成物。\n电化学腐蚀：金属表面与电解质溶液（离子导体介质）发生的反应，有腐蚀电流产生；典型情形如不同金属直接接触（铜与钢）、同一金属在浓差介质中的浓差电池、不同电位的显微组织形成的微电池（生锈、金相组织腐蚀）、成分不均匀（晶界与晶粒内部）、应力不均匀（铁丝弯曲处易蚀）等。", "id": "q273", "opts": [], "ans": ""}, {"ch": 10, "type": "sa", "tag": "腐蚀形式", "q": "金属腐蚀按破坏形式主要分为哪几种？各有什么特点？", "points": "①均匀腐蚀：腐蚀均匀地在材料表面产生，损坏大量材料，容易发现，危害性不是很大。\n②点腐蚀：由于应力等原因使腐蚀集中在材料表面不大的区域，向深处发展，最后甚至能穿透金属。\n③晶界腐蚀：腐蚀过程沿晶界进行，危害性最大。\n④应力腐蚀：钢在拉应力状态下发生应力腐蚀破坏，没有什么预兆，危害性比较大。\n⑤磨损腐蚀：在腐蚀介质中同时有磨损，腐蚀和磨损相互促进、相互加速。", "id": "q274", "opts": [], "ans": ""}, {"ch": 10, "type": "sa", "tag": "腐蚀原电池", "q": "名词解释：腐蚀原电池。说明其组成、过程及腐蚀破坏集中的区域。", "points": "腐蚀原电池：只能导致金属腐蚀而不能对外做功的短路原电池。\n4个组成部分：阳极、阴极、电解质溶液、电路。\n3个过程：阳极过程、阴极过程、电流流动（电流在阳极和阴极间流动）。\n金属的腐蚀破坏集中出现在阳极区。\n电化学腐蚀倾向判据：ΔG\u003c0腐蚀可能发生且越负越不稳定（ΔG=nFE，须阳极电位小于阴极电位）；ΔG只能判断倾向大小，不能判断腐蚀速度。", "id": "q275", "opts": [], "ans": ""}, {"ch": 10, "type": "sa", "tag": "提高耐蚀途径", "q": "提高钢耐腐蚀性能的途径有哪些？为什么说“耐蚀是相对的”？", "points": "途径：①形成稳定保护膜，Cr、Al、Si有效；②提高固溶体电极电位或形成稳定钝化区，Cr、Ni、Si（Ni贵而紧缺、Si易使钢脆化，Cr是理想的）；③获得单相组织，Ni、Mn可获得单相奥氏体组织；④机械保护措施或覆盖层，如电镀、发兰、涂漆等。\n耐蚀的相对性：“耐蚀”是针对具体介质而言的，在某种介质中耐蚀，在另一介质中不一定耐蚀，没有完全不腐蚀的钢；必须根据工作介质的特点正确选择使用不锈耐蚀钢钢种。", "id": "q276", "opts": [], "ans": ""}, {"ch": 10, "type": "sa", "tag": "晶间腐蚀", "q": "奥氏体不锈钢产生晶间腐蚀的原因是什么？防止晶间腐蚀可采取哪些措施？", "points": "原因：奥氏体不锈钢焊接后在腐蚀介质中工作时，在离焊缝不远处产生严重晶间腐蚀；在焊缝及热影响区（450~800℃）沿晶界析出了(Cr,Fe)₂₃C₆，晶界附近区域产生贫Cr区（低于1/8定律的临界值），导致晶间腐蚀。Ni、Co、Si促进产生晶间腐蚀，Mo、Ti、Nb、Mn、V能不同程度地阻止晶间腐蚀倾向；钢中含碳量提高，晶间腐蚀倾向增大。\n措施：①降低钢中的含C量；②加入Ti、Nb，析出特殊碳化物，稳定组织；③进行1050~1100℃的固溶处理，保证Cr含量；④对非稳定性A不锈钢进行退火处理，使奥氏体成分均匀化，消除贫Cr区；⑤对稳定性钢，通过热处理形成Ti、Nb的特殊碳化物，以稳定固溶体中Cr含量。", "id": "q277", "opts": [], "ans": ""}, {"ch": 10, "type": "sa", "tag": "铁素体不锈钢脆性", "q": "高铬铁素体不锈钢的脆性主要有哪些方面？", "points": "①粗大的原始晶粒：由于原子扩散快，晶粒粗化温度低和粗化速率高，600℃以上晶粒就开始长大（奥氏体不锈钢相应为900℃）。\n②475℃脆性：当Cr>15%时随Cr含量升高脆化倾向增大，在400~525℃长时间加热或缓慢冷却时钢变得很脆，以475℃加热为最甚；原因是铬有序化形成α″相，与母相共格产生大内应力，使冲击韧度αK降低。\n③金属间化合物σ相的形成：σ相具有高硬度、大的体积效应，且常沿晶界分布，使钢产生很大脆性。", "id": "q278", "opts": [], "ans": ""}];
const DOCS_DATA = {"stats": {"1": {"mcq": 13, "fill": 10, "sa": 7, "total": 30}, "2": {"mcq": 12, "fill": 8, "sa": 5, "total": 25}, "3": {"mcq": 13, "fill": 8, "sa": 7, "total": 28}, "4": {"mcq": 14, "fill": 10, "sa": 8, "total": 32}, "5": {"mcq": 12, "fill": 8, "sa": 6, "total": 26}, "6": {"mcq": 13, "fill": 8, "sa": 6, "total": 27}, "7": {"mcq": 13, "fill": 9, "sa": 7, "total": 29}, "8": {"mcq": 12, "fill": 8, "sa": 6, "total": 26}, "9": {"mcq": 13, "fill": 9, "sa": 7, "total": 29}, "10": {"mcq": 12, "fill": 8, "sa": 6, "total": 26}, "total": {"mcq": 127, "fill": 86, "sa": 65, "total": 278}}, "part1": [{"no": 1, "title": "第一章 材料单向静拉伸的力学性能", "intro": "本章是全书基础：以单向静拉伸试验为主线，掌握弹性、屈服、强化、塑性、断裂各阶段的概念、指标定义及其物理意义，并区分工程应力应变与真应力应变。", "points": [["单向静拉伸试验的意义", "测定弹性、塑性、强度、韧性等基本力学性能指标；根据拉伸性能可预测疲劳、断裂等其他力学性能；是结构静强度设计的主要依据。"], ["力-伸长曲线四阶段", "弹性变形阶段（卸载可恢复，大多近似线弹性、符合胡克定律）→屈服阶段（平台或锯齿）→均匀变形阶段（形变强化，宏观均匀）→局部变形阶段（颈缩，工程应力-应变曲线呈下降段）。"], ["应力与应变", "应力σ=F/A0（单位面积上的内力）；应变ε=ΔL/L0=(L-L0)/L0（几何形状和尺寸的变化）。"], ["低碳钢σ-ε特征点", "σp比例极限、σe弹性极限、σs屈服极限、σb强度极限；无明显屈服阶段材料以塑性应变0.2%对应的应力σ0.2为名义屈服极限。"], ["真应力与真应变", "真应力S=σ(1+ε)恒大于工程应力σ；真应变e=ln(1+ε)恒小于工程应变ε。"], ["弹性模量E", "σ=Eε中的比例系数，度量刚度、表征材料对弹性变形的抗力；组织不敏感（晶粒大小无影响），随温度升高而降低；加载条件对金属、陶瓷无影响。"], ["屈服强度σs", "表征材料对起始塑性变形的抗力；取下屈服应力σsL（再现性好）；工程意义：防止过量塑性变形失效的设计选材依据、屈强比衡量继续塑性变形倾向。"], ["屈服强度影响因素与强化机制", "内在因素：晶体结构（晶格阻力、位错交互）、晶界与亚结构（Hall-Petch）、溶质元素（晶格畸变）、第二相；外在因素：温度（bcc敏感）、应变速率、应力状态。四种强化机制：固溶强化、形变强化、沉淀强化和弥散强化、晶界和亚晶界强化。"], ["应变硬化（形变强化）", "进入塑性变形后随变形量增大变形应力不断提高；Hollomon方程S=Kεp^n；n反映抵抗继续塑性变形的能力，n=1理想弹性体、n=0无应变硬化能力。"], ["抗拉强度σb", "拉伸断裂前所能承受的最大工程应力，表征材料对均匀塑性变形的抗力，不一定代表断裂抗力。"], ["塑性指标", "伸长率δ与断面收缩率Ψ（拉伸试验测得）；δ≥Ψ说明只有均匀塑性变形而无颈缩（低塑性材料）；塑性好利于成型加工、保证使用安全。"], ["塑性变形机理", "主要形式为滑移（位错运动的结果）与孪生；滑移面×滑移方向=滑移系，滑移系越多塑性越好（fcc如Cu、Al、Ni好于hcp如Mg、Zn）。"], ["超塑性", "异常低的流变抗力与异常高的流变性能，延伸率超过100%；分微细晶粒超塑性（恒温/组织超塑性）与相变超塑性（动态/环境超塑性）。"], ["断裂类型", "按塑性变形程度分韧性/脆性断裂；按裂纹扩展路线分穿晶/沿晶断裂；按微观机理分解理/剪切断裂；按力的作用性质分正断、剪断。"], ["断口分析", "韧性断裂断口三要素：纤维区F、放射区R、剪切唇S；微孔聚集型断裂微观特征为韧窝；解理断裂断口为河流状花样（bcc解理面(100)）、舌状花样、准解理。"]], "disc": [["工程应力σ vs 真应力S", "S=σ(1+ε)。σ按原始截面积A0计算，S按瞬时截面积计算；拉伸时截面收缩，真应力恒大于工程应力。"], ["工程应变ε vs 真应变e", "e=ln(1+ε)。ε按原始标距计算，e按瞬时长度积分；真应变恒小于工程应变。"], ["比例极限σp vs 弹性极限σe", "σp是保证应力-应变按正比关系变化的最大应力；σe是材料由弹性变形过渡到弹-塑性变形时的应力。工程定义按非比例伸长百分比确定（如σp0.01、σp0.05）。"], ["上屈服σsU vs 下屈服σsL", "上屈服应力对试验条件变化敏感、结果分散；下屈服应力再现性好，故取σsL作为屈服强度σs。"], ["韧性断裂 vs 脆性断裂", "韧性断裂前有明显塑性变形、有征兆，断口杯锥状、暗灰色纤维状；脆性断裂无征兆、危害极大，断口齐平、由无数小平面组成。"], ["穿晶断裂 vs 沿晶断裂", "按裂纹扩展路线分：穿过晶粒内部为穿晶；沿晶界扩展为沿晶（晶界弱化时发生）。"], ["解理断裂 vs 剪切断裂", "解理：正应力下原子结合键破坏、沿解理面（bcc为(100)）的脆性穿晶断裂，断口河流状花样、舌状花样；剪切：切应力下沿滑移面滑移分离，断口锋利的锲形、暗灰色纤维状，微孔聚集型断裂为其常见形式（韧窝）。"], ["微细晶粒超塑性 vs 相变超塑性", "微细晶粒（恒温/组织）超塑性：需微细等轴晶粒（~10μm）、Ts≥0.5Tm、变形速率10^-4~10^-1/s；相变（动态/环境）超塑性：不需超细晶粒，在相变温度上下反复循环加热冷却同时变形产生极大延伸率。"]]}, {"no": 2, "title": "第二章 材料在其他状态下的力学性能", "intro": "本章覆盖拉伸之外的压缩、扭转、弯曲三种加载状态及硬度测试：重点是各试验的特点（适用材料、应力分布、断口特征）与布氏/洛氏/维氏硬度的测量原理差异。", "points": [["压缩试验", "对试样施加轴向应力测定强度与塑性；试样圆柱型，h/d=1.5~2（脆性低塑性材料不大于2）；脆性材料抗压强度σbc=Fbc/A0；压缩不能使塑性材料断裂，故塑性材料一般不采用压缩检验。"], ["压缩试验特点", "主要用于脆性材料（无机非金属、铸铁），可表征静拉伸韧性状态不能反映的力学行为；压缩时脆性材料发生一定塑性变形并有沿轴线45°切断特征；端面摩擦影响试验结果，应尽量减小。"], ["扭转试验", "M-Φ曲线；切应变γ=ρφ沿径向与距中心距离成正比；横截面无正应力只有切应力，中心为零、表面最大（τmax=M/Wt）；可精确测定塑性材料变形能力及变形抗力。"], ["扭转试验特点", "整个长度方向塑性变形始终均匀、无颈缩鼓涨，故可测高塑性材料；对表面缺陷敏感（可作表面处理质量监控）、对心部缺陷不敏感；可区分正断与切断。"], ["扭转断口", "塑性材料：切断，断口与轴线垂直、平整有回旋状塑性变形痕迹；脆性材料：正断，断口与轴线成45°、呈螺旋状；据此可判断抗拉（压）强度与抗扭（剪）强度的相对大小。"], ["弯曲试验", "三点弯曲（集中加载）与四点弯曲（等弯矩加载）；弯曲正应力σmax=M/W，变形由挠度f表示（跨距中心最大）；横截面上既有正应力也有剪应力。"], ["弯曲试验特点", "不受试样偏斜影响，可稳定测定脆性和低塑性材料的抗弯强度并反映抗拉性能；不能使塑性好的材料断裂；对表面缺陷敏感。"], ["硬度与压入法", "硬度是材料抵抗硬物压入其表面的能力；压入法（布氏测面积、洛氏测深度、维氏测载荷）与刻划法（莫氏）两类；不同测试方法硬度值不能直接比较。"], ["布氏硬度", "载荷P与压痕面积S之比HB=P/S；符号HBW（硬质合金压头）/HBS（淬火钢压头）；压痕大→误差小、反映较大区域平均性能、数据稳定；缺点：不宜成品检验、测量麻烦、需保压。"], ["洛氏硬度", "用压痕深度表示硬度（压入越深越软）；HRA、HRB、HRC三种标尺，最常用HRC；操作简便迅速、压痕小、可测较薄工件；误差大、不同标尺不能比较换算。"], ["维氏硬度", "金刚石四棱锥压头，单位压痕面积上的载荷即维氏硬度HV；压入角恒定，任意选取压力结果可比；适用于薄硬化层、镀层、薄片材料。640HV30/20表示加压30kgf保持20s测得硬度值640。"], ["其他硬度", "显微硬度：测单个晶粒、组成相或夹杂物；肖氏硬度（回跳硬度）HS=Kh/h0，用于大型工件；莫氏硬度：划痕法10级（金刚石10、滑石1）；纳米压痕：位移分辨率0.006nm、载荷1nN。"]], "disc": [["布氏 vs 洛氏 vs 维氏", "布氏测压痕面积（压痕大、误差小、反映平均性能）；洛氏测压痕深度（压痕小、效率高、误差大）；维氏测单位压痕面积上的载荷（压入角恒定、任意载荷可比）。不同方法硬度值不能直接比较。"], ["压入法 vs 刻划法", "压入法：材料表面抵抗另一物体局部压入引起的塑性变形（布氏/洛氏/维氏/显微硬度）；刻划法：材料表面对局部切断破坏的抗力（莫氏硬度，矿物分析用）。"], ["压缩 vs 拉伸", "受力方向相反；脆性材料拉伸为脆性正断、压缩发生一定塑性变形并有45°切断特征；压缩不能使塑性材料断裂，塑性材料一般不采用压缩检验。"], ["扭转正断 vs 切断", "切断（塑性材料）：断口与轴线垂直、平整有回旋状塑性变形痕迹，由切应力造成；正断（脆性材料）：断口与轴线成45°、螺旋状，由正应力造成。"]]}, {"no": 3, "title": "第三章 材料的冲击韧性和低温脆性、材料的断裂韧性", "intro": "本章由冲击韧性（动载行为）、低温脆性（韧脆转变）与断裂韧性（裂纹体力学）三块构成：核心是韧脆转化温度的测定方法，以及KI与KIC两个概念的严格区分。", "points": [["冲击载荷与应变率", "冲击载荷与静载荷的主要区别在于加载速度；静拉伸应变率10^-5~10^-2s^-1，冲击试验10^2~10^4s^-1。"], ["冲击试验与冲击韧性", "冲击吸收功Ak=mg(H1-H2)；冲击韧性值aKV=AKV/AN（缺口处截面面积），单位J/cm²；材料常规力学性能五大指标：σs、σb、δ、Ψ、αku。"], ["冲击韧性工程意义", "反映冶金和热加工的质量；测定材料韧脆性转变温度；对σs大致相同的材料判断大能量冲击下的缺口敏感性。"], ["低温脆性现象与实质", "低温下材料脆性急剧增加；实质是温度下降使屈服强度急剧增加；bcc金属及合金存在低温脆性，fcc（如铜、铝）一般不显示。"], ["低温脆性原因", "屈服强度σs与断裂强度σc随温度变化；位错运动阻力σi随温度变化；bcc金属的迟屈服现象（高速载荷下需经孕育期才开始塑性变形，有利于裂纹扩展）。"], ["韧脆转化温度测定", "断口形貌法：结晶状断口面积占50%时的温度（50%FATT）；能量法：V15TT（AK=15尺磅）、NDT零塑性温度（低阶能开始上升）、FTP（高阶能开始降低）、FTE（高低阶能平均值对应温度）。安全使用温度应在tk以上20~60℃。"], ["影响低温脆性因素", "晶体结构（bcc有、fcc无）；化学成分（S、P、Pb、Sn、As等降低韧性、提高转变温度；Ni、Mn增大层错能提高低温韧性）；显微组织（细化晶粒降低tk）；温度（蓝脆：静载230~370℃、冲击525~550℃）；加载速度（提高→tk提高）；试样形状尺寸（曲率半径越小tk越高、尺寸增大tk增高）。"], ["断裂力学基础", "经典强度理论假定材料连续均匀各向同性、无裂纹，无法解释低应力脆断；断裂力学研究裂纹尖端的应力、应变和应变能，提出裂纹萌生抗力和扩展抗力→断裂韧度。"], ["裂纹扩展方式", "张开型（Ⅰ）、滑开型（Ⅱ）、撕开型（Ⅲ）；实际为各种方式的组合，Ⅰ型最危险。"], ["平面应力与平面应变", "薄板：裂纹尖端沿板厚方向应变不受约束→平面应力状态σz=0；厚板：应变受约束→平面应变状态εz=0、三向拉应力。"], ["应力强度因子KI", "反映裂纹尖端区域应力场的强度；综合反映外加应力、裂纹位置（类型）和裂纹长度三方面；单位MPa·m^1/2；σ或a增大到临界值时KI达到临界值KIC，裂纹失稳扩展。"], ["断裂韧度KIC", "KIC为平面应变断裂韧度，表示材料在平面应变状态下抵抗裂纹失稳扩展的能力；KC为平面应力断裂韧度；断裂韧度取决于材料成分、组织结构等内在因素，也受温度、应变速率等外在因素影响。"], ["塑性区修正", "当σ/σs≥0.6~0.7时需要修正，用等效裂纹长度(a+ry)代替实际裂纹长度，ry为应力松弛后塑性区的半宽。"], ["断裂韧度影响因素", "化学成分（细化晶粒元素提高、强固溶强化降低、金属间化合物第二相降低）；基体相结构（fcc高于bcc）；夹杂与第二相（非金属夹杂和脆性第二相降低、韧性第二相适当可提高）；显微组织（低碳钢回火马氏体高于贝氏体，高碳钢回火马氏体高于上贝氏体低于下贝氏体）；特殊改性处理（亚温淬火、超高温淬火、形变热处理）；温度与应变速率（温度降低、应变速率提高→断裂韧度降低）。"]], "disc": [["冲击吸收功Ak vs 冲击韧性值aKV", "Ak为冲击吸收功（J），是能量值；aKV=AKV/AN（J/cm²），用缺口处截面面积归一化后的指标。"], ["KI vs KIC", "KI是力学参量（取决于外加应力、裂纹尺寸和裂纹类型）；KIC是力学性能指标（取决于材料成分、组织结构等内在因素），表示平面应变状态下抵抗裂纹失稳扩展的能力；关系类似σ与σs。"], ["平面应力 vs 平面应变", "薄板：沿板厚方向应变不受约束，σz=0（两向拉应力）；厚板：应变受约束，εz=0（三向拉应力）。KIC对应平面应变状态。"], ["NDT vs FTP vs FTE", "NDT零塑性温度：低阶能开始上升的温度，以下断口100%结晶状；FTP：高阶能开始降低的温度，以上断口100%纤维状；FTE：高阶能与低阶能平均值对应温度。"], ["张开型Ⅰ vs 滑开型Ⅱ vs 撕开型Ⅲ", "按外加应力类型与裂纹扩展面的取向关系分：张开型（Ⅰ）最危险，实际裂纹扩展是各种方式的组合。"]]}, {"no": 4, "title": "第四章 材料的疲劳性能", "intro": "疲劳是机件最常见的失效形式：掌握循环应力参量、疲劳断口三区、裂纹萌生与扩展机理，以及σ-1、过载持久值、qf、ΔKth等抗力指标的含义与区别。", "points": [["疲劳定义与特点", "ISO（1964）：金属材料在应力与应变的反复作用下所发生的性能变化（特指导致开裂和破坏的性能变化）；80%~90%的断裂破坏是疲劳断裂；断裂应力远小于抗拉/屈服强度、断裂前无明显征兆。"], ["循环应力参量与分类", "平均应力σm=(σmax+σmin)/2；应力幅σa=(σmax-σmin)/2；应力比r=σmin/σmax。对称循环σm=0、r=-1（旋转轴类）；脉动循环r=0（齿轮齿根等）；波动循环0\u003cr\u003c1（气缸盖、螺栓）；随机变动应力（汽车、拖拉机、飞机）。"], ["疲劳破坏特点", "突发性破坏、断裂前无明显塑性变形；低应力循环延性破坏；对缺陷（缺口、裂纹及组织）十分敏感。"], ["疲劳断口三区", "裂纹源（多在表面，常与缺口、刀痕、蚀坑等缺陷相连）、疲劳裂纹扩展区（较光滑、有贝纹线/海滩花样，凹侧指向疲劳源、近源细密远处稀疏）、瞬断区（较粗糙，高应力低韧材料断裂区大）。"], ["疲劳裂纹萌生", "0.05~0.10mm定为裂纹形核，萌生期占总寿命90%以上；三种方式：表面滑移带开裂（驻留滑移带、挤出脊和侵入沟）、第二相/夹杂物与界面或本身开裂、晶界或亚临界处开裂。"], ["疲劳裂纹扩展", "Ⅰ阶段：沿最大切应力方向扩展、速度很慢、断口难辨析；Ⅱ阶段：沿垂直于拉应力方向扩展形成主裂纹，微观特征为疲劳辉纹（条带，弯曲平行沟槽、与扩展方向垂直），可用塑性钝化模型（Laird-Smith）解释。"], ["低周与高周疲劳", "低周：10^2~10^5次，应力接近或超过屈服强度，塑性应变循环（塑性/应变疲劳），寿命取决于塑性变形幅，条带粗、间距宽、常不连续；高周：>10^5次，寿命取决于应力幅。"], ["循环强化与软化", "恒定应变幅循环下，随循环周次增加应力（形变抗力）不断增加为循环强化，不断减小为循环软化。"], ["疲劳强度σr与σ-1", "在指定疲劳寿命下材料能承受的上限循环应力；循环应力小于临界值试样不会断裂，该临界值记作σr（σ-N曲线水平线）；对称循环疲劳强度：对称弯曲σ-1、对称扭转τ-1、对称拉压σ-1p；经验关系σ-1>σ-1p>τ-1（弯曲>拉压>扭转，误差10~30%）。"], ["过载持久值与过载损伤界", "过载持久值：高于疲劳强度的应力下发生疲劳断裂的循环周次（有限疲劳寿命），由曲线倾斜段确定，越陡持久值越高；过载损伤界：每个过载应力下引起损伤的最少循环周次的连线，到持久值间为过载损伤区。"], ["疲劳缺口敏感度", "qf=(Kf-1)/(Kt-1)；Kf=1→qf=0完全不敏感；Kf=Kt→qf=1十分敏感；qf随材料强度增高而增大（结构钢0.6~0.8、球铁0.11~0.25、灰铸铁约0~0.05）。"], ["疲劳裂纹扩展速率与门槛值", "ΔKI=Kmax-Kmin=YΔσ√a；Ⅱ区da/dN=C(ΔKI)^n（Paris公式）；Ⅰ区da/dN很小（10^-8~10^-6mm/周次），Ⅲ区da/dN很高；ΔKth为疲劳裂纹不扩展的ΔKI临界值（da/dN=0），工程上取da/dN=10^-6~10^-8mm/周次对应ΔKI；校核公式ΔKI=YΔσ√a≤ΔKth。"], ["影响疲劳强度因素", "工作条件（应力状态/应力比/平均应力、过载、次载锻炼、间歇效应、载荷频率、温度、腐蚀介质）；表面状态与尺寸（缺口缺陷、尺寸效应ε=(σ-1)d/σ-1）；表面强化（喷丸、滚压、表面淬火、化学热处理、复合强化——提高表面强度+表面压应力）；材料因素（碳的固溶/弥散强化、非金属夹杂与冶金缺陷、显微组织：回火马氏体>回火屈氏体>回火索氏体，细化晶粒提高）。"], ["热疲劳", "由周期变化的热应力或热应变引起的破坏；条件：温度循环变化+热变形受约束；完全约束时热应力Δσ=EαΔT；导热系数高、塑性和韧性好→热疲劳性能好；弹性模量高→热疲劳性能差。"]], "disc": [["疲劳强度σ-1 vs 门槛值ΔKth", "σ-1是光滑试样的无限寿命疲劳强度，用于传统疲劳强度设计和校核；ΔKth是裂纹试样裂纹不扩展的ΔKI临界值，用于裂纹件设计和校核（ΔKI=YΔσ√a≤ΔKth）。"], ["低周疲劳 vs 高周疲劳", "低周10^2~10^5次、应力近屈服、塑性应变循环，寿命取决于塑性变形幅；高周>10^5次、弹性为主，寿命取决于应力幅。"], ["过载持久值 vs 过载损伤界", "过载持久值：高于疲劳强度应力下断裂的循环周次（有限疲劳寿命），由曲线倾斜段确定；过载损伤界：各过载应力下引起损伤的最少循环周次的连线，到持久值之间为过载损伤区。"], ["韧性疲劳条带 vs 脆性疲劳条带", "韧性条带相互平行弧状条纹+无解理台阶；脆性条带相互平行弧状条纹+有大致垂直于条带的解理台阶河流花样。"], ["循环强化 vs 循环软化", "恒定应变幅循环下随周次增加应力（形变抗力）不断增加为循环强化；不断减小为循环软化。"]]}, {"no": 5, "title": "第五章 材料的磨损性能", "intro": "磨损是三种主要失效方式之一：掌握摩擦系数、五类磨损机制（粘着、磨料、接触疲劳、微动、腐蚀）的机理与数学表达式，以及磨损三阶段和耐磨性测量。", "points": [["摩擦与磨损", "摩擦：接触表面阻碍相对运动的现象，摩擦力沿接触面切线方向、与相对运动方向相反；摩擦系数μ=F/P。磨损是摩擦的必然结果（摩擦是原因、磨损是结果）；机械零件失效三大方式：断裂、磨损、腐蚀。"], ["磨损分类", "按失效机制分五类：粘着磨损、磨料磨损、腐蚀磨损、接触疲劳（表面疲劳磨损）、微动损伤；按环境介质分流体/湿/干磨损；按表面接触性质分金属-流体、金属-金属、金属-磨料磨损。"], ["磨损三阶段", "跑合阶段（粗糙表面、真实接触面积小、磨损速率大后趋稳）→稳定磨损阶段（磨损速率基本恒定、磨损量低）→剧烈磨损阶段（间隙扩大、磨损速率急剧增加直至失效）。"], ["粘着磨损", "又称咬合磨损：微凸体接触点局部应力超过屈服强度发生粘合并拽开；条件：相对滑动速度小、氧化膜脆弱、润滑差、接触应力大；表面特征为大小不等的结疤；按粘着点结合强度分涂抹、擦伤、撕脱、咬死。"], ["粘着磨损Archard模型", "W=KpL/(3HV)：磨损量与接触压力p、滑动距离L成正比，与材料硬度成反比，与接触面积无关；适用条件p≤1/3摩擦副材料硬度，p>σb时K急剧增大、造成大面积焊合和咬死。"], ["磨粒磨损", "一方表面坚硬微凸起或接触面间硬质粒子引起的磨损；两体（锉削）、三体（抛光）；按应力分低应力擦伤式、高应力辗碎式、凿削式；特征为擦伤或犁皱沟槽；W=KpL·tanθ/Hv。"], ["磨粒磨损影响因素", "基体硬度与韧性、显微组织、磨粒硬度；材料硬度越高抗磨粒磨损性能越好（H/E值越大磨损量越小，但E组织不敏感）；确定材料硬度以Hm=1.3Ha为依据；高锰钢是公认的理想抗凿削磨损材料。"], ["接触疲劳", "滚动或滚动+滑动摩擦时表面在接触压应力长期反复作用下引起的疲劳破坏；宏观特征为接触面出现针状或痘状凹坑（麻坑）；最大压应力在表面、与P^1/2（线接触）或P^1/3（点接触）成正比；最大切应力在次表层Z=0.786b处约0.3σzmax，摩擦系数>0.2时移到表面。"], ["接触疲劳分类", "点蚀（麻点剥落，深0.1~0.2mm，滚动+滑动、表面受力）；浅层剥落（0.2~0.4mm，次表层0.5~0.7b处最大循环切应力）；深层剥落（>0.4mm，强化与未强化结合处）。"], ["微动损伤", "两接触表面间小幅度相对切向运动引起的损伤；是粘着、磨料、腐蚀和表面疲劳的复合磨损过程；磨损产物易聚集在磨损点周围。"], ["腐蚀磨损", "摩擦面与周围介质发生化学或电化学反应形成腐蚀产物并被剥离的磨损；氧化磨损最常见；氧化磨损速率取决于氧化膜性质及其与基体结合强度；在所有磨损类型中磨损速度最小，生产中创造条件使其它磨损形态转化为氧化磨损。"], ["耐磨性与测量", "耐磨性=材料抵抗磨损的性能指标，磨损量愈小耐磨性愈高；磨损量表示：线磨损量U、体积磨损量V、重量磨损量W；测量方法：称重法、尺寸法；磨损试验机：圆盘-销式、滚动式、往复式、砂纸式、切入式；铁谱分析（定性+定量）、光谱分析（\u003c10μm早期精密诊断）。"]], "disc": [["粘着磨损 vs 磨粒磨损", "粘着：微凸体粘合-拽开（表面结疤），W∝p、L、1/H；磨粒：硬粒子微切削/犁皱（表面沟槽），W∝pL·tanθ/H。"], ["点蚀 vs 浅层剥落 vs 深层剥落", "按最大切应力位置与深度分：点蚀0.1~0.2mm（表面受力、滚动+滑动）；浅层剥落0.2~0.4mm（次表层0.5~0.7b）；深层剥落>0.4mm（强化与未强化结合处）。"], ["两体磨粒磨损 vs 三体磨粒磨损", "两体：一个表面上的硬凸起直接切削另一表面（如锉削）；三体：硬质粒子夹在两表面之间（如抛光）。"], ["摩擦 vs 磨损", "摩擦是阻碍相对运动的物理现象（原因）；磨损是摩擦作用下表面逐渐分离出磨屑而不断损伤的现象（必然结果）。"]]}, {"no": 6, "title": "第六章 材料的高温蠕变性能", "intro": "高温下材料性能呈现时间效应：掌握蠕变曲线三阶段、三种蠕变机理、晶间断裂与等强温度，以及蠕变极限、持久强度、应力松弛三个指标的区分。", "points": [["高温与约比温度", "温度高低相对于材料熔点而言，用约比温度T/Tm描述（T试验温度、Tm熔点，单位K）；高温：T/Tm>0.3~0.5；碳素钢超过300~350℃、合金钢350~400℃出现明显蠕变，低熔点金属（铅锡）室温即蠕变，高聚物室温以下即可蠕变。"], ["蠕变定义与曲线", "蠕变：材料在长时间的恒温、恒载荷作用下缓慢产生塑性变形的现象；蠕变曲线三阶段：减速蠕变（ab，速度随时间下降）→恒速蠕变（bc，速度恒定）→加速蠕变（cd，急剧增大直至断裂）；经验公式ε=ε0+f(t)+Dt+φ(t)。"], ["蠕变变形机理", "位错滑移（高温下位错还可攀移作垂直于滑移面的运动→软化；第Ⅲ阶段硬化与回复软化动态平衡，速率取决于位错攀移速率）；原子扩散（空位沿应力梯度从拉伸区扩散到压应力区，原子反向运动；包括体扩散和晶界扩散）；晶界滑动（高温下明显，占总蠕变量约10%）。"], ["蠕变断裂", "晶间断裂是蠕变断裂的普遍形式（沿晶断裂，断口微观冰糖状花样）；等强温度：晶界强度与晶体强度相等的温度，以上晶界强度低；晶界裂纹模型：三晶界交汇点楔形裂纹（低温高应力）、晶界微孔、空穴聚集；等强温度以上应粗化晶粒（减少晶界面积和高能晶界）。"], ["蠕变极限", "高温长时间载荷作用下机件不产生过量塑性变形的抗力指标；两种表示：①规定第二阶段蠕变速率下的应力值σ（如600℃、1×10^-5%/h→650MPa）；②规定温度与时间内产生一定蠕变应变量（%）的应力值σTε/t；汽轮机、电站锅炉常取1×10^-5%/h。"], ["持久强度", "材料在规定温度和时间内不发生蠕变断裂的最大应力，记作σtT（T温度℃、t时间h），如σ1000/600=200MPa；是高温长时载荷下材料对断裂的抗力指标；重要零件（发动机涡轮叶片）蠕变极限和持久强度都是设计依据。"], ["应力松弛", "材料总应变保持不变但应力随时间自行降低的现象（高温紧固螺栓、弹簧）；剩余应力σsh、松弛应力σso；剩余应力越高松弛稳定性越好；松弛稳定性用于评价材料在高温下的预紧能力。"], ["蠕变影响因素", "化学成分（基体选熔点高、自扩散激活能大、层错能低；Cr、Mo、W、Nb固溶强化+降低层错能，弥散相阻碍位错滑移；B、稀土增加晶界扩散激活能；控制S、P、Sn、Pb）；组织结构（正火+高温回火，回火温度高于使用温度100~150℃以上）；晶粒尺寸（等强温度以下细化、以上粗化，GH36平均晶粒0.15mm时650℃持久性能最好）；应力（低应力扩散机制控制、中高应力位错机制控制）；温度（热激活过程）。"], ["高温短时拉伸与高温硬度", "高温短时拉伸（火箭、导弹短时工作零件）测定σp、σs、σb、δ、Ψ；高温硬度：\u003c800℃用金刚石锥体或硬质合金球，>800℃用人造蓝宝石或刚玉压头，加载30~60s，延长至1~5h为持久硬度。"], ["高温疲劳", "最大特点是与时间有关（加载频率、波形、应变速率）；降低应变速率或频率、增加拉应力保持时间都会缩短疲劳寿命（沿晶蠕变损伤+环境腐蚀沿晶界发展）；裂纹扩展为疲劳与蠕变的叠加：低载荷以疲劳贡献为主、较高载荷以蠕变贡献为主；存在瞬时交互和顺序交互作用。"]], "disc": [["蠕变极限 vs 持久强度", "蠕变极限：不产生过量塑性变形的抗力（变形判据，规定蠕变速率或规定时间应变量）；持久强度：规定温度时间内不发生蠕变断裂的最大应力（断裂判据）。"], ["蠕变 vs 应力松弛", "蠕变：恒温恒载下应变随时间缓慢增长；应力松弛：总应变保持不变而应力随时间自行降低。"], ["低温蠕变 vs 高温蠕变", "按蠕变期间是否发生回复再结晶分：低温蠕变不发生回复再结晶；高温蠕变同时进行回复、再结晶过程。"], ["瞬时交互 vs 顺序交互", "高温疲劳中疲劳与蠕变两种损伤的交互作用：瞬时交互作用是同一时刻两种损伤同时作用；顺序交互作用是一个加载历程对以后加载历程产生的影响。"]]}, {"no": 7, "title": "第七章 材料的热学性能", "intro": "本章介绍材料的热容、热膨胀和热传导的机理、影响因素、测试方法及工程应用：重点掌握热容的两个经验定律（杜隆—珀替、柯普）与量子热容理论（爱因斯坦、德拜），热膨胀的机理与应用，以及固体的三种导热方式与影响因素。", "points": [["热性能的物理本质", "构成材料的质点（原子、离子）在其平衡位置作微小振动即晶格热振动；晶格振动具有波的形式，称晶格波（点阵波），其能量量子称为声子（与光子类似）。"], ["热容基本概念", "无相变、无化学反应、无对外热交换时，物体温度升高1K所吸收的热量称热容CT=ΔQ/ΔT（J/K）；比热容（质量热容）单位J/(kg·K)，摩尔热容单位J/(mol·K)；平均比热容C均=Q/[m(T2-T1)]测量方便但粗糙，T2无限接近T1时得到真比热容。"], ["Cp与Cv", "恒压加热除温度升高外还对外做功（膨胀功），故Cp>Cv；试验上Cp测定方便，理论上Cv更有意义。"], ["杜隆—珀替定律", "大多数固态单质的原子热容几乎都相等，1mol单原子固体摩尔定容热容Cv,m=3R≈25J/(K·mol)，即热容是与温度无关的常数；适用于高温区（室温适用于大多数金属和一些非金属），低温时相差很大（热容随温度下降而减小）。"], ["柯普定律", "化合物分子热容等于构成此化合物各元素原子热容之和C=ΣniCi；在较高温度下固体热容具有加和性，对573K以上大多数氧化物和硅酸盐化合物符合较好，也可用于计算多相合金和复合材料。"], ["量子热容理论", "能量量子化，能量量子hv为最小单位（声子）。爱因斯坦模型：各原子独立振动且频率相同，Cv,m与温度有关、T→0K时趋于0；不足是低温时Cv与T成指数关系而实验为T3。德拜模型：考虑原子相互作用、把晶体视为连续介质，振动谱0~νmax；低温符合德拜T立方定律Cv∝T3；不足是低温、高温不完全相符，解释不了超导现象。"], ["热容影响因素", "①与材料构成形式关系不大（CaO+SiO2混合物与CaSiO3的热容-温度曲线基本相符）；②相变：一级相变在临界温度Tc热容突变，二级相变在相变区热焓突然升高、热容急剧增大；③与温度有关：Cp=Ce+Cg=γT+βT3，低温时电子热容小、热容按T3变化，高温时晶格热容小、呈线性关系；④高温下具有加和性。"], ["热分析及其应用", "热分析是在程序控制下测量物质物理性质与温度关系的方法；常用方法：TG（热重法）、DTA（差热分析）、DSC（差示扫描量热法）、TMA（热机械分析）；应用：建立合金状态图、测定组织转变（相变、熔化、凝固、分解）、用失重法分析含结晶水物质的脱水温度。"], ["热膨胀系数", "线膨胀L2=L1[1+α(T2-T1)]，α为平均线膨胀系数、随温度变化（一般随温度升高而增大）；体膨胀V2=V1[1+αV(T2-T1)]；各向同性材料αV≈3α。"], ["热膨胀机理", "晶格相邻质点间作用力是非线性且非对称的：r\u003cr0时斥力随位移增大很快，r>r0时引力变化较慢，质点振动中心不在r0处而是右移；温度越高质点间距越大、膨胀量越大。"], ["影响热膨胀的因素", "①合金成分：单相固溶体α介于组元之间（Ag-Au近似Vegard直线定律），加过渡族元素α无规律；键强度高的材料（如SiC）α低；结构紧密的晶体α较大、松散的非晶态玻璃α较小（多晶石英12×10⁻⁶K⁻¹，石英玻璃0.5×10⁻⁶K⁻¹）；②与热容的关系（格律乃森定律：膨胀系数与热容随温度变化的特征基本一致，低温均按T3变化）；③原子序数：ⅠA族α随原子序数增大，其他A族减小；过渡族低、碱金属高；④硬度越高α越小；⑤相变：一级相变比容突变、膨胀量缓变，二级相变α有转折且下降。"], ["热膨胀的应用", "双金属控温器；机械装配中的过盈配合；复合材料（Al/石墨纤维、Al/SiC）；釉的膨胀系数比陶瓷适当小使坯内产生压应力；用膨胀法测定TTT曲线（过冷奥氏体转变引起体积膨胀，膨胀量与转变量成正比）；研究晶体缺陷（相对体积变化10⁻⁴量级，可确定空位或位错密度）。"], ["热膨胀的测定", "望远镜（放大镜）直读法（放大倍率大于10倍）；顶杆式间接法（顶杆加位移传感器或千分表）；光杠杆法。"], ["热传导与导热系数", "热量自动从高温端流向低温端；λ为导热系数（W/(m·K)），式中负号表示热量传导方向与温度梯度方向相反；稳定传热时ΔQ/Δt为常数。"], ["三种导热方式", "①自由电子运动导热λe=Ceυele/3，金属主要靠它；②晶格振动（声子）导热λρ=Cρυρlρ/3，非金属（离子晶体）主要靠它；③光子辐射导热λr=16σn²T³lr/3。"], ["影响热传导的因素", "①纯金属：电导率高则热导率高；晶粒粗大热导率高；立方晶系与晶向无关、非立方晶系各向异性；杂质强烈影响导热。②温度：晶体材料在常用温度范围λ随温度升高而下降。③晶体结构：结构越复杂导热率越低、有方向性（膨胀系数低的方向导热率大）；多晶\u003c单晶；非晶态较小。④化学组成：轻元素、结合能大导热率大；溶质浓度增加导热率降低（连续互溶固溶体在50%浓度处最低）。⑤气孔：气孔率升高导热率降低。"], ["热传导的应用", "隔热耐火材料采用气孔率高、导热系数低的多孔轻质材料；核反应堆燃料元件的最高使用温度与导热系数有关；航空航天领域（极端温度、低温存储、火箭再入烧蚀）；电子行业：CPU散热片要求大有效散热面积、高λ、高热容量，高温下半导体器件应选高λ衬底（SiC、Si）。"]], "disc": [["平均比热容 vs 真比热容", "平均比热容C均=Q/[m(T2-T1)]测量方便但粗糙，区间越大精度越差；真比热容是T2无限接近T1时的极限值，更精确。"], ["Cp vs Cv", "恒压加热除升温外还对外做功（膨胀功），故Cp>Cv；试验上Cp测定方便，理论上Cv更有意义。"], ["杜隆—珀替定律 vs 柯普定律", "杜隆—珀替：单质原子热容几乎相等（3R≈25J/(K·mol)，与温度无关、高温适用）；柯普：化合物分子热容等于各元素原子热容之和（加和性，573K以上氧化物和硅酸盐符合好）。"], ["爱因斯坦模型 vs 德拜模型", "爱因斯坦：各原子独立振动、频率相同，低温时Cv与T成指数关系（与实验不符）；德拜：考虑原子相互作用、把晶体视为连续介质，低温时Cv∝T³（德拜T立方定律），与实验非常相符。"], ["一级相变 vs 二级相变（热容特征）", "一级相变在临界温度Tc热容突变；二级相变在一个温度范围内进行、热焓突然升高、热容急剧增大。"], ["多晶石英 vs 石英玻璃（膨胀系数）", "结构紧密的晶体热膨胀系数较大（多晶石英α=12×10⁻⁶K⁻¹）；松散的非晶态玻璃结构膨胀系数较小（石英玻璃0.5×10⁻⁶K⁻¹）。"], ["电子导热 vs 声子导热", "金属主要靠自由电子运动导热（λe=Ceυele/3）；非金属（离子晶体）主要靠晶格振动（声子）导热（λρ=Cρυρlρ/3）；另有光子辐射导热（λr=16σn²T³lr/3）。"], ["单晶 vs 多晶（导热率）", "同种材料多晶体的导热率比单晶体小；非晶态材料导热系数也较小。"]]}, {"no": 8, "title": "第八章 材料的磁学性能", "intro": "本章介绍材料磁学性能的基本概念、影响因素、磁性的测量和应用：重点掌握材料磁化的实质，抗磁材料、顺磁材料和铁磁材料的差异，以及磁畴、磁畴结构、磁滞回线等基本概念。", "points": [["磁性的起源", "材料磁性源于电子轨道运动和自旋运动；电子运动可看作闭合环形电流而产生磁矩（方向与环形电流法线方向一致，大小为电流与面积的乘积）。"], ["基本磁学量", "磁场强度H（A/m）；磁化强度M=Σmi/V（A/m），即附加磁场H′，M=χH；磁化率χ可正可负；磁感应强度B（特斯拉T）；磁导率μ反映B随H的变化速率，相对磁导率μr=μ/μ0。"], ["物质磁性分类（按χ）", "抗磁体：χ为小负值约10⁻⁶（经典抗磁体Cu、Ag、Au、Hg、Zn，χ不随温度变化；反常抗磁体Bi、Ga、Sb、Sn、In，χ随温度变化且大10~100倍）；顺磁体：χ为正值约10⁻³~10⁻⁶（正常顺磁体χ∝1/T，如Pt、Pd、奥氏体不锈钢、稀土；χ与温度无关的如Li、Na、K、Rb）；铁磁体：χ为很大正数且非线性（Fe、Co、Ni，居里点TC以上变为顺磁）；亚铁磁体：类似铁磁但χ较小（Fe₃O₄、铁氧体）；反铁磁体：χ为小的正数（α-Mn、Cr、NiO，尼尔点TN以上象顺磁体）。"], ["按相对磁导率分类", "抗磁质μr\u003c1（B\u003cB0，减弱原磁场）；顺磁质μr>1（B>B0，增强原磁场，顺磁与抗磁的μr都接近1）；铁磁质μr>>1（10²~10⁴，通常不是常数）。"], ["原子本征磁矩", "三种磁矩：电子轨道磁矩、电子自旋磁矩（内禀特性，约一个玻尔磁子0.927×10⁻²³A·m²）、原子核磁矩（约为电子磁矩的1/2000，可忽略）；电子层排满时各磁矩总和为零、原子无磁矩；只有存在未被排满的电子层时原子才有固有磁矩（如Fe的3d⁶，有4个未抵消的自旋磁矩）。"], ["抗磁性", "没有外磁场时各电子轨道与自旋磁矩完全抵消（固有磁矩为零）；外磁场下电子轨道运动受洛伦兹力，产生的附加磁矩Δm总是与外加磁场H方向相反；前提条件：电子壳层完全填满（惰性气体、离子型固体、共价键晶体C/Si/Ge/S/P、金属Bi/Pb/Cu/Ag）。"], ["顺磁性", "原子中具有未成对电子或内壳层未被填满、或具有奇数个核外电子时，本征磁矩不为零；无外场时热运动使固有磁矩无序分布、宏观不显磁性；外场使磁矩趋于规则取向（克服热运动）而显示顺磁性；金属自由电子的自旋磁矩也产生顺磁性（χ抗=-1/3χ顺，总体表现为顺磁）。"], ["抗磁性与顺磁性的影响因素", "①原子结构：轨道运动产生抗磁、固有磁矩产生顺磁、自由电子顺磁大于抗磁；惰性气体原子磁矩为零（抗磁），大多数非金属抗磁（O和石墨为顺磁），Cu/Ag/Au/Cd/Hg抗磁，碱金属、碱土金属（除Be）、3价金属、稀土为顺磁，Ti/V/Cr/Mn等过渡族为顺磁；②温度：对抗磁性影响不大，顺磁性遵循居里定律χ=C/T、居里-外斯定律χ=C′/(T+θ)；③相变与组织转变：同素异晶转变（白锡→灰锡、α-Fe→γ-Fe）改变磁化率，加工硬化使铜抗磁性减弱甚至转为顺磁（退火后恢复）；④合金成分与组织。"], ["铁磁性的根源", "未被抵消的电子自旋磁矩：内壳层未被填满是必要条件（Fe、Co、Ni的3d层分别有4、3、2个空位）；自发磁化由电子间相互作用（交换作用）产生，交换能Eex=-2ASiSjcosφ；当电子交换积分A>0且φ=0时相邻自旋同向排列、能量最低，产生自发磁化。"], ["铁磁性产生的条件", "①内壳层未被填满的原子或离子，本征磁矩不为零；②点阵常数与电子壳层半径之比Rab/r>3，使交换积分A>0，即需具备一定的晶体结构产生自发磁化。Mn、Cr满足第一条件但不满足第二条件，通过合金化改变晶格常数可成为铁磁体（如Mn-Cr-Al、MnAs、MnSb、MnBi、CrTe）。"], ["磁畴与畴壁", "磁畴：铁磁质中相邻原子电子因自旋强交换耦合作用，无外磁场时自旋磁矩在小区域内自发平行排列、自发磁化达到饱和的微小区域（1907年提出、1932年实验观察到）；各磁畴方向不同，故大块磁铁不显磁性；单畴颗粒临界尺寸约1μm。畴壁：相邻磁畴间磁矩方向逐渐变化的过渡区域；铁晶体畴壁约含1000个原子层，磁畴宽度约10⁻²~10⁻⁵cm。"], ["磁化曲线三阶段", "①微弱磁场：B、M随H平稳增加、近似线性；②中等磁场：B、M急剧增高、μ出现极大值μm（不可逆磁化阶段）；③强磁场：B、M增大趋缓、μ减小并趋于稳定值，达到Hs时M达饱和值Ms（Bs为饱和磁感应强度）。"], ["磁滞回线", "磁化曲线不可逆使退磁时M（或B）落后于H（磁滞效应），磁化一周得闭合回线；相关指标：饱和磁化强度Ms、剩余磁化强度Mr（H=0时保留的磁化强度）、矫顽力Hc（去掉剩磁所需的临界外磁场）、磁滞损耗（回线面积等于磁化一周的能量损耗）、最大磁能积(BH)m。"], ["软磁材料与硬磁材料", "软磁材料磁滞回线瘦小、高导磁率、低矫顽力（工业纯Fe、硅钢、FeNi/FeCo合金、磁性陶瓷，用于电磁铁、变压器铁心等）；硬磁（永磁）材料回线肥大、高Hc/Mr/(BH)m（铁氧体、AlNiCo、Co、NdFeB等）；矩磁材料回线接近矩形（在±Bs处）。"], ["磁各向异性与磁致伸缩", "磁各向异性：沿不同晶轴磁化得到的磁化强度不同；磁致伸缩：沿磁化方向发生长度伸长（正磁致伸缩）或缩短（负磁致伸缩）。"], ["反铁磁性", "电子交换积分A\u003c0时相邻磁矩反平行排列；若相邻原子磁矩相等则相互抵消、不能形成自发磁化区域（自发磁化强度为零）；典型反铁磁体α-Mn、Cr、NiO、MnO等；χ出现最大值的相应温度称尼尔点TN，TN以下呈反铁磁性、TN以上象顺磁体（χ=C/(T+Θ)，Θ≈TN）。"], ["影响铁磁性参数的因素", "温度（升高则Ms下降）；形变和晶粒度（点阵畸变、内应力增加，织构导致方向性，晶粒大小影响类似冷变形）；固溶体和多相合金（溶入抗磁或弱磁元素Ms降低、溶入强顺磁元素Ms先增后降、溶入铁磁元素形成固溶体时Ms单调连续变化；C、N、O间隙固溶体造成点阵畸变；与顺磁或抗磁金属形成的化合物是顺磁性的、与非金属形成的化合物是铁磁性的）。"]], "disc": [["抗磁体 vs 顺磁体 vs 铁磁体", "按磁化后对磁场的影响：抗磁体M与H反向（χ\u003c0约10⁻⁶、削弱磁场）；顺磁体M与H同向（χ>0约10⁻³~10⁻⁶、微弱增强、呈直线关系）；铁磁体弱H产生很大M（χ为大正数、非线性、强烈增强磁场）。"], ["经典抗磁体 vs 反常抗磁体", "经典抗磁体χ不随温度变化（Cu、Ag、Au、Hg、Zn）；反常抗磁体χ随温度变化且大小为前者的10~100倍（Bi、Ga、Sb、Sn、In）。"], ["居里点TC vs 尼尔点TN", "TC是铁磁体转变为顺磁体的临界温度（T>TC后χ=C/(T-TC)）；TN是反铁磁体χ出现最大值时的温度（TN以下呈反铁磁性、以上象顺磁体，χ=C/(T+Θ)、Θ≈TN）。"], ["轨道磁矩 vs 自旋磁矩", "轨道磁矩由电子绕核轨道运动产生；自旋磁矩是电子的内禀特性（任何状态皆有，约一个玻尔磁子）；原子核磁矩约为电子磁矩的1/2000、可忽略。"], ["磁化强度M vs 磁感应强度B", "M=Σmi/V，是单位体积内原子固有磁矩的总和（即附加磁场H′）；B是垂直单位面积的磁力线数（特斯拉），B=M+H。"], ["软磁材料 vs 硬磁材料", "按磁滞回线形状分：软磁回线瘦小、高μ低Hc（工业纯Fe、硅钢、FeNi/FeCo合金、磁性陶瓷）；硬磁（永磁）回线肥大、高Hc、高Mr、高(BH)m（铁氧体、AlNiCo、Co、NdFeB）。"], ["铁磁性 vs 亚铁磁性 vs 反铁磁性", "铁磁：原子磁矩方向一致（自发磁化）；亚铁磁：大小不等的磁矩反平行、未完全抵消；反铁磁：相邻磁矩大小相等且反平行、完全抵消（自发磁化强度为零）。"], ["正磁致伸缩 vs 负磁致伸缩", "沿磁化方向长度伸长为正磁致伸缩；长度缩短为负磁致伸缩。"]]}, {"no": 9, "title": "第九章 材料的电学性能", "intro": "本章介绍材料的导电、超导、热电与介电性能：重点是三种导电机理、超导体的两特征与三指标、三种热电效应，以及介质极化的微观机制与介电击穿的三种形式。", "points": [["电学基本参量", "电导率σ是表征电性能的主要参量，欧姆定律微分形式J=σE；电阻率ρ=1/σ（Ω·m）；固体按电阻率分类：导体ρ\u003c10⁻²Ω·m、半导体10⁻²~10¹⁰Ω·m、绝缘体>10¹⁰Ω·m。"], ["经典自由电子理论", "金属由金属离子构成晶格点阵并形成均匀电场，价电子完全自由地弥散分布；无电场时自由电子各方向运动几率相同，有电场时沿电场方向运动形成电流、与金属离子碰撞形成电阻；导电性取决于自由电子数量、平均自由程、平均运动速度。"], ["量子自由电子理论", "价电子按量子化规律具有不同的能量状态（能级）；外电场使正反向运动的电子能量形成差异、数量不等而导电；电磁波在传播中被金属离子点阵散射后相互干涉而形成电阻；0K时电子波在理想晶体中传播不受阻碍、电阻为零（超导）。"], ["能带理论", "金属中由离子造成的势场呈周期变化；能隙：能带分裂后某些能态电子不能取值；禁带：电子不可以具有的能级组成的能带；允带：电子可以具有的能级组成的能带（每个能级只能允许两个自旋相反的电子）；导带：允带中未被填满的能级；满带：允带中所有能级都被填满。金属导带部分充填、能带相互重叠而导电；半导体和绝缘体导带空、价带满，区别仅在禁带宽度不同；一价金属能带宽、重叠区宽、导电性好。"], ["影响导电性的因素", "①温度：T升高离子振动加剧、电子自由程减小、散射率增加；德拜温度以上ρ近似线性（α≈10⁻³/K），以下ρ∝T⁵。②冷塑性变形和应力：变形使点阵畸变、缺陷增加、电阻增大；回复降低点缺陷浓度；再结晶消除畸变和缺陷；淬火保留高温点缺陷；拉应力使原子间距增大、电阻增大，压应力反之。③合金化：固溶体ρ随溶质增多而增大（点阵畸变散射+有效电子数减少）；金属化合物ρ比组元小得多（键合性质改变、金属键部分转为共价键或离子键）；多相合金ρ约为各相加权平均（与相导电性、相对含量、形貌有关）。"], ["超导体的发现与特征", "1911年昂内斯发现汞在4.2K时直流电阻突然消失（1913年获诺贝尔奖）；特征：①零电阻（超导环中感生电流可持续存在——永久电流，且仅直流有零电阻）；②完全抗磁性（迈斯纳效应：内部磁场完全被排除、磁通量保持为零）。"], ["超导三指标", "①临界转变温度Tc（越接近室温越好，金属氧化物最高约140K）；②临界磁场强度Hc，经验公式Hc(T)=Hc(0)(1-T²/Tc²)；③临界电流密度Jc（输入电流产生的磁场与外加磁场一起破坏超导态，必须限制最大输入电流密度）。"], ["三种热电效应", "塞贝克效应（1821）：两种不同金属构成闭合回路、两接头有温差时回路产生电流，是温差发电和热电偶测温的基础；实质是接触电势差（取决于电子逸出功和有效电子密度）。珀耳帖效应（1834）：塞贝克效应的逆效应，回路通直流电流时两接头产生温差（吸热或放热）、可逆，电子致冷依赖它；珀耳帖热与电流方向有关、焦耳热与方向无关。汤姆逊效应（1851）：电流在温度不均匀的导体中流过时，除焦耳热外还吸收或放出热量（汤姆逊热）；金属棒两端温度不同时形成电势差（自由电子热扩散）。"], ["热电势的影响因素", "①金属本性：电子逸出功、自由电子密度（纯金属热电势顺序Si、Sb、Fe、Mo、Cd、W、Au、Ag、Zn、Rh，后者相对前者为负）；②温度：热电势与两接点温差近似成正比；③合金化：形成化合物时热电势突变、显著增加（半导体性质），多相合金热电势处于组成相之间；④钢的碳含量：纯铁为正、钢为负，含碳量越高热电势越大；含碳量相同时淬火态比退火态高。"], ["半导体的敏感效应", "①热敏效应：温度增加价带电子跃迁加快、自由电子和空穴增加、电导率升高，ρ=ρ0e^(B/T)，B约2000~5000K；②光敏效应（光电导）：光辐照下电子吸收光子挣脱束缚形成自由电子、电阻率下降，要求光子能量大于禁带宽度（CdS明暗电阻差2000多倍）；光生伏特效应：PN结在短波光照射下诱导电子-空穴对产生电势差；③压敏效应：电压敏感（ZnO非线性，用于避雷器）、压力敏感（压阻效应Δρ/ρ0=βT）；④磁敏效应：霍尔效应（UH=(RH/d)ICB，RH=1/nq，1879年发现，可测磁场与电流）、磁阻效应（载流子在磁场中受洛伦兹力偏转、漂移路径增加、电阻增加）。"], ["介质极化", "电介质在外电场作用下两个端面分别出现束缚正、负电荷的现象；微观机制：①电子位移极化（电子云相对原子核位移，频率达光频10¹⁴Hz以上、与温度无关）；②离子位移极化（离子键合拉长、电偶极矩增加，约10⁻¹²~10⁻¹³秒、温度升高增强）；③松弛（弛豫）极化（弱联系电子、离子、偶极子，统计性质、建立时间长10⁻²~10⁻³秒、不可逆、随温度有极大值，存在于聚合物分子晶体缺陷处或玻璃体内）；④偶极子取向极化（固有偶极矩沿外场取向，10⁻²~10⁻¹⁰秒、随温度有极大值）。"], ["介电常数与介电击穿", "介电常数ε：电容器充有电介质时的电容与真空电容的比值，表征介质极化大小与贮存电能的能力；介电击穿：强电场（10⁷~10⁸V/m）中材料突然从介电状态变成导电状态；击穿形式：电击穿（电子雪崩、10⁻⁷~10⁻⁸秒完成）、热击穿（损耗转为热量、散热受限制时急剧加热）、化学击穿（高温、潮湿、高电压、腐蚀性气体环境，漏导损耗发热或封闭气孔内气体电化学击穿）；影响抗电强度的因素：温度（对电击穿几乎无影响、对热击穿和化学击穿影响大）、频率（降低频率可提高击穿电压）、散热条件、器件大小与形状。"]], "disc": [["导体 vs 半导体 vs 绝缘体", "按电阻率分类：导体ρ\u003c10⁻²Ω·m；半导体10⁻²~10¹⁰Ω·m；绝缘体>10¹⁰Ω·m；半导体与绝缘体的导带皆空、价带皆满，区别仅在禁带宽度不同。"], ["禁带 vs 允带 vs 导带 vs 满带", "禁带：电子不可以具有的能级组成的能带；允带：电子可以具有的能级组成的能带（每个能级允许两个自旋相反的电子）；导带：允带中未被填满的能级；满带：允带中所有能级都被填满。"], ["塞贝克效应 vs 珀耳帖效应", "塞贝克（1821）：温差→电流（热电偶测温、温差发电）；珀耳帖（1834）：电流→温差（接头吸/放热、电子致冷），是塞贝克效应的逆效应、可逆。"], ["珀耳帖热 vs 焦耳热", "珀耳帖热与电流方向有关（可逆的吸热或放热）；焦耳热与电流方向无关（不可逆发热）。"], ["电击穿 vs 热击穿 vs 化学击穿", "电击穿：电子雪崩、瞬息完成（10⁻⁷~10⁻⁸秒）、温度影响小；热击穿：介质损耗转为热量、散热受限制时急剧加热；化学击穿：高温、潮湿、高电压、腐蚀性气体环境，漏导发热或封闭气孔内气体电化学击穿。"], ["位移极化 vs 松弛极化", "位移极化（电子、离子）快（光频约10¹⁴Hz、10⁻¹²~10⁻¹³秒）、可逆，离子位移极化随温度增强；松弛极化慢（10⁻²~10⁻³秒）、不可逆、随温度有极大值、需吸收能量（存在于聚合物、晶体缺陷处、玻璃体内）。"], ["霍尔效应 vs 磁阻效应", "霍尔效应：载流子受洛伦兹力偏转产生横向霍尔电势UH=(RH/d)ICB；磁阻效应：载流子偏转使漂移路径增加、沿电场方向的载流子减少、电阻增加。"]]}, {"no": 10, "title": "第十章 材料的耐蚀性能", "intro": "本章介绍腐蚀的基本概念与类型、金属的电化学腐蚀机理、抗腐蚀措施与不锈钢：重点是腐蚀原电池、腐蚀倾向的热力学判据，以及铁素体、马氏体、奥氏体等各类不锈钢的组织与性能特点。", "points": [["腐蚀的基本概念", "腐蚀是物质表面因发生化学或电化学反应而受到破坏的现象，是自发进行的过程；按机理分化学腐蚀（非离子导体介质：干燥气体、非电解质溶液）和电化学腐蚀（离子导体介质：电解质溶液）；按环境分大气腐蚀、海水腐蚀、淡水腐蚀、土壤腐蚀、工业介质腐蚀。"], ["腐蚀的破坏形式", "①均匀腐蚀：均匀地在表面产生、易发现、危害不大；②点腐蚀：集中于表面不大区域并不断向深处发展、可穿透金属；③晶界腐蚀：沿晶界进行、危害最大；④应力腐蚀：在拉应力状态下发生、无预兆、危害大；⑤磨损腐蚀：腐蚀与磨损相互促进、加速破坏。"], ["电化学腐蚀机理", "腐蚀原电池：只能导致腐蚀而不能对外做功的短路原电池；四个组成部分：阳极、阴极、电解质溶液、电路；三个过程：阳极过程、阴极过程、电流流动；金属的腐蚀破坏集中出现在阳极区。典型情形：异种金属接触（铜与钢）、浓差电池（存水的铁桶）、不同电位的显微组织微电池（生锈）、成分不均匀（晶界与晶粒）、应力不均匀（铁丝弯曲处、铆钉头）。"], ["腐蚀倾向的热力学判据", "ΔG\u003c0时腐蚀反应可能发生、ΔG越负越不稳定；ΔG>0不可能发生；ΔG=nFE，满足ΔG\u003c0的必要条件是E>0，即阳极电位小于阴极电位；ΔG只能判断腐蚀倾向大小、不能判断腐蚀速度大小；常用标准电极电位作为热力学判据。"], ["不锈钢的定义与耐蚀分级", "不锈钢是在空气、水、盐水、酸碱等腐蚀介质中具有高的化学稳定性的钢；只能抵抗大气、水等介质腐蚀的钢叫不锈钢（腐蚀速度\u003c0.01mm/年完全耐蚀、\u003c0.1mm/年耐蚀）；在酸碱等介质中抗蚀的称耐酸钢（\u003c0.1mm/年完全耐蚀、\u003c1mm/年耐蚀）；耐蚀是相对的、是针对具体介质而言的。"], ["提高耐蚀性的途径", "①形成稳定的保护膜（Cr、Al、Si有效）；②提高固溶体电极电位或形成稳定的钝化区（Cr、Ni、Si；Ni贵而紧缺、Si易使钢脆化，Cr最理想）；③获得单相组织（Ni、Mn促进形成单相奥氏体）；④机械保护措施或覆盖层（电镀、发蓝、涂漆）。"], ["不锈钢的分类与当量", "铁素体形成元素：Cr、Mo、Si、Ti、Nb；奥氏体形成元素：Ni、C、N、Mn、Cu、Co；铬当量[Cr]=Cr+1.5Mo+2.0Si+1.5Ti+1.75Nb+5.5Al+5V+0.75W，镍当量[Ni]=Ni+Co+0.5Mn+30C+25N+0.3Cu；按组织分：马氏体不锈钢（1Cr13~4Cr13、Cr17Ni2、9Cr18）、铁素体不锈钢（0Cr17Ti、1Cr25Ti、00Cr27Mo）、奥氏体不锈钢（1Cr18Ni9Ti、1Cr18Mn8Ni5N）、奥氏体-铁素体复相不锈钢（0Cr21Ni5Ti）、沉淀硬化不锈钢（17-7PH、PH15-7Mo）。"], ["合金元素的作用", "Cr是决定钢耐蚀性的主要元素（提高固溶体电极电位、表面形成致密氧化膜、符合n/8定律）；C提高强度但降低冷变形性、焊接性和耐蚀性，应尽可能低；N稳定奥氏体、提高强度、保持塑韧性、提高耐蚀性尤其是耐局部腐蚀（控氮0.05~0.10%、中氮0.10~0.40%、高氮>0.40%）；Ni是奥氏体形成元素、可适当提高电极电位；Mn可部分代Ni但不单独加入；Ti、Nb形成稳定碳化物固定C、防止晶界腐蚀；Mo提高钝化能力、扩大钝化介质范围。"], ["介质对耐蚀性的影响", "弱腐蚀介质（大气、水、水蒸气）→需大于13%Cr；氧化性介质（硝酸）→需大于17%Cr、Cr越高越好；非氧化性酸（稀硫酸）→在大于17%Cr基础上加Mo、Cu；强有机酸→Cr-Mn型基础上加Mo、Cu；含Cl⁻介质（海水）→Cl⁻半径小、腐蚀性大。"], ["铁素体不锈钢", "三类：Cr13型（0Cr13、0Cr13Al、0Cr11Ti）、Cr17型（1Cr17、0Cr17Ti、1Cr17Mo）、Cr25-30型（1Cr28、1Cr25Ti、00Cr30Mo2）；特点：含碳量低于0.25%、可加Mo、Ti、Al、Si；在硝酸、氨水等介质中耐蚀抗氧化；力学性能和工艺性能较差、脆性大、韧脆转变温度在室温左右；无同素异构转变、多在退火软化状态使用。脆性：①粗大原始晶粒（600℃以上晶粒开始长大）；②475℃脆性（含大于15%Cr的钢在400~525℃长时间加热最甚，铬有序化形成α″相共格内应力）；③σ相脆性（σ相高硬度、大体积效应、沿晶界分布）。"], ["马氏体不锈钢", "主要含12~18%Cr、淬火冷却能产生马氏体；三类：Cr13型（1Cr13、2Cr13、3Cr13、4Cr13）、高碳高铬型（9Cr18、9Cr18MoV）、低碳17Cr-2Ni型（1Cr17Ni2）；用途：1Cr13（M+F，结构件）、2Cr13（M）、3Cr13（工具）、4Cr13（M+K，手术刀）；热处理：软化处理（高温回火700~800℃保温2~6h空冷得到回火索氏体，或完全退火）、调质处理（1Cr13、2Cr13，640~700℃回火）、淬火+低温回火（3Cr13、4Cr13，1000~1050℃加热、硝盐分级冷却，组织为M+K+少量残余A）。"], ["奥氏体不锈钢", "应用最广泛的耐酸钢（约占不锈钢总产量的2/3）；优点：耐蚀性高、塑性好易加工、无同素异构转变因而焊接性好、韧度和低温韧度好（一般无冷脆倾向）、无磁性、导热性差、价格较贵；典型成分18Cr-8Ni（Cr+Ni=26，接近n/8定律n=2）；Ti、Nb提高抗晶间腐蚀能力，Mo提高钝化作用、降低点蚀倾向、提高有机酸中的耐蚀性，Cu提高硫酸中的耐蚀性，Si提高抗应力腐蚀断裂能力；平衡态组织为奥氏体+铁素体+碳化物，固溶处理后获得单相奥氏体。"], ["奥氏体不锈钢的晶间腐蚀", "原因：在焊缝及热影响区（450~800℃）沿晶界析出(Cr,Fe)₂₃C₆，晶界附近产生贫Cr区（低于1/8定律临界值）；Ni、Co、Si促进晶间腐蚀，Mo、Ti、Nb、Mn、V阻止；含碳量提高使倾向增大；敏化处理与敏感性的关系用TTS曲线表示。措施：①降低含碳量；②加Ti、Nb析出特殊碳化物以稳定组织；③1050~1100℃固溶处理保证Cr含量；④非稳定化不锈钢退火均匀化消除贫Cr区；⑤稳定化钢热处理形成Ti、Nb特殊碳化物、稳定固溶体中的Cr。"], ["双相不锈钢", "指铁素体与奥氏体各约占50%的不锈钢，较少一相的含量最少需达30%；通过正确控制化学成分和热处理工艺，兼有铁素体和奥氏体不锈钢的优点。"]], "disc": [["化学腐蚀 vs 电化学腐蚀", "化学腐蚀：金属与化学介质直接反应（非离子导体介质），不产生腐蚀电流；电化学腐蚀：金属表面与电解质溶液反应（离子导体介质），有腐蚀电流（腐蚀原电池）。"], ["均匀腐蚀 vs 点腐蚀 vs 晶界腐蚀", "均匀腐蚀均匀地产生在表面、易发现、危害不大；点腐蚀集中于局部并向深处发展、可穿透金属；晶界腐蚀沿晶界进行、危害最大。"], ["腐蚀原电池 vs 普通原电池", "腐蚀原电池只能导致金属腐蚀而不能对外做功（短路原电池）；普通原电池能对外做功。"], ["不锈钢 vs 耐酸钢", "不锈钢：在空气、水等介质中耐蚀（腐蚀速度\u003c0.01mm/年完全耐蚀、\u003c0.1mm/年耐蚀）；耐酸钢：在酸碱等介质中耐蚀（\u003c0.1mm/年完全耐蚀、\u003c1mm/年耐蚀）；耐蚀是相对的、针对具体介质。"], ["铁素体形成元素 vs 奥氏体形成元素", "铁素体形成元素：Cr、Mo、Si、Ti、Nb；奥氏体形成元素：Ni、C、N、Mn、Cu、Co。"], ["475℃脆性 vs σ相脆性", "475℃脆性：含大于15%Cr的钢在400~525℃长时间加热（以475℃最甚），铬有序化形成α″相、产生共格内应力；σ相脆性：σ相硬度高、体积效应大、沿晶界分布，显著降低塑韧性。"], ["固溶处理 vs 退火（奥氏体不锈钢）", "固溶处理（1050~1100℃水冷）：获得最大软化程度、最高耐蚀性（奥氏体合金度最大）；退火：非稳定化不锈钢成分均匀化、消除贫Cr区。"], ["Cr的作用 vs Ni的作用", "Cr：决定钢耐蚀性的主要元素（提高固溶体电极电位、形成致密氧化膜、符合n/8定律）；Ni：奥氏体形成元素、适当提高电极电位、促进单相奥氏体组织、价格贵且紧缺。"], ["点蚀倾向与合金元素", "Mo提高不锈钢钝化作用、降低点蚀倾向、提高有机酸中的耐蚀性；Cu提高硫酸中的耐蚀性；Si提高抗应力腐蚀断裂能力。"]]}], "part2": [{"ch": 1, "title": "第一章 材料单向静拉伸的力学性能", "mcq": [{"tag": "拉伸试验意义", "q": "通过材料的单向静拉伸试验，可以测定材料哪些基本的力学性能指标？", "opts": ["只有强度和硬度", "弹性、塑性、强度、韧性", "只有塑性和韧性", "弹性、硬度、耐磨性"], "ans": "B", "points": "拉伸试验可测定弹性、塑性、强度、韧性等基本力学性能指标，并可根据拉伸性能预测疲劳、断裂等其他力学性能。"}, {"tag": "弹性变形", "q": "大多数材料在弹性变形阶段基本表现为线弹性，其应力-应变关系符合哪一定律？", "opts": ["阿基米德定律", "胡克定律", "帕斯卡定律", "牛顿定律"], "ans": "B", "points": "弹性阶段应力与应变成正比（σ=Eε），符合胡克定律，拉伸曲线近似为直线。"}, {"tag": "拉伸四阶段", "q": "低碳钢拉伸过程中力学行为四个阶段的正确顺序是：", "opts": ["均匀变形→弹性变形→屈服→局部变形", "弹性变形→屈服→均匀变形（形变强化）→局部变形（颈缩）", "屈服→弹性变形→均匀变形→局部变形", "弹性变形→均匀变形→屈服→局部变形"], "ans": "B", "points": "四个阶段：弹性变形阶段→屈服阶段→均匀变形（形变强化）阶段→局部变形（颈缩）阶段。"}, {"tag": "名义屈服极限", "q": "无明显屈服阶段的材料，规定以塑性应变为多少时的应力作为名义屈服极限（记作σ0.2）？", "opts": ["2%", "20%", "0.02%", "0.2%"], "ans": "D", "points": "规定以塑性应变εp=0.2%所对应的应力作为名义屈服极限，记作σ0.2。"}, {"tag": "真应力真应变", "q": "关于真应力与工程应力、真应变与工程应变的关系，下列说法正确的是：", "opts": ["两者大小关系不确定", "真应力大于工程应力，真应变小于工程应变", "真应力大于工程应力，真应变大于工程应变", "真应力小于工程应力，真应变大于工程应变"], "ans": "B", "points": "真应力 S=σ(1+ε)，恒大于工程应力σ；真应变 e=ln(1+ε)，恒小于工程应变ε。"}, {"tag": "弹性模量", "q": "弹性模量是度量材料哪种性能的指标？它表征材料对什么的抗力？", "opts": ["硬度；对塑性变形的抗力", "刚度；对弹性变形的抗力", "强度；对断裂的抗力", "韧性；对冲击的抗力"], "ans": "B", "points": "弹性模量E是度量材料刚度的系数，表征材料对弹性变形的抗力，量纲与应力一致，单位常用GPa。"}, {"tag": "弹性模量组织不敏感", "q": "关于弹性模量E的影响因素，下列说法错误的是：", "opts": ["加载条件和负荷持续时间对金属、陶瓷的弹性模量没有影响", "弹性模量是组织敏感的力学性能指标", "显微组织对弹性模量影响较小，晶粒大小对E没有影响", "随温度升高，弹性模量降低"], "ans": "B", "points": "弹性模量是组织不敏感的力学性能指标：显微组织影响小、晶粒大小无影响；受键合方式、原子结构、晶体结构、化学成分、温度等影响。"}, {"tag": "塑性变形机理", "q": "金属塑性变形的主要形式是：", "opts": ["再结晶和蠕变", "扩散和回复", "断裂和磨损", "滑移和孪生"], "ans": "D", "points": "金属塑性变形的主要形式为滑移和孪生；多数金属的塑性变形由位错滑移造成，滑移系越多塑性越好（fcc好于hcp）。"}, {"tag": "屈服强度取值", "q": "有明显屈服现象的材料，其屈服强度σs取：", "opts": ["上下屈服应力的平均值", "屈服平台的最高点", "上屈服应力σsU", "下屈服应力σsL"], "ans": "D", "points": "上屈服应力对试验条件变化敏感、结果分散，下屈服应力再现性较好，因此取下屈服应力σsL作为屈服强度。"}, {"tag": "应变硬化指数", "q": "Hollomon方程 S=Kεp^n 中，应变硬化指数n=0表示：", "opts": ["没有应变硬化能力（S=K=常数）", "材料抵抗塑性变形能力最强", "理想弹性体", "材料发生颈缩"], "ans": "A", "points": "n=1为理想弹性体；n=0时S=K=常数，表示材料没有应变硬化能力；n反映材料抵抗继续塑性变形的能力。"}, {"tag": "塑性指标", "q": "若材料的伸长率δ大于或等于断面收缩率Ψ，则表明：", "opts": ["材料发生解理断裂", "材料只有均匀塑性变形而无颈缩现象，是低塑性材料", "材料具有超塑性", "材料是高塑性材料，有强烈颈缩"], "ans": "B", "points": "δ≥Ψ表明材料只有均匀塑性变形而无颈缩现象，是低塑性材料；反之则为高塑性材料。"}, {"tag": "解理断裂", "q": "关于解理断裂，下列说法正确的是：", "opts": ["属于韧性断裂的一种", "断口呈暗灰色纤维状、有韧窝", "在切应力作用下沿滑移面滑移分离造成的断裂", "在正应力作用下因原子间结合键破坏沿特定晶面发生的脆性穿晶断裂"], "ans": "D", "points": "解理断裂是在正应力作用下原子结合键破坏、沿特定晶面（解理面，如bcc的(100)）发生的脆性穿晶断裂，断口呈极平坦镜面、河流状花样。"}, {"tag": "断口三要素", "q": "典型韧性断裂（如中低碳钢杯锥状断口）的断口特征三要素是：", "opts": ["韧窝、河流花样、舌状花样", "纤维区、放射区、剪切唇", "光滑区、贝纹线、剪切唇", "裂纹源、扩展区、瞬断区"], "ans": "B", "points": "韧性断裂断口三要素：纤维区F（韧窝，裂纹扩展慢）、放射区R（裂纹快速扩展）、剪切唇S（最后阶段杯状剪切唇）。"}], "fill": [{"tag": "应力定义", "q": "应力是单位面积上的内力：σ=____/A0（填写外力符号）。", "ans": ["F"], "points": "应力等于外加力F除以原始截面积A0，即σ=F/A0。"}, {"tag": "应变定义", "q": "应变ε=ΔL/L0，即ε=（____-L0）/L0（填写变形后长度符号）。", "ans": ["L"], "points": "应变ε=ΔL/L0=(L-L0)/L0，L为变形后的长度。"}, {"tag": "低碳钢特征应力", "q": "低碳钢σ-ε曲线上四个特征应力依次为：比例极限σp、弹性极限____、屈服极限σs、强度极限____。", "ans": ["σe", "σb"], "points": "σp比例极限、σe弹性极限、σs屈服极限、σb强度极限。"}, {"tag": "真应力真应变公式", "q": "真应力S=σ(1+____)；真应变e=ln(1+ε)。", "ans": ["ε"], "points": "真应力S=σ(1+ε)，真应变e=ln(1+ε)；S恒大于σ，e恒小于ε。"}, {"tag": "滑移孪生", "q": "金属塑性变形的主要形式是滑移和____。", "ans": ["孪生"], "points": "金属塑性变形主要形式：滑移、孪生；滑移面×滑移方向=滑移系，滑移系越多塑性越好。"}, {"tag": "屈服强度定义", "q": "屈服强度表征材料对____塑性变形（或产生微量塑性变形）的抗力。", "ans": ["起始"], "points": "屈服强度定义：材料抵抗起始塑性变形或产生微量塑性变形的能力。"}, {"tag": "塑性指标", "q": "材料的塑性指标通常用伸长率____和断面收缩率Ψ表示。", "ans": ["δ"], "points": "塑性以断裂时最大相对塑性变形量表征，常用伸长率δ和断面收缩率Ψ。"}, {"tag": "微孔聚集断口", "q": "微孔聚集型断裂是剪切断裂的一种形式，其微观断口特征为____。", "ans": ["韧窝"], "points": "微孔形核、长大、聚合导致材料分离，断口呈暗灰色纤维状，微观特征为韧窝。"}, {"tag": "解理断口形貌", "q": "解理断裂的断口形貌表现为____状花样，其支流汇合方向即裂纹扩展方向。", "ans": ["河流"], "points": "解理断口形貌为河流状花样，河流流向（支流汇合方向）即裂纹扩展方向；解理裂纹多萌生于晶界或亚晶界。"}, {"tag": "超塑性", "q": "延伸率超过____%可称为超塑性。", "ans": ["100"], "points": "超塑性：材料呈现异常低的流变抗力、异常高的流变性能，延伸率超过100%可称为超塑性。"}]}, {"ch": 2, "title": "第二章 材料在其他状态下的力学性能", "mcq": [{"tag": "压缩试验", "q": "压缩试验试样的高径比（h/d）一般取多少？", "opts": ["1.5~2", "0.5~1", "3~4", "5~6"], "ans": "A", "points": "压缩试样为圆柱型，高度/直径=1.5~2；为防止纵向失稳，脆性材料和低塑性材料试样h0/d0不应大于2，最好为1~2。"}, {"tag": "压缩试验用途", "q": "压缩试验主要用于什么材料？为什么？", "opts": ["脆性材料，可表征其拉伸韧性状态不能反映的力学行为", "所有材料均可直接测定抗压强度", "塑性材料，可测其压缩断裂强度", "高弹性材料，可测弹性模量"], "ans": "A", "points": "压缩试验主要用于脆性材料（如无机非金属材料、铸铁），表征其在静拉伸韧性状态下不能反映的力学行为；压缩试验不能使塑性材料断裂，故塑性材料一般不采用压缩方法检验。"}, {"tag": "扭转试验特点", "q": "关于扭转试验的特点，下列说法错误的是：", "opts": ["变形沿整个长度方向始终均匀，不出现颈缩、鼓涨现象", "对表面缺陷显示很大敏感性，可用于表面处理质量监控", "对心部缺陷敏感，适于研究内部材质的影响", "可精确测定塑性材料尤其是高塑性材料的变形能力及变形抗力"], "ans": "C", "points": "扭转时塑性变形始终均匀、无颈缩鼓涨，可精确测定高塑性材料；对表面缺陷敏感、对心部缺陷不敏感，因此不适于研究内部材质影响。"}, {"tag": "扭转应力分布", "q": "扭转时横截面上的应力分布是：", "opts": ["切应力均匀分布", "无正应力而只有切应力，中心处切应力为零、表面处最大", "正应力在中心处最大", "既有正应力又有切应力，正应力最大"], "ans": "B", "points": "扭转时横截面上无正应力而只有切应力；中心处切应力为零，表面处最大，τ随距中心距离ρ增大而增大（τ=Gγ=Gρφ）。"}, {"tag": "扭转断口", "q": "扭转试验中，塑性材料的断口特征为：", "opts": ["杯锥状断口", "层状断口", "与轴线成45°的螺旋状（正断）", "与试样轴线垂直、平整并有回旋状塑性变形痕迹（切断）"], "ans": "D", "points": "塑性材料扭转断口与轴线垂直、平整并有回旋状塑性变形痕迹，由切应力造成（切断）；脆性材料断口与轴线成45°、呈螺旋状，由正应力造成（正断）。"}, {"tag": "弯曲试验特点", "q": "关于弯曲试验的特点，下列说法正确的是：", "opts": ["弯曲试验不受试样偏斜的影响，可稳定测定脆性和低塑性材料的抗弯强度", "弯曲试样横截面上只有正应力没有剪应力", "弯曲试验对表面缺陷不敏感", "弯曲试验可使塑性很好的材料断裂并测其抗弯强度"], "ans": "A", "points": "弯曲试验特点：（1）不受试样偏斜影响，稳定测定脆性低塑性材料抗弯强度并反映抗拉性能；（2）不能使塑性好的材料断裂，但可相对比较塑性；（3）类似扭转，对表面缺陷敏感。弯曲时横截面上既有正应力也有剪应力。"}, {"tag": "布氏硬度", "q": "布氏硬度试验的测量原理和主要特点是：", "opts": ["划痕法；适用于矿物", "测压痕深度；压痕小、效率高", "测载荷；适用于薄件", "测压痕面积；压痕大、误差小、能反映较大区域平均性能"], "ans": "D", "points": "布氏硬度测压痕面积（载荷P与压痕面积S之比HB=P/S），压痕大→误差小、能反映较大区域各组成相平均性能、数据稳定重复性高；缺点是压痕大、不宜成品检验、需换压头、测量麻烦、需保压。"}, {"tag": "洛氏硬度", "q": "洛氏硬度（HRC等）的测量原理和主要特点是：", "opts": ["测压痕深度，操作简便迅速、压痕小，但误差较大、不同标尺不能比较", "测单位压痕面积上的载荷", "测回跳高度", "测压痕面积，压痕大精度高"], "ans": "A", "points": "洛氏硬度用压入深度表示硬度（压入越深越软），可直接读数、操作简便、压痕小、可测较薄工件；缺点是误差大、代表性差、重复性差、不同标尺（HRA/HRB/HRC）测得值不能比较换算。"}, {"tag": "维氏硬度", "q": "关于维氏硬度，下列说法正确的是：", "opts": ["只能测软材料", "用淬火钢球作压头", "压入角恒定，任意选取压力测得的结果都具有可比性", "测量结果与布氏、洛氏可直接比较"], "ans": "C", "points": "维氏硬度用金刚石四棱锥压头，压入角始终为定值，因此任意选取压力测得结果具有可比性；测量精度高、范围宽，适用于薄硬化层、镀层、薄片材料。"}, {"tag": "维氏硬度表示", "q": "硬度表示“640HV30/20”的含义是：", "opts": ["加压640kgf保持30s测得的维氏硬度值为20", "维氏硬度640，压头直径30mm保持20s", "布氏硬度640，载荷30kgf", "加压30kgf保持20s测得的维氏硬度值为640"], "ans": "D", "points": "640HV30/20：加压30kgf、保持20s测得的维氏硬度值为640。"}, {"tag": "其他硬度", "q": "肖氏硬度（回跳硬度）的测定原理是：", "opts": ["标准冲头自由下落后的回跳高度与下落高度之比", "划痕法确定硬度级别", "压痕深度", "压痕面积"], "ans": "A", "points": "肖氏硬度HS=K·h/h0（h为回跳高度，h0为下落高度），操作简便、压痕小、可现场测试，主要用于大型工件（轧辊、机床床面、导轨等），精度较低、重复性差。"}, {"tag": "莫氏硬度", "q": "莫氏硬度（划痕法）将矿物硬度分为10级，最硬和最软的分别是：", "opts": ["石英10级、石膏1级", "金刚石10级、方解石1级", "金刚石10级、滑石1级", "刚玉10级、滑石1级"], "ans": "C", "points": "莫氏硬度将矿物分为10级：最硬金刚石为10级，最软滑石为1级；用一种矿石划另一种，被划出痕者硬度较低。"}], "fill": [{"tag": "抗压强度", "q": "脆性材料的抗压强度σbc=____/A0（填写压缩断裂载荷符号）。", "ans": ["Fbc"], "points": "抗压强度σbc=Fbc/A0，Fbc为压缩断裂载荷。"}, {"tag": "扭转切应力", "q": "圆柱试样扭转时表面处切应力最大：τmax=M/____（填写扭转截面系数符号）。", "ans": ["Wt"], "points": "扭转表面切应力τmax=M/Wt；圆柱试样W=πd0^3/32，矩形试样W=bh^2/6。"}, {"tag": "扭转曲线", "q": "扭转曲线通常指扭矩—____曲线（M-Φ曲线）。", "ans": ["扭转角"], "points": "扭转曲线指扭矩M—扭转角Φ曲线（M-Φ曲线），因扭转变形横截面积基本不变，曲线类似真应力-真应变曲线。"}, {"tag": "弯曲加载", "q": "弯曲试验的加载方式主要有集中加载（____弯曲）和等弯矩加载（____弯曲）两种。", "ans": ["三点", "四点"], "points": "集中加载为三点弯曲，等弯矩加载为四点弯曲。"}, {"tag": "布氏符号", "q": "布氏硬度中，用硬质合金压头记为____，用淬火钢压头记为HBS。", "ans": ["HBW"], "points": "HBW（硬质合金压头，适用450~650），HBS（淬火钢压头，适用\u003c450）。"}, {"tag": "洛氏标尺", "q": "洛氏硬度按压头和压力不同可用HRA、HRB、____三种符号表示，最常用的是____。", "ans": ["HRC", "HRC"], "points": "HRA、HRB、HRC三种标尺，最常用HRC。"}, {"tag": "纳米压痕", "q": "纳米压痕技术核心在于纳米级位移（分辨率达____nm）与载荷（分辨率低至1nN）的精确控制。", "ans": ["0.006"], "points": "纳米压痕位移分辨率0.006nm、载荷分辨率1nN，支持薄膜、涂层、高分子材料原位表征。"}, {"tag": "硬度定义", "q": "硬度是材料抵抗硬物压入其表面的能力，是衡量材料____的指标。", "ans": ["软硬"], "points": "硬度是材料抵抗硬物压入其表面的能力，是衡量材料软硬的指标。"}]}, {"ch": 3, "title": "第三章 材料的冲击韧性和低温脆性、材料的断裂韧性", "mcq": [{"tag": "冲击载荷", "q": "冲击载荷与静载荷的主要区别在于：", "opts": ["加载速度（幅度和频率）不同", "温度不同", "试样尺寸不同", "材料不同"], "ans": "A", "points": "冲击载荷与静载荷的主要区别在于加载速度（幅度和频率）。静拉伸试验应变率约10^-5~10^-2 s^-1，冲击试验约10^2~10^4 s^-1；一般情况下ε=10^-4~10^-2 s^-1可按静载荷处理。"}, {"tag": "冲击吸收功", "q": "冲击吸收功Ak的计算式为：", "opts": ["Ak=mg(H1-H2)", "Ak=mg(H1+H2)", "Ak=σb·A", "Ak=mg·H1"], "ans": "A", "points": "冲击吸收功Ak=mgH1-mgH2=mg(H1-H2)，单位焦耳J；摆锤冲击试验用试样冲断前后摆锤位能差计算。"}, {"tag": "冲击韧性值", "q": "冲击韧性值aKV的定义是：", "opts": ["冲击吸收功与试样总表面积之比", "试样断裂前吸收的总能量", "摆锤重量与落差之比", "冲击吸收功AKV与试样缺口处截面面积AN之比，单位J/cm²"], "ans": "D", "points": "冲击韧性值aKV（aKU）=AKV（AKU）/AN，AN为试样缺口处截面面积，单位J/cm²。"}, {"tag": "五大指标", "q": "材料常规力学性能的五大指标是：", "opts": ["σp、σe、σs、σb、E", "σs、σb、E、G、ν", "σs、σb、δ、Ψ、αku", "σb、HB、HRC、HV、αk"], "ans": "C", "points": "常规力学性能五大指标：σs（屈服强度）、σb（抗拉强度）、δ（伸长率）、Ψ（断面收缩率）、αku（冲击韧性值）。"}, {"tag": "低温脆性实质", "q": "低温脆性现象产生的实质是：", "opts": ["温度下降，断裂强度急剧降低", "温度下降，屈服强度急剧增加", "材料发生相变", "温度下降，弹性模量急剧升高"], "ans": "B", "points": "低温脆性实质为温度下降使屈服强度急剧增加；FCC金属位错密度比较大，一般不显示低温脆性。"}, {"tag": "迟屈服现象", "q": "体心立方金属的“迟屈服现象”是指：", "opts": ["屈服强度随温度降低而降低", "材料在低温下不产生任何变形", "在大于σs的高速载荷下材料不立即屈服，需经过一段孕育期才开始塑性变形", "材料屈服后立即断裂"], "ans": "C", "points": "迟屈服现象（bcc）：在大于σs的高速载荷下，材料不立即产生屈服，而需经过一段孕育期才开始塑性变形，这段时间有利于裂纹的扩展。"}, {"tag": "韧脆转化温度-断口形貌法", "q": "用断口形貌法确定韧脆转化温度，通常取结晶状断口面积占多少时的温度为50%FATT？", "opts": ["90%", "100%", "10%", "50%"], "ans": "D", "points": "结晶区面积百分比的增大表示材料变脆，通常取结晶状断口面积占50%时的温度为韧脆转化温度，记为50%FATT。"}, {"tag": "能量法-NDT", "q": "能量法确定韧脆转化温度中，NDT（零塑性温度）是指：", "opts": ["高阶能与低阶能平均值对应的温度", "冲击功为15尺磅对应的温度", "高阶能开始降低的温度，以上断口100%纤维状", "低阶能开始上升的温度，NDT以下断口为100%结晶状"], "ans": "D", "points": "NDT（nil ductility temperature）为零塑性温度：低阶能开始上升的温度，NDT以下试件断口为100%结晶状；FTP为高阶能开始降低的温度（以上断口100%纤维状）；FTE为高阶能与低阶能平均值对应温度；V15TT为AK=15尺磅对应温度。"}, {"tag": "影响低温脆性因素", "q": "关于影响材料低温脆性的因素，下列说法正确的是：", "opts": ["杂质元素S、P、Pb、Sn、As等使钢的韧性降低、韧脆转变温度提高", "Ni、Mn降低层错能，降低材料低温韧性", "加载速度提高，韧脆转变温度降低", "细化晶粒使韧脆转变温度tk升高"], "ans": "A", "points": "细化晶粒降低tk（晶界是裂纹扩展阻力、降低应力集中、减小杂质偏聚）；S、P、Pb、Sn、As等杂质降低韧性（偏聚晶界降低晶界强度、产生沿晶断裂倾向）；Ni、Mn增大层错能提高低温韧性；加载速度提高→脆性增大、韧脆转变温度提高。"}, {"tag": "裂纹扩展方式", "q": "裂纹扩展的三种基本方式中，最危险的是：", "opts": ["张开型（Ⅰ）", "撕开型（Ⅲ）", "三种同样危险", "滑开型（Ⅱ）"], "ans": "A", "points": "裂纹扩展基本方式：张开型Ⅰ、滑开型Ⅱ、撕开型Ⅲ；实际裂纹扩展是各种方式的组合，其中第一种（张开型）最危险。"}, {"tag": "平面应力平面应变", "q": "关于平面应力与平面应变状态，下列说法正确的是：", "opts": ["薄板为平面应变状态，σz=0", "厚板为平面应力状态，σz=0", "厚板为平面应变状态，εz=0，裂纹尖端呈三向拉应力", "薄板为平面应变状态，εz=0"], "ans": "C", "points": "薄板（裂纹尖端沿板厚方向应变不受约束）为平面应力状态σz=0；厚板（应变受约束）为平面应变状态εz=0、三向拉应力。"}, {"tag": "KIC与KI", "q": "关于应力强度因子KI与断裂韧度KIC，下列说法正确的是：", "opts": ["两者单位不同", "KIC随外加应力增大而增大", "KI是力学性能指标，KIC是力学参量", "KI受外加应力、裂纹尺寸和裂纹类型影响，KIC取决于材料成分、组织结构等内在因素"], "ans": "D", "points": "KI是力学参量（反映裂纹尖端应力场强度，受外加应力、裂纹尺寸和裂纹类型影响），KIC是力学性能指标（材料在平面应变状态下抵抗裂纹失稳扩展的能力，取决于成分、组织结构等内在因素）；两者类似σ与σs的关系，单位均为MPa·m^1/2。"}, {"tag": "塑性区修正", "q": "裂纹尖端塑性区修正的条件是：", "opts": ["σ/σs≤0.1时修正", "只有平面应力状态才修正", "σ/σs≥0.6~0.7时需用等效裂纹长度(a+ry)修正", "任何情况下都必须修正"], "ans": "C", "points": "当σ/σs≥0.6~0.7时需要修正，用等效裂纹长度(a+ry)代替实际裂纹长度，ry为应力松弛后塑性区的半宽。"}], "fill": [{"tag": "冲击韧性定义", "q": "冲击韧性是材料在冲击载荷作用下吸收____功和断裂功的大小，单位J/cm²。", "ans": ["塑性变形"], "points": "冲击韧性=材料吸收塑性变形功和断裂功的大小，表示材料塑性变形和断裂全过程吸收能量的能力，是强度和塑性的综合表现。"}, {"tag": "冲击断口三区", "q": "冲击断口同样由纤维区、放射区、____三个区组成；若材料具有一定韧性，可形成两个纤维区。", "ans": ["剪切唇"], "points": "冲击断口：纤维区—放射区—剪切唇；韧性材料可形成纤维区—放射区—纤维区—剪切唇。"}, {"tag": "低温脆断转变", "q": "低温脆断时，断裂机理由微孔聚集变为____解理，断口特征由纤维状变为结晶状。", "ans": ["穿晶"], "points": "低于脆性转变温度tK时，材料由韧性变为脆性状态：断裂机理由微孔聚集变为穿晶解理，断口由纤维状变为结晶状。"}, {"tag": "蓝脆温度", "q": "静拉伸时钢的蓝脆温度范围是230~____℃；冲击载荷作用下蓝脆温度范围是525~550℃。", "ans": ["370"], "points": "碳钢在冲击载荷和静载下一定温度范围出现脆性（蓝脆，表面氧化色为蓝色）：静拉伸230~370℃，冲击载荷525~550℃。"}, {"tag": "应力强度因子单位", "q": "应力强度因子KI的一般单位是MPa·m^1/2（或kN/m^3/2）。", "ans": ["MPa·m^1/2", "MPA·M^1/2", "MPa/m^1/2", "kN/m^3/2"], "points": "应力强度因子单位：MPa·m^1/2 或 kN/m^3/2。"}, {"tag": "断裂韧度定义", "q": "平面应变断裂韧度KIC表示材料在____应变状态下抵抗裂纹失稳扩展的能力。", "ans": ["平面"], "points": "KIC为平面应变断裂韧度（厚板、三向拉应力）；KC为平面应力断裂韧度（薄板）。"}, {"tag": "亚温淬火", "q": "亚温淬火：亚共析钢在双相区不完全奥氏体化后淬火，组织为未溶____＋马氏体。", "ans": ["铁素体"], "points": "亚温淬火获得未溶铁素体＋马氏体组织，晶粒细化且铁素体提高韧性，强度提高、韧性提高。"}, {"tag": "应变速率等效", "q": "外界因素对断裂韧度的影响中，提高应变速率相当于____温度。", "ans": ["降低"], "points": "温度降低降低断裂韧度；提高应变速率相当于降低温度，同样降低断裂韧度。"}]}, {"ch": 4, "title": "第四章 材料的疲劳性能", "mcq": [{"tag": "疲劳定义", "q": "ISO（1964）给出的金属疲劳定义是：", "opts": ["材料在磨损过程中的损伤累积", "金属材料在应力与应变的反复作用下所发生的性能变化", "材料在高温下的蠕变变形", "材料在静载下的断裂"], "ans": "B", "points": "ISO（1964）：金属材料在应力与应变的反复作用下所发生的性能变化叫做疲劳（特指导致开裂和破坏的性能变化），该定义也普适于非金属材料。"}, {"tag": "疲劳破坏占比", "q": "工程上约有多大比例的断裂破坏属于疲劳断裂？", "opts": ["10%~20%", "80%~90%", "50%~60%", "30%~40%"], "ans": "B", "points": "80%~90%的断裂破坏都是疲劳断裂；断裂应力远小于抗拉强度/屈服强度，断裂前无明显征兆。"}, {"tag": "应力比", "q": "脉动循环（如齿轮齿根）的应力比为：", "opts": ["r=0", "r=∞", "r=1", "r=-1"], "ans": "A", "points": "对称循环σm=0、r=-1（多数旋转轴类）；脉动循环σa=σm>0、r=0（齿轮齿根及某些压力容器）；波动循环0\u003cr\u003c1（发动机气缸盖、螺栓）。"}, {"tag": "疲劳断口", "q": "疲劳断口的宏观特征三个区域是：", "opts": ["贝纹线、疲劳辉纹、瞬断区", "韧窝、河流花样、舌状花样", "裂纹源、疲劳裂纹扩展区、瞬断区", "纤维区、放射区、剪切唇"], "ans": "C", "points": "疲劳断口呈现裂纹源、疲劳裂纹扩展区、瞬时断裂区三个特征区；疲劳裂纹扩展区特征为较光滑并分布贝纹线（海滩花样）。"}, {"tag": "贝纹线", "q": "关于疲劳断口贝纹线的特征，下列说法正确的是：", "opts": ["凹侧指向裂纹扩展方向，凸侧指向疲劳源", "凹侧指向疲劳源，凸侧指向裂纹扩展方向；近疲劳源区贝纹线较细密，远处稀疏", "扭转疲劳最易看到贝纹线", "贝纹线间距均匀不变"], "ans": "B", "points": "贝纹线凹侧指向疲劳源，凸侧指向裂纹扩展方向；近疲劳源区较细密、远处稀疏。扭转疲劳因最大正应力与轴成45°，一般看不到贝纹线。"}, {"tag": "裂纹萌生期", "q": "金属疲劳过程中，裂纹萌生期占总寿命的比例约为：", "opts": ["90%以上", "50%", "10%以下", "30%左右"], "ans": "A", "points": "一般裂纹的萌生期占总寿命的90%以上；0.05~0.10mm的裂纹定为裂纹形核。"}, {"tag": "低周疲劳", "q": "关于低周疲劳，下列说法正确的是：", "opts": ["断口上疲劳条带细密连续", "疲劳寿命大于10^5次，应力低于屈服强度", "寿命为10^2~10^5次，交变应力接近或超过屈服强度，属塑性应变循环（应变疲劳），寿命取决于塑性变形幅", "寿命取决于应力幅"], "ans": "C", "points": "低周疲劳：寿命10^2~10^5次，交变应力较高（接近或超过屈服强度），在塑性应变循环下断裂，也称塑性疲劳或应变疲劳；寿命取决于塑性变形幅，裂纹形核期短（约10%）、条带较粗间距较宽常不连续。高周疲劳寿命取决于应力幅。"}, {"tag": "疲劳辉纹", "q": "疲劳辉纹（疲劳条带）是疲劳断口最典型的微观特征，其特征是：", "opts": ["呈放射状河流花样", "呈弯曲并相互平行的沟槽状花样，与裂纹扩展方向垂直", "呈冰糖状花样", "呈贝壳状花样"], "ans": "B", "points": "疲劳辉纹呈弯曲并相互平行的沟槽状花样，与裂纹扩展方向垂直，是疲劳断口最典型的微观特征；韧性条带形成可用塑性钝化模型（Laird-Smith）解释。"}, {"tag": "疲劳强度关系", "q": "同种材料的对称疲劳强度之间的一般经验关系是：", "opts": ["τ-1 > σ-1 > σ-1p", "σ-1p > σ-1 > τ-1", "σ-1（弯曲）> σ-1p（拉压）> τ-1（扭转）", "三者相等"], "ans": "C", "points": "经验关系：σ-1>σ-1p>τ-1（弯曲>拉压>扭转），误差约10~30%。原因：弯曲表面应力最大仅表面层疲劳损伤；拉压截面应力均匀；扭转切应力大更易使材料滑移产生损伤。"}, {"tag": "疲劳缺口敏感度", "q": "疲劳缺口敏感度qf=(Kf-1)/(Kt-1)，当Kf=Kt时表示：", "opts": ["材料不存在应力集中", "疲劳强度无限大", "材料对缺口完全不敏感", "材料对缺口十分敏感（qf=1）"], "ans": "D", "points": "Kf=1时qf=0，材料对缺口完全不敏感；Kf=Kt时qf=1，材料对缺口十分敏感。一般情况下qf随材料强度增高而增大（结构钢0.6~0.8、球铁0.11~0.25、灰铸铁约0~0.05）。"}, {"tag": "门槛值vs疲劳强度", "q": "关于ΔKth与σ-1的区别，下列说法正确的是：", "opts": ["σ-1适用于含裂纹件设计", "σ-1代表光滑试样的无限寿命疲劳强度，适用于传统疲劳强度设计校核；ΔKth代表裂纹试样的无限寿命疲劳性能，适用于裂纹件设计校核", "两者含义完全相同", "ΔKth适用于光滑试样设计"], "ans": "B", "points": "σ-1：光滑试样无限寿命疲劳强度，用于传统疲劳强度设计和校核；ΔKth：疲劳裂纹不扩展的ΔKI临界值，代表裂纹试样的无限寿命疲劳性能，用于裂纹件设计校核（ΔKI=YΔσ√a≤ΔKth）。"}, {"tag": "过载持久值", "q": "过载持久值（有限疲劳寿命）的定义是：", "opts": ["疲劳曲线水平段对应的应力", "材料在低于疲劳强度的应力下的循环周次", "材料的无限寿命", "材料在高于疲劳强度的应力下工作，发生疲劳断裂的循环周次"], "ans": "D", "points": "过载持久值=材料在高于疲劳强度的应力下工作发生疲劳断裂的循环周次，由疲劳曲线倾斜部分确定，表征抗过载能力（曲线越陡持久值越高）。"}, {"tag": "尺寸效应", "q": "疲劳的尺寸效应是指：", "opts": ["机件尺寸增大，疲劳强度下降", "只有缺口试样才存在尺寸效应", "机件尺寸增大，疲劳强度升高", "尺寸对疲劳强度无影响"], "ans": "A", "points": "机件尺寸增大，疲劳强度下降，称为尺寸效应；尺寸效应系数ε=(σ-1)d/σ-1，缺口试样比光滑试样尺寸效应更明显。"}, {"tag": "热疲劳条件", "q": "工件产生热疲劳破坏必须具备的两个条件是：", "opts": ["高温和交变载荷", "腐蚀介质和循环应力", "温度循环变化和工件的热变形受到约束", "高应力和高应变速率"], "ans": "C", "points": "热疲劳条件：（1）温度循环变化；（2）工件的热变形受到约束（约束可来自外部刚性支承，也可来自内部温度梯度、各相热膨胀系数差异）。热应力Δσ=EαΔT。"}], "fill": [{"tag": "循环应力参量", "q": "平均应力σm=（σmax+____）/2；应力幅σa=（σmax-σmin）/2；应力比r=σmin/____。", "ans": ["σmin", "σmax"], "points": "σm=(σmax+σmin)/2；σa=Δσ/2=(σmax-σmin)/2；r=σmin/σmax。"}, {"tag": "循环分类", "q": "对称循环σm=0、r=____；脉动循环r=0；波动循环0\u003cr\u003c1。", "ans": ["-1"], "points": "对称循环r=-1（多数旋转轴类）；脉动循环r=0；波动循环0\u003cr\u003c1；随机变动应力如汽车、拖拉机、飞机。"}, {"tag": "裂纹萌生方式", "q": "疲劳微裂纹萌生的主要方式：表面滑移带开裂、第二相夹杂物与界面或本身开裂、____或亚临界处开裂。", "ans": ["晶界"], "points": "三种方式：表面滑移带开裂、第二相夹杂物与界面或夹杂物本身开裂、晶界或亚临界处开裂。"}, {"tag": "驻留滑移带", "q": "在循环载荷下形成的、难于消除（即使消除重新循环仍重现）的循环滑移带称为____滑移带。", "ans": ["驻留"], "points": "驻留滑移带（PSB）：循环应力未超过屈服强度也会在表面局部区域形成滑移带，难于消除，重新加载重现；滑移带表面加宽出现挤出脊和侵入沟。"}, {"tag": "裂纹扩展阶段", "q": "疲劳裂纹扩展Ⅱ阶段沿垂直于____方向扩展形成主裂纹，电子显微观察有疲劳条带。", "ans": ["拉应力"], "points": "Ⅰ阶段：裂纹沿最大切应力方向扩展，速度很慢；Ⅱ阶段：沿垂直于拉应力方向扩展形成主裂纹，有疲劳条带。"}, {"tag": "门槛值", "q": "工程上常取da/dN=10^-6~10^-8____/周次对应的ΔKI值为条件疲劳裂纹扩展门槛值ΔKth。", "ans": ["mm"], "points": "实验很难确定ΔKth，工程上常根据平面应变下da/dN=10^-6~10^-8mm/周次对应的ΔKI值作为条件门槛值。"}, {"tag": "Paris公式", "q": "疲劳裂纹扩展Ⅱ区可用Paris公式描述：da/dN=C(ΔKI)^____。", "ans": ["n"], "points": "Ⅱ区为疲劳裂纹扩展主要阶段（约10^-5~10^-2mm/周次），da/dN=C(ΔKI)^n。"}, {"tag": "次载锻炼", "q": "次载锻炼：以低于疲劳强度的应力先循环一定周次（如新机器跑合），可____疲劳强度、延长寿命。", "ans": ["提高"], "points": "次载效应（次载锻炼）：低于疲劳强度的应力先循环一定周次，可提高疲劳强度、延长寿命，如新机器空载或低载运行一段时间的跑合。"}, {"tag": "表面强化", "q": "表面强化的方法有喷丸、滚压、表面淬火和____热处理，以及复合强化等。", "ans": ["化学"], "points": "表面强化方法：喷丸、滚压、表面淬火和化学热处理以及复合强化（渗碳+表面淬火、渗碳+喷丸等）；原理：提高表面强度+产生表面压应力。"}, {"tag": "回火组织疲劳强度", "q": "相同条件下回火组织疲劳强度由高到低：回火____最高，回火屈氏体次之，回火索氏体最低。", "ans": ["马氏体"], "points": "显微组织影响：回火马氏体疲劳强度最高，回火屈氏体次之，回火索氏体最低；等温淬火与等温回火比较，相同硬度前者更高。"}]}, {"ch": 5, "title": "第五章 材料的磨损性能", "mcq": [{"tag": "失效方式", "q": "机械零件失效的主要方式有：", "opts": ["磨损和氧化两种", "断裂和变形两种", "疲劳和蠕变两种", "断裂、磨损和腐蚀三种"], "ans": "D", "points": "机械零件的失效主要有断裂、磨损和腐蚀三种方式；摩擦磨损是工程材料失效的主要因素之一，工程上约三分之一的能量消耗在摩擦磨损上。"}, {"tag": "摩擦系数", "q": "摩擦系数μ的定义是：", "opts": ["摩擦力F与法向压力P之比", "摩擦力与接触面积之比", "法向压力P与摩擦力F之比", "切应力与正应力之比"], "ans": "A", "points": "摩擦系数μ=F/P（摩擦力F与施加在摩擦面上的法向压力P之比）；摩擦力方向沿接触面切线方向、与相对运动方向相反。"}, {"tag": "磨损五类", "q": "按失效机制，磨损一般分为哪五类？", "opts": ["粘着磨损、磨料磨损、腐蚀磨损、接触疲劳（表面疲劳磨损）、微动损伤", "滑动磨损、滚动磨损、冲击磨损、擦伤磨损、氧化磨损", "两体磨损、三体磨损、点蚀、剥落、咬死", "流体磨损、湿磨损、干磨损、磨料磨损、粘着磨损"], "ans": "A", "points": "按磨损的失效机制一般分为五类：粘着磨损、磨料磨损、腐蚀磨损、接触疲劳（表面疲劳磨损）、微动损伤。"}, {"tag": "磨损三阶段", "q": "磨损量随摩擦行程或时间的关系曲线可分为哪三个阶段？", "opts": ["跑合阶段、稳定磨损阶段、剧烈磨损阶段", "减速、恒速、加速阶段", "初期、中期、末期磨损阶段", "弹性阶段、塑性阶段、断裂阶段"], "ans": "A", "points": "三阶段：跑合（磨合）阶段——表面粗糙、真实接触面积小、磨损速率大后趋稳；稳定磨损阶段——磨损速率基本恒定、磨损量较低；剧烈磨损阶段——间隙扩大、磨损速率急剧增加直至失效。"}, {"tag": "粘着磨损Archard", "q": "根据Archard模型，粘着磨损量W与各因素的关系是：", "opts": ["W与硬度成正比", "W与压力成反比", "W与接触面积成正比", "W与接触压力p、滑动距离L成正比，与材料硬度成反比，与接触面积无关"], "ans": "D", "points": "W=KpL/(3HV)，W与p、L成正比、与硬度成反比、与接触面积无关；适用条件p≤1/3摩擦副材料硬度，p>σb时K急剧增大造成大面积焊合和咬死。"}, {"tag": "磨粒磨损", "q": "关于磨粒磨损，下列说法正确的是：", "opts": ["磨粒磨损只发生在滚动摩擦中", "磨粒磨损与磨粒硬度无关", "材料硬度越高，抗磨粒磨损性能越好", "材料韧性越高抗磨粒磨损越好"], "ans": "C", "points": "对金属材料来说，一般材料硬度越高抗磨粒磨损性能越好；H/E值越大磨损量越小，但E组织不敏感，机件抗磨粒磨损能力主要与硬度成正比。高锰钢是公认的理想抗凿削磨损材料。"}, {"tag": "接触疲劳定义", "q": "接触疲劳（表面疲劳磨损）是指：", "opts": ["材料在高温下的疲劳破坏", "微动引起的磨损", "腐蚀介质中的疲劳破坏", "两接触材料作滚动或滚动加滑动摩擦时，表面在接触压应力长期反复作用下引起的疲劳破坏"], "ans": "D", "points": "接触疲劳：两接触材料作滚动或滚动加滑动摩擦时，表面在接触压应力长期反复作用下引起的疲劳破坏；宏观特点是接触面出现深浅不同的针状或痘状凹坑（麻坑），常见于滚动轴承、齿轮。"}, {"tag": "接触应力", "q": "关于接触应力（赫兹应力），下列说法正确的是：", "opts": ["线接触最大压应力与P的平方根成正比，点接触与P的立方根成正比", "接触面上的最大压应力与外载P成线性关系", "切应力最大值在接触表面", "最大压应力在接触表面层以下"], "ans": "A", "points": "接触压应力在接触表面处最大、沿深度方向减小；最大压应力与外载P不成线性：线接触与P^1/2成正比，点接触与P^1/3成正比。最大切应力位于表面层以下（Z=0.786b处，约0.3σzmax），故塑性变形和疲劳裂纹可能从次表层开始。"}, {"tag": "接触疲劳分类", "q": "按最大切应力位置深浅，接触疲劳分为哪三类？", "opts": ["点蚀、擦伤、咬死", "低应力、中应力、高应力疲劳", "点蚀（麻点剥落）、浅层剥落、深层剥落", "滚动疲劳、滑动疲劳、复合疲劳"], "ans": "C", "points": "三类：点蚀（麻点剥落，深度0.1~0.2mm，表面受力，滚动+滑动）；浅层剥落（0.2~0.4mm，次表层0.5~0.7b处最大循环切应力）；深层剥落（>0.4mm，强化与未强化结合处）。"}, {"tag": "微动损伤", "q": "微动损伤是指：", "opts": ["滚动接触疲劳", "大幅度的相对滑动磨损", "腐蚀与磨损的简单叠加", "两接触表面间小幅度的相对切向运动引起的损伤过程"], "ans": "D", "points": "两接触表面间小幅度的相对切向运动称为微动，微动损伤是接触面发生微动时引起的损伤过程；它是粘着、磨料、腐蚀和表面疲劳的复合磨损过程，磨损产物容易聚集在磨损点周围。"}, {"tag": "腐蚀磨损", "q": "关于腐蚀磨损（氧化磨损），下列说法正确的是：", "opts": ["氧化磨损速度最快", "氧化磨损具有最小的磨损速度，生产中常创造条件使其它磨损形态转化为氧化磨损", "氧化磨损只在干摩擦下发生", "氧化磨损与温度无关"], "ans": "B", "points": "氧化磨损是金属材料中经常见到的腐蚀磨损形式；摩擦状态下氧化反应速度比通常快；氧化磨损速率主要取决于氧化膜性质及其与基体结合强度；和其它磨损类型比较，氧化磨损具有最小的磨损速度。"}, {"tag": "耐磨性指标", "q": "耐磨性（材料抵抗磨损的性能指标）的表示方法中，下列说法正确的是：", "opts": ["磨损量愈大耐磨性愈高", "耐磨性只能用重量表示", "磨损量愈小，耐磨性愈高；耐磨率是单位时间的磨损量", "耐磨性与磨损量无关"], "ans": "C", "points": "耐磨性可用磨损量及相对耐磨性表示；磨损量表示法有线磨损量U、体积磨损量V、重量磨损量W，磨损量愈小耐磨性愈高；耐磨率=单位时间的磨损量。"}], "fill": [{"tag": "磨损量表示", "q": "磨损量可用摩擦表面法向尺寸减少量（____磨损量U）、体积变化（体积磨损量V）、重量变化（重量磨损量W）表示。", "ans": ["线"], "points": "磨损量表示法：线磨损量U（μm或mm）、体积磨损量V（mm³）、重量磨损量W（mg或g）。"}, {"tag": "磨损量测量", "q": "磨损量的测量有____法和尺寸法两类。", "ans": ["称重"], "points": "称重法：用精密分析天平称量试验前后重量变化，适用形状规则、尺寸小、不发生较大塑性变形的材料；尺寸法：根据表面法向尺寸试验前后变化确定磨损量。"}, {"tag": "磨粒磨损分类", "q": "根据磨料与材料表面承受的应力是否超过磨料的破碎强度，磨粒磨损可分为低应力擦伤式、高应力____式、凿削式。", "ans": ["辗碎"], "points": "三类：低应力擦伤式磨损、高应力辗碎式磨损、凿削式磨损。"}, {"tag": "粘着磨损程度", "q": "根据粘着点结合强度是否超过材料的断裂强度，粘着磨损可分为涂抹、擦伤、撕脱、____。", "ans": ["咬死"], "points": "粘着磨损程度分级：涂抹、擦伤、撕脱、咬死。"}, {"tag": "两体三体磨粒", "q": "____体磨粒磨损如锉削过程；____体磨粒磨损如抛光过程。", "ans": ["两", "三"], "points": "两体磨粒磨损（锉削过程）；三体磨粒磨损（抛光过程）。"}, {"tag": "摩擦分类", "q": "按两接触面运动方式，摩擦分为____摩擦和滚动摩擦。", "ans": ["滑动"], "points": "滑动摩擦：一个物体在另一个物体上滑动时产生的摩擦；滚动摩擦：物体在力矩作用下沿接触表面滚动时产生的摩擦。"}, {"tag": "接触疲劳特征", "q": "接触疲劳的特征是接触表面出现许多痘状、贝壳状或不规则形状的凹坑（____），有些凹坑较深，底部有疲劳裂纹扩展痕迹。", "ans": ["麻坑"], "points": "接触疲劳宏观特征：接触面出现深浅不同的针状或痘状凹坑（麻坑）。"}, {"tag": "铁谱分析", "q": "铁谱片上出现红色氧化物表明润滑系统中有____存在；出现黑色氧化物说明系统润滑不良、曾出现过高热阶段。", "ans": ["水分"], "points": "红色氧化物是铁和氧在常温下反应的最终生成物，表明润滑系统中有水分；黑色氧化物说明润滑不良、磨屑生成过程中曾出现过高热阶段。"}]}, {"ch": 6, "title": "第六章 材料的高温蠕变性能", "mcq": [{"tag": "高温定义", "q": "什么温度算“高温”？通常用约比温度描述：", "opts": ["T/Tm>0.3~0.5（T为试验温度，Tm为熔点，单位K）", "T/Tm>0.9", "T>300℃", "T>0.5Tm（摄氏温标）"], "ans": "A", "points": "温度高低是相对于材料熔点而言，用约比温度T/Tm描述（T为试验温度、Tm为材料熔点，单位K）；高温为T/Tm>0.3~0.5。"}, {"tag": "蠕变定义", "q": "蠕变的定义是：", "opts": ["材料在交变应力下的疲劳破坏", "材料在长时间的恒温、恒载荷作用下缓慢产生塑性变形的现象", "材料在低温下的脆断", "材料在磨损过程中的变形"], "ans": "B", "points": "蠕变：材料在长时间的恒温、恒载荷作用下缓慢产生塑性变形的现象，是材料在高温下力学行为的重要特点之一；约比温度大于0.3时蠕变效应显著。"}, {"tag": "蠕变三阶段", "q": "蠕变曲线三个阶段的正确顺序是：", "opts": ["减速蠕变阶段（ab）→恒速蠕变阶段（bc）→加速蠕变阶段（cd）", "加速→恒速→减速", "只有恒速和加速两阶段", "恒速→减速→加速"], "ans": "A", "points": "第一阶段（ab）蠕变速度随时间增长而下降——减速蠕变；第二阶段（bc）蠕变速度恒定——恒速蠕变；第三阶段（cd）蠕变速度急剧增大直至断裂——加速蠕变。"}, {"tag": "蠕变机理", "q": "材料蠕变的主要机理包括：", "opts": ["再结晶、回复、相变", "位错滑移、原子扩散、晶界滑动", "粘着、磨料、腐蚀", "孪生、解理、断裂"], "ans": "B", "points": "材料蠕变机理主要有位错滑移、原子扩散和晶界滑动，几种机制之间没有确切划分界限；高温下位错还可通过攀移作垂直于滑移面的运动（软化过程）。"}, {"tag": "晶界滑动比例", "q": "温度较高时，晶界滑动引起的变形占总蠕变量的比例约为：", "opts": ["90%", "50%", "10%左右", "1%"], "ans": "C", "points": "温度较高时晶界滑移引起的变形占总蠕变量的比例仅10%左右；常温下晶界滑动可以忽略。"}, {"tag": "蠕变断裂形式", "q": "金属材料蠕变断裂的普遍形式是：", "opts": ["晶间断裂（沿晶断裂）", "韧性断裂", "穿晶断裂", "解理断裂"], "ans": "A", "points": "高温持久载荷作用下的断裂多数为沿晶断裂，晶间断裂是蠕变断裂的普遍形式；断口微观呈冰糖状花样的沿晶断裂。"}, {"tag": "等强温度", "q": "等强温度是指：", "opts": ["韧脆转变温度", "材料熔点的温度", "再结晶温度", "晶界强度和晶体强度相等的温度"], "ans": "D", "points": "等强温度：晶界强度和晶体强度相等的温度。温度升高时晶界强度降低更快；等强温度以上工作时晶界强度低，应使晶粒适当粗化（减少晶界面积和高能晶界，减缓晶界扩散）。"}, {"tag": "蠕变极限", "q": "蠕变极限表示的是：", "opts": ["材料的抗拉强度", "在高温长时间载荷作用下机件不产生过量塑性变形的抗力指标", "材料抵抗应力松弛的能力", "材料不发生断裂的最大应力"], "ans": "B", "points": "蠕变极限：在高温长时间载荷作用下，机件不产生过量塑性变形的抗力指标，表示材料对高温蠕变变形的抗力，是选用高温材料、设计高温服役构件的主要依据之一。"}, {"tag": "持久强度", "q": "σ1000/600=200MPa表示：", "opts": ["在600℃的条件下工作1000h的持久强度为200MPa", "在600℃下蠕变速率为1000%/h", "在1000℃的条件下工作600h的持久强度为200MPa", "材料的抗拉强度为200MPa"], "ans": "A", "points": "持久强度记作σtT，T为温度℃、t为时间h；σ1000/600=200MPa表示600℃条件下工作1000h的持久强度为200MPa。持久强度是高温长时载荷下材料对断裂的抗力指标。"}, {"tag": "应力松弛", "q": "关于应力松弛，下列说法正确的是：", "opts": ["应力随时间自行升高", "材料总应变保持不变，但其中的应力随时间自行降低", "总应变和应力都不变", "应力保持不变应变随时间增大"], "ans": "B", "points": "应力松弛：材料总应变保持不变，但其中应力随时间自行降低的现象；高温条件下明显（如高温紧固螺栓、弹簧）。材料抵抗应力松弛的能力称为松弛稳定性。"}, {"tag": "细晶强化高温", "q": "细晶强化为什么不适用于高温服役材料？", "opts": ["细化晶粒提高蠕变速率", "细化晶粒会降低塑性", "高温下晶界起强化作用", "高温下晶界强度低于晶体强度，细化晶粒增加晶界面积反而使强度下降"], "ans": "D", "points": "常温下细化晶粒是强化的重要手段（晶界强化）；高温下晶界强度降低比晶体快，等强温度以上晶界强度低，细晶粒晶界面积大，材料强度下降，故应适当粗化晶粒。晶间断裂是蠕变断裂的普遍形式。"}, {"tag": "应力对蠕变影响", "q": "应力对蠕变机制的影响是：", "opts": ["应力不影响蠕变机制", "蠕变速率与应力无关", "低应力范围扩散机制起控制作用，中、高应力范围位错运动机理起控制作用", "高应力下扩散机制控制"], "ans": "C", "points": "蠕变性能主要取决于应力水平：高应力蠕变速率高、低应力低；低应力范围扩散机制起控制作用，中、高应力范围位错运动机理起控制作用。"}, {"tag": "高温短时拉伸", "q": "高温短时拉伸试验主要测定的指标是：", "opts": ["规定非比例伸长应力σp、屈服点σs、抗拉强度σb、断后延伸率δ、断面收缩率Ψ", "冲击韧性和断裂韧度", "硬度和耐磨性", "蠕变极限和持久强度"], "ans": "A", "points": "高温短时拉伸（如火箭、导弹零件工作时间短，蠕变不起决定性作用）测定：σp、σs、σb、δ、Ψ；高温时拉伸速率对性能影响比室温大得多，屈服前应变速率应保持在0.003~0.007m/min范围内某恒定值。"}], "fill": [{"tag": "蠕变曲线三阶段", "q": "蠕变曲线三阶段：____蠕变阶段、恒速蠕变阶段、加速蠕变阶段。", "ans": ["减速"], "points": "第一阶段（ab）减速蠕变：蠕变速度随时间增长而下降；第二阶段（bc）恒速蠕变；第三阶段（cd）加速蠕变直至断裂。"}, {"tag": "蠕变经验公式", "q": "蠕变曲线经验公式：ε=ε0+f(t)+____+φ(t)，其中D为恒速蠕变速率。", "ans": ["Dt"], "points": "ε=ε0+f(t)+Dt+φ(t)：ε0瞬时应变，f(t)减速蠕变量，Dt恒速蠕变速率，φ(t)加速蠕变量。"}, {"tag": "蠕变极限表示", "q": "σ 1×10^-5 600 =650MPa 表示：在____℃、规定蠕变速率1×10^-5%/h时的应力值为650MPa。", "ans": ["600"], "points": "σ 1×10^-5 600 =650MPa：600℃、规定蠕变速率1×10^-5%/h时的应力值为650MPa；汽轮机、电站锅炉设计常取蠕变速率1×10^-5%/h时的应力为蠕变极限。"}, {"tag": "蠕变极限定义2", "q": "蠕变极限的另一种表示：在给定温度T和规定时间t内，使试样产生一定蠕变应变量（%）的应力值，记为σTε/____。", "ans": ["t"], "points": "σTε/t：给定温度T、规定时间t内产生一定蠕变应变量（%）的应力值；蠕变时间短而速率大时采用（短时蠕变第一阶段短、总变形量比例大）。"}, {"tag": "应力松弛指标", "q": "应力松弛中，____应力σsh是评价材料应力松弛稳定性的指标：相同条件下经规定时间后剩余应力越高，松弛稳定性越好。", "ans": ["剩余"], "points": "σ0、ε0为初始应力应变；σsh剩余应力，σso松弛应力；剩余应力σsh越高，松弛稳定性越好，可评价材料在高温下的预紧能力。"}, {"tag": "晶界裂纹模型", "q": "晶界裂纹形成的模型：三晶界交汇点形成____形裂纹（低温高应力）、晶界形成微孔、空穴聚集形成裂纹。", "ans": ["楔"], "points": "低温高应力下晶界滑动在三晶粒交界处应力集中形成楔形裂纹；晶界滑动与晶内滑移交截形成微孔；垂直于拉应力的晶界上通过空位聚集萌生空洞长大成裂纹。"}, {"tag": "蠕变断口微观", "q": "金属材料蠕变断裂断口的微观特征为____花样的沿晶断裂。", "ans": ["冰糖状"], "points": "宏观特征：断口附近产生塑性变形、表面有龟裂纹、因高温氧化断口常有氧化膜；微观特征：冰糖状花样的沿晶断裂。"}, {"tag": "高温硬度压头", "q": "温度>800℃时，高温硬度试验压头采用人造____或刚玉压头。", "ans": ["蓝宝石"], "points": "温度\u003c800℃可用金刚石锥体（洛氏、维氏）和硬质合金球（布氏、洛氏）；温度>800℃采用人造蓝宝石或刚玉压头；一般加载时间30~60s，延长至1~5h所得结果为持久硬度。"}]}, {"ch": 7, "title": "第七章 材料的热学性能", "mcq": [{"tag": "热性能本质", "q": "材料热学性能的物理本质是（　）。", "opts": ["构成材料的质点（原子、离子）在其平衡位置附近的微小振动，即晶格热振动", "自由电子的无规则热运动", "原子核的衰变释放能量", "分子间的宏观对流运动"], "ans": "A", "points": "材料热学性能的物理本质是构成材料的质点（原子、离子）在其平衡位置的微小振动，即晶格热振动；晶格振动具有波的形式，称为晶格波（点阵波）。"}, {"tag": "声子", "q": "晶格波（点阵波）的能量量子称为（　）。", "opts": ["光子", "激子", "声子", "磁子"], "ans": "C", "points": "晶格振动的能量是量子化的，与电磁波的光子类似，点阵波的能量量子称为声子；晶体热振动就是热激发声子。"}, {"tag": "热容定义", "q": "在没有相变、没有化学反应、没有对外热交换的条件下，物体温度升高1 K所吸收的热量称为（　）。", "opts": ["焓", "热容", "熵", "内能"], "ans": "B", "points": "该热量定义为热容，单位J/K，即CT=ΔQ/ΔT；按单位质量或物质的量还可分为比热容（质量热容）和摩尔热容。"}, {"tag": "Cp与Cv", "q": "比定压热容Cp与比定容热容Cv的关系是（　）。", "opts": ["Cp=Cv", "Cp\u003cCv", "二者无确定关系", "Cp>Cv"], "ans": "D", "points": "恒压加热时，物体除温度升高外还要对外做功（膨胀功），因此温度每升高1 K需要吸收更多能量，故Cp>Cv；从试验观点看Cp测定方便，从理论上讲Cv更有意义。"}, {"tag": "杜隆-珀替定律", "q": "杜隆—珀替定律认为大多数固态单质的原子热容几乎相等，1 mol单原子固体的摩尔定容热容约为（　）。", "opts": ["约25 J/(K·mol)，即3R", "约8.31 J/(K·mol)，即R", "约50 J/(K·mol)，即6R", "约1 J/(K·mol)"], "ans": "A", "points": "E=3NAkT=3RT，Cv,m=3NAk=3R≈25 J/(K·mol)；杜隆—珀替定律给出的固体热容是与温度无关的常数，适用于高温区。"}, {"tag": "杜隆-珀替适用范围", "q": "杜隆—珀替定律适用的温度范围是（　）。", "opts": ["低温区", "高温区（室温下适用于大多数金属和一些非金属）", "任意温度", "仅0 K附近"], "ans": "B", "points": "杜隆—珀替定律是高温区的经验定律：高温时实验结果符合，低温时相差很大（热容随温度下降而减小）；室温下适用于大多数金属和一些非金属，定律未反映热容与温度的关系。"}, {"tag": "柯普定律", "q": "柯普定律的内容是（　）。", "opts": ["大多数固态单质的原子热容几乎相等", "热容与温度无关", "化合物分子热容等于构成此化合物各元素原子热容之和", "电子热容等于晶格热容"], "ans": "C", "points": "柯普定律：化合物分子热容等于构成此化合物各元素原子热容之和，C=ΣniCi；在较高温度下固体热容具有加和性，对573 K以上的大多数氧化物和硅酸盐化合物符合较好，也可用于计算多相合金和复合材料。"}, {"tag": "爱因斯坦模型", "q": "爱因斯坦热容模型在低温时给出热容与温度的关系是（　）。", "opts": ["Cv与T3成正比", "Cv与T成线性关系", "Cv与温度无关", "Cv与T成指数关系"], "ans": "D", "points": "爱因斯坦模型引用量子化概念把原子振动看作谐振子，得到Cv,m与温度有关、T趋于0 K时Cv,m趋于0，与实验一致；但其不足是低温时Cv与T成指数关系，而实验结果是T3关系，原因在于忽略了振动之间的频率差异和耦合作用。"}, {"tag": "德拜模型", "q": "德拜热容理论在低温时给出的热容与温度关系是（　）。", "opts": ["德拜T立方定律：Cv∝T3", "指数关系", "线性关系", "与温度无关的常数"], "ans": "A", "points": "德拜理论考虑原子间相互作用，把晶体看作连续介质；当T很低（T«θD）时Cv,m=12π^4R/5·(T/θD)^3，即德拜T立方定律，与实验结果非常相符。"}, {"tag": "相变对热容影响", "q": "关于一级相变和二级相变对热容的影响，下列说法正确的是（　）。", "opts": ["一级相变在相变区热容急剧增大，二级相变在临界点热容突变", "一级相变在临界点Tc热容发生突变，二级相变在一个温度范围内进行、热容急剧增大", "一级相变和二级相变对热容都没有影响", "只有二级相变影响热容"], "ans": "B", "points": "一级相变（如α-Fe→γ-Fe）在转变临界点Tc热容发生突变；二级相变（有序—无序）在一个温度范围内进行，热焓在相变区突然升高，热容也急剧增大。"}, {"tag": "热容加和性", "q": "在较高温度下（如573 K以上）计算大多数氧化物和硅酸盐化合物的热容，较好的依据是（　）。", "opts": ["杜隆—珀替定律", "德拜热容理论", "柯普定律（热容加和性）", "格律乃森定律"], "ans": "C", "points": "柯普定律的加和公式C=ΣniCi对573 K以上的大多数氧化物和硅酸盐化合物具有较好的一致性；把ni作为组成相的质量分数、Ci作为组成相的热容，也可计算多相合金和复合材料的热容。"}, {"tag": "格律乃森定律", "q": "格律乃森从晶格振动理论导出金属体膨胀系数与热容的关系，膨胀系数和热容随温度变化的特征基本一致，尤其低温下二者都按（　）规律变化。", "opts": ["与温度无关", "线性关系", "T2关系", "T3规律变化"], "ans": "D", "points": "格律乃森定律表明热膨胀是晶格振动加剧引起的容积膨胀，与热容关系密切；膨胀系数和热容随温度变化的特征基本一致，尤其在低温下皆按T3规律变化。"}, {"tag": "金属导热机理", "q": "金属材料导热的主要方式是（　）。", "opts": ["自由电子运动导热", "晶格振动（声子）导热", "光子辐射导热", "气体分子碰撞导热"], "ans": "A", "points": "金属中存在大量自由电子，靠自由电子运动能迅速传递热能，故金属导热主要靠自由电子运动，晶格振动有一定贡献但作用较小；非金属（如离子晶体）自由电子很少，主要靠晶格振动（声子）导热。"}], "fill": [{"tag": "热容单位", "q": "热容的单位为____（填写单位符号）。", "ans": ["J/K"], "points": "热容CT=ΔQ/ΔT，单位J/K；按单位质量或物质的量可分为比热容（J/kg·K）和摩尔热容（J/mol·K）。"}, {"tag": "平均比热容", "q": "平均比热容C均=Q/[m(____)]。", "ans": ["T2-T1"], "points": "平均比热容C均=Q/[m(T2-T1)]，测量方便但比较粗糙，(T2-T1)范围越大精度越差；当T2无限接近T1时即为材料在T1时的真比热容。"}, {"tag": "声子定义", "q": "晶格（点阵）波的能量量子称为____。", "ans": ["声子"], "points": "晶格振动的能量是量子化的，与电磁波的光子类似，点阵波的能量量子称为声子；hv称为量子能阶，h为普朗克常数。"}, {"tag": "柯普加和", "q": "柯普定律的加和表达式为C=Σ____（填写乘积项，如“niCi”）。", "ans": ["niCi"], "points": "C=ΣniCi，ni、Ci分别为化合物中元素i的原子数和摩尔热容；对573 K以上大多数氧化物和硅酸盐化合物符合较好。"}, {"tag": "德拜温度", "q": "德拜温度θD≈4.8×10^11____（填写符号）。", "ans": ["νmax", "vmax"], "points": "θD≈4.8×10^11νmax，νmax为最大声频；德拜温度与弹性、熔点等相关，是德拜比热函数的特征参量。"}, {"tag": "体膨胀系数", "q": "对于各向同性的材料，体膨胀系数αV可以近似为线膨胀系数α的____倍。", "ans": ["3"], "points": "V2=V1[1+αV(T2-T1)]=V1[1+3αΔT]，忽略α二次方以上的项后，各向同性材料αV≈3α。"}, {"tag": "导热系数单位", "q": "导热系数λ的单位为____（填写单位）。", "ans": ["W/(m·K)"], "points": "导热系数λ的单位为W/(m·K)或J/(m·s·K)，表征稳定传热条件下单位温度梯度、单位截面、单位时间的传热量。"}, {"tag": "导热三方式", "q": "固体材料的三种导热方式为：自由电子运动导热、晶格振动导热和____导热。", "ans": ["光子辐射", "光子"], "points": "固体导热方式包括电子运动导热、晶格振动（声子）导热和光子辐射传热；λ=λe+λρ+λr。"}, {"tag": "结构对导热影响", "q": "同种材料，多晶体的导热率比单晶体的____（填“大”或“小”）。", "ans": ["小"], "points": "同种材料多晶体的导热率比单晶体的小；非晶态材料的导热系数较小。结构越复杂，晶格振动非谐性越大，格波散射愈大，声子平均自由程愈小，导热率愈低。"}]}, {"ch": 8, "title": "第八章 材料的磁学性能", "mcq": [{"tag": "磁性起源", "q": "材料磁性的根本来源是（　）。", "opts": ["电子轨道运动和自旋运动（环形电流→磁矩）", "原子核的质量", "晶格热振动", "自由电子热运动"], "ans": "A", "points": "材料的磁性源于材料内部电子的轨道运动和自旋运动；电子轨道运动和自旋运动都可看作闭合的环形电流，任一封闭电流都有磁矩，方向与环形电流法线方向一致。"}, {"tag": "抗磁体磁化率", "q": "抗磁体的磁化率χ的特征是（　）。", "opts": ["很大的正数且非线性", "恒等于零", "很小的负数，约在10⁻⁶数量级", "与温度无关的正数"], "ans": "C", "points": "抗磁体χ为很小的负数，约10⁻⁶数量级，在磁场中受微弱斥力；金属中约有一半简单金属是抗磁体。经典抗磁体（Cu、Ag、Au、Hg、Zn）χ不随温度变化，反常抗磁体（Bi、Ga、Sb、Sn、In）χ随温度变化且大小为前者的10-100倍。"}, {"tag": "顺磁体磁化率", "q": "顺磁体的磁化率χ的特征是（　）。", "opts": ["很小的负数", "正值，约在10⁻³~10⁻⁶数量级", "很大的正数且与外磁场非线性", "恒等于零"], "ans": "B", "points": "顺磁体χ为正值约10⁻³~10⁻⁶，在磁场中受微弱吸力；正常顺磁体χ随温度变化符合χ∝1/T（Pt、Pd、奥氏体不锈钢、稀土金属），也有χ与温度无关的顺磁体（Li、Na、K、Rb）。"}, {"tag": "居里温度", "q": "铁磁体高于居里温度TC后变成（　）。", "opts": ["抗磁体", "超导体", "反铁磁体", "顺磁体"], "ans": "D", "points": "居里温度或居里点TC是铁磁性消失的温度，铁磁体高于此温度后变成顺磁体；T>TC后铁磁性转变后的顺磁性符合居里—外斯定理χ=C/(T-TC)。"}, {"tag": "亚铁磁体", "q": "下列材料中属于亚铁磁体的是（　）。", "opts": ["磁铁矿Fe₃O₄", "纯铜Cu", "铋Bi", "α-Mn"], "ans": "A", "points": "亚铁磁体类似铁磁体，但χ值没有铁磁体那样大；通常所说的磁铁矿（Fe₃O₄）就是亚铁磁体，各种铁氧体（Fe、Ni、Co的氧化物）材料都是亚铁磁性材料。"}, {"tag": "尼尔点", "q": "反铁磁体在尼尔点TN以上时（　）。", "opts": ["表现出铁磁性", "表现出抗磁性", "行为类似顺磁体", "始终保持反铁磁性"], "ans": "C", "points": "反铁磁体χ是小的正数，低于尼尔点TN时χ同磁场取向有关，呈反铁磁性；高于TN时行为象顺磁体，符合居里-外斯定理χ=C/(T+Θ)，其中Θ≈TN。典型反铁磁体有α-Mn、Cr、NiO等。"}, {"tag": "相对磁导率", "q": "铁磁质的相对磁导率μr的数量级为（　）。", "opts": ["略小于1", "10²~10⁴，且通常不是常数", "等于1", "略大于1"], "ans": "B", "points": "按相对磁导率分类：抗磁质μr\u003c1（减弱原场），顺磁质μr>1（增强原场，且顺磁质与抗磁质μr都非常接近1），铁磁质μr>>1（10²~10⁴），具有显著增强原磁场的性质，通常不是常数。"}, {"tag": "自旋磁矩", "q": "关于电子的自旋磁矩，下列说法正确的是（　）。", "opts": ["是电子的内禀特性，任何状态的电子皆有自旋磁矩，大小约一个玻尔磁子（0.927×10⁻²³ A·m²）", "只在外加磁场下才存在", "可以忽略不计", "随温度升高而增大"], "ans": "A", "points": "实验证明电子有自旋运动，相应有自旋磁矩ps，大小相当于一个玻尔磁子μB（约0.927×10⁻²³ A·m²）；自旋磁矩是电子的内禀特性，即任何状态的电子皆有自旋磁矩。"}, {"tag": "抗磁性前提", "q": "抗磁性能够表现出来的前提条件是（　）。", "opts": ["原子的内壳层未被填满", "原子中存在未成对电子", "原子的电子壳层完全填满了电子", "温度低于居里点"], "ans": "C", "points": "只有当原子的电子壳层完全填满了电子的材料，抗磁性才能表现出来；如惰性气体、离子型固体（氯化钠）、共价键填满电子层的C、Si、Ge、S、P以及金属中的Bi、Pb、Cu、Ag等。"}, {"tag": "磁畴提出", "q": "磁畴概念提出的时间和意义是（　）。", "opts": ["1932年通过实验观察到磁畴", "1911年昂内斯提出", "1879年霍尔提出", "1907年提出磁畴概念，1932年才通过实验观察到"], "ans": "D", "points": "磁畴概念于1907年提出：铁磁质相邻原子的电子因自旋存在强的交换耦合作用，使无外磁场时电子自旋磁矩能在小区域内自发平行排列，形成自发磁化达到饱和状态的微小区域，称为磁畴；各个磁畴方向不相同，因此大块磁铁对外不显示磁性；1932年磁畴才通过实验观察到。"}, {"tag": "矫顽力", "q": "矫顽力Hc的定义是（　）。", "opts": ["饱和磁化强度", "去掉剩磁的临界外磁场", "剩余磁化强度", "最大磁能积"], "ans": "B", "points": "矫顽力Hc是去掉剩磁的临界外磁场；剩余磁化强度Mr是H=0时保留的磁化强度；磁滞损耗为回线包围的面积，相当于磁化一周所产生的能量损耗。"}, {"tag": "软硬磁分类", "q": "软磁材料和硬（永）磁材料是按照（　）来划分的。", "opts": ["磁滞回线的形状（瘦小/肥大）", "居里温度的高低", "电阻率的大小", "密度的差异"], "ans": "A", "points": "根据磁滞回线的形状划分：软磁材料磁滞回线瘦小，具有高的导磁率与低的Hc（工业纯Fe、硅钢、FeNi、FeCo合金、磁性陶瓷，用作电磁铁或变压器铁心）；硬磁材料磁滞回线肥大，具有高的Hc、Mr、(BH)m（铁氧体、AlNiCo、Co及NdFeB等稀土-铁类合金，用作永磁材料）。"}], "fill": [{"tag": "磁化强度", "q": "单位体积内所有原子固有磁矩的总和称为____，用M表示。", "ans": ["磁化强度"], "points": "M=Σmi/V（A/m），磁化强度M就是附加磁场H′；磁化强度不仅与外加磁场有关，还与物质本身的磁化特性有关，M=χH。"}, {"tag": "磁感应单位", "q": "磁感应强度B的单位为____（填写单位符号）。", "ans": ["特斯拉", "T"], "points": "通过一个垂直于磁场方向单位面积的磁力线数称为磁感应强度B，单位为特斯拉（T）；μ0为真空磁导率，μr为相对磁导率。"}, {"tag": "磁化率公式", "q": "磁化强度与外加磁场的关系为M=χ____。", "ans": ["H"], "points": "M=χH，χ为磁化率，其值可正、可负；磁场强度H的单位为安/米（A/m）。"}, {"tag": "原子核磁矩", "q": "原子核磁矩约为电子磁矩的____分之一，一般忽略不计。", "ans": ["2000"], "points": "材料内部电子运动产生的磁矩有三种：电子轨道磁矩、电子自旋磁矩和原子核磁矩；原子核磁矩很小，约为电子磁矩的1/2000，一般忽略不计。"}, {"tag": "居里定律", "q": "顺磁物质的磁化率与温度的关系一般用居里定律表示：χ=____。", "ans": ["C/T"], "points": "居里定律χ=C/T，C为居里常数；只有少数物质符合居里定律，绝大多数物质的磁化率和温度的关系要用居里—外斯定律χ=C′/(T+θ)表示。"}, {"tag": "磁滞损耗", "q": "磁滞回线所包围的面积相当于磁化一周所产生的____。", "ans": ["能量损耗", "能量损失"], "points": "磁滞效应使退磁时M或B的变化总是落后于H的变化，磁化一周得到一个闭合回线即磁滞回线；回线包围的面积相当于磁化一周所产生的能量损耗，称磁滞损耗。"}, {"tag": "磁致伸缩", "q": "沿磁化方向发生长度的伸长称为____磁致伸缩，缩短则称为负磁致伸缩。", "ans": ["正"], "points": "磁致伸缩是铁磁性物质沿磁化方向发生长度伸长或缩短的现象：正磁致伸缩伸长、负磁致伸缩缩短；磁各向异性和磁致伸缩是铁磁性物质的两个磁化特征。"}, {"tag": "硬磁回线", "q": "硬磁材料的磁滞回线形状____（填“肥大”或“瘦小”）。", "ans": ["肥大"], "points": "硬磁材料（又称永磁材料）磁滞回线肥大，具有高的Hc、Mr、(BH)m等特性；常用材料有铁氧体、AlNiCo、Co及稀土-铁类合金（如NdFeB）。"}]}, {"ch": 9, "title": "第九章 材料的电学性能", "mcq": [{"tag": "电导率单位", "q": "电导率σ的单位是（　）。", "opts": ["Ω·m", "S/m（西门子每米）", "A/m", "T"], "ans": "B", "points": "σ=1/ρ，ρ的单位为Ω·m（有时用Ω·cm），σ的单位为西门子每米S/m=1/(Ω·m)；电流密度J的单位为A·m⁻²。"}, {"tag": "固体分类", "q": "电阻率ρ大于10¹⁰ Ω·m的固体属于（　）。", "opts": ["导体", "半导体", "绝缘体", "超导体"], "ans": "C", "points": "按电阻率范围分类：导体ρ\u003c10⁻² Ω·m，半导体ρ为10⁻²~10¹⁰ Ω·m，绝缘体ρ>10¹⁰ Ω·m。"}, {"tag": "经典电子理论", "q": "经典自由电子导电理论对金属导电的微观解释是（　）。", "opts": ["自由电子沿电场方向运动形成电流，与金属离子碰撞形成电阻", "离子在电场中定向移动形成电流", "空穴在晶格中运动形成电流", "声子传递电荷形成电流"], "ans": "A", "points": "经典电子理论认为金属由金属离子构成晶格点阵并形成均匀电场，价电子完全自由弥散分布；有电场时自由电子沿电场方向运动形成电流，与金属离子碰撞形成电阻；导电性取决于自由电子数量、平均自由程和平均运动速度。"}, {"tag": "金属能带", "q": "金属材料导电的能带特征是（　）。", "opts": ["禁带很宽，电子无法跃迁", "导带完全为空", "价带完全充满且能带不相连", "能带相重叠，导带被部分充填，电子易跃迁到未占能级导电"], "ans": "D", "points": "金属材料中导带被部分充填，能带相重叠，电子自外加电场获得能量后可直接移到没有被电子占据的能带进行导电；半导体和绝缘体存在不相连而全填满的价带和全空的传导带，两者区别是禁带区能量宽度不同。"}, {"tag": "半导体绝缘体", "q": "半导体与绝缘体的区别在于（　）。", "opts": ["导带是否为空", "价带是否充满", "原子的种类", "禁带宽度不同"], "ans": "D", "points": "半导体和绝缘体的导带都是空的、价带完全充满，两者的区别是禁带的宽度不同；半导体的禁带较窄，绝缘体的禁带较宽。"}, {"tag": "温度对电阻率", "q": "德拜温度以上，纯金属电阻率与温度的关系是（　）。", "opts": ["ρ∝T⁵", "近似线性关系，电阻温度系数α≈10⁻³/K", "指数关系", "与温度无关"], "ans": "B", "points": "温度升高离子振动加剧、热振动振幅增大，电子运动自由程减小、散射率增加；德拜温度以上纯金属电阻率近似线性增加（大多数金属α≈10⁻³/K），德拜温度以下ρ∝T⁵。"}, {"tag": "冷变形对电阻", "q": "冷塑性变形对金属电阻率的影响是（　）。", "opts": ["电阻率增大（点阵畸变、缺陷增加，电磁波散射加剧）", "电阻率减小", "电阻率不变", "先减小后增大"], "ans": "A", "points": "冷塑性变形使点阵畸变、缺陷增加，电磁波散射加剧，电阻率增大；回复降低点缺陷浓度，再结晶消除点阵畸变和缺陷浓度，淬火保留高温时的点缺陷。拉应力使原子间距增大、点阵畸变增大，压应力相反。"}, {"tag": "固溶体电阻", "q": "固溶体的电阻率随溶质原子增多而（　）。", "opts": ["减小", "不变", "增大", "先减小后增大"], "ans": "C", "points": "固溶体ρ随溶质原子的增多而增大，原因是：溶质原子使溶剂点阵畸变，增加了电子的散射；组元间化学相互作用减少了有效电子数。金属化合物ρ比各组元的ρ小得多（键合性质改变，金属键部分转化为共价键或离子键）；多相合金ρ约为两相ρ的加权平均值。"}, {"tag": "超导发现", "q": "1911年发现汞（Hg）在4.2 K时直流电阻突然消失的物理学家是（　）。", "opts": ["塞贝克", "珀耳帖", "霍尔", "昂内斯（Kamerlingh Onnes）"], "ans": "D", "points": "1911年荷兰物理学家昂内斯（Kamerlingh Onnes）发现汞的直流电阻在4.2 K时突然消失，即Hg进入以零阻值为特征的新物态——超导态；因液化氦气及低温物性研究获1913年诺贝尔物理学奖。"}, {"tag": "超导两特征", "q": "超导体的两大基本特征是（　）。", "opts": ["高电导率和高热导率", "永磁性与零电阻", "完全抗磁性与永磁性", "零电阻和完全抗磁性（迈斯纳效应）"], "ans": "D", "points": "超导体两大特征：①零电阻——超导环中感生电流可持续存在（永久电流），但只有直流情况下才有零电阻现象；②完全抗磁性——迈斯纳效应，超导体将内部磁场完全排除、内部磁通量保持为零。"}, {"tag": "临界磁场", "q": "超导体临界磁场强度Hc随温度变化的经验公式是（　）。", "opts": ["Hc(T)=Hc(0)(1-T²/Tc²)", "Hc(T)=Hc(0)(1+T²/Tc²)", "Hc(T)=Hc(0)T²/Tc²", "Hc(T)=Hc(0)exp(-T/Tc)"], "ans": "A", "points": "临界磁场强度Hc超过时磁力线穿入超导体、破坏超导态，经验公式Hc(T)=Hc(0)(1-T²/Tc²)；超导体的三个性能指标为临界转变温度Tc、临界磁场强度Hc和临界电流密度Jc。"}, {"tag": "塞贝克效应", "q": "两种不同的金属构成闭合回路，当两个接头存在温差时回路中将产生电流，这一效应称为（　）。", "opts": ["珀耳帖效应", "塞贝克效应", "汤姆逊效应", "霍尔效应"], "ans": "B", "points": "塞贝克效应（1821年）：两种不同金属构成闭合回路、两个接头存在温差时回路中产生电流，电流大小与接合金属种类、温差和电阻值有关；是温差发电和热电偶测量的技术基础。其实质是两种金属接触时产生接触电势差，取决于电子逸出功和有效电子密度。"}, {"tag": "珀耳帖效应", "q": "珀耳帖效应是指（　）。", "opts": ["温差产生电流", "金属棒两端温度不同时形成电势差", "回路中存在直流电流时，两种金属接头之间产生温差（电流引起吸热或放热）", "强磁场下半导体电阻变化"], "ans": "C", "points": "珀耳帖效应（1834年）是塞贝克效应的逆效应：两种不同金属构成闭合回路，回路中存在直流电流时两个接头之间将产生温差；是可逆效应，由于电流引起吸热或放热，是电子致冷所依赖的效应。珀耳帖热与电流方向有关，焦耳热与方向无关。"}], "fill": [{"tag": "电阻率单位", "q": "电阻率ρ的单位为____（填写单位）。", "ans": ["Ω·m"], "points": "电阻率ρ的单位为Ω·m，有时用Ω·cm；电导率σ=1/ρ，单位S/m。"}, {"tag": "欧姆定律", "q": "欧姆定律的微分形式为J=____。", "ans": ["σE"], "points": "J=σE，J为电流密度、E为电场，表明导体中任意一点的电流密度与该点的电场强度成正比，且方向相同。"}, {"tag": "禁带", "q": "电子不可以具有的能级所组成的能带称为____。", "ans": ["禁带"], "points": "能带理论中：禁带是电子不可以具有的能级组成的能带；允带是电子可以具有的能级组成的能带（允带中每个能级只能允许两个自旋相反的电子存在）；导带是允带中未被填满电子的能级；满带是允带中所有能级都被电子填满。"}, {"tag": "导带", "q": "允带中未被填满电子的能级称为____。", "ans": ["导带"], "points": "导带是允带中未被填满电子的能级；金属材料中导带被部分充填因而具有电子导电性，半导体和绝缘体的导带都是空的。"}, {"tag": "低温电阻率", "q": "德拜温度以下，纯金属的电阻率ρ∝____（填写温度幂次）。", "ans": ["T5", "T^5"], "points": "德拜温度以上纯金属电阻率近似线性增加（α≈10⁻³/K）；德拜温度以下ρ∝T⁵。"}, {"tag": "迈斯纳效应", "q": "超导体的完全抗磁性也称____效应。", "ans": ["迈斯纳"], "points": "迈斯纳效应：将超导体放入磁场中，会将其内部磁场完全排除，内部磁通量保持为零；不论先降温后加磁场还是先加磁场后降温，只要进入超导态，超导体就把全部磁通量排出体外。"}, {"tag": "临界电流密度", "q": "要保持超导态，需要限制最大输入电流密度，即限制____（填写符号）。", "ans": ["Jc"], "points": "临界电流密度Jc：输入电流产生磁场，与外加磁场一起破坏超导态，要保持超导态须限制最大输入电流密度；超导体的三个性能指标为Tc、Hc、Jc，三个值越大应用范围越广。"}, {"tag": "汤姆逊效应", "q": "当电流在温度不均匀的导体中流过时，导体除产生不可逆的焦耳热外，还要吸收或放出一定的热量，称为____热。", "ans": ["汤姆逊"], "points": "汤姆逊效应（1851年）：电流在温度不均匀的导体中流过时除焦耳热外还吸收或放出一定热量（汤姆逊热）；反过来，金属棒两端温度不同时两端会形成电势差（自由电子热扩散）。"}, {"tag": "光敏条件", "q": "光敏电阻效应要求光子的能量必须大于半导体材料的____。", "ans": ["禁带宽度", "禁带"], "points": "半导体材料在光辐照下电子吸收光子后挣脱原子束缚形成自由电子，导电性能增加、电阻率下降，称光电导；要求光子能量必须大于禁带宽度。CdS明暗电阻相差2000多倍（照亮小于2kΩ、无光大于4MΩ）。"}]}, {"ch": 10, "title": "第十章 材料的耐蚀性能", "mcq": [{"tag": "腐蚀定义", "q": "材料腐蚀的本质是（　）。", "opts": ["纯机械磨损过程", "物质表面因发生化学或电化学反应而受到破坏的自发过程", "物理溶解过程", "热胀冷缩过程"], "ans": "B", "points": "腐蚀是物质表面因发生化学或者电化学反应而受到破坏的现象，由于环境介质作用于材料或物质本身，使之发生质的变化；材料的腐蚀是一种自发进行的过程。"}, {"tag": "化学腐蚀介质", "q": "化学腐蚀发生在（　）。", "opts": ["非离子导体介质中（干燥气体、非电解质溶液）", "电解质溶液（离子导体介质）中", "任何介质中", "只有高温介质中"], "ans": "A", "points": "按机理分类：化学腐蚀发生在非离子导体介质中（干燥气体、非电解质溶液），金属和化学介质直接产生化学反应，不产生腐蚀电流；电化学腐蚀发生在离子导体介质（电解质溶液）中，金属表面与电解质溶液发生反应。"}, {"tag": "晶界腐蚀", "q": "下列腐蚀形式中危害性最大的是（　）。", "opts": ["均匀腐蚀", "点腐蚀", "晶界腐蚀", "磨损腐蚀"], "ans": "C", "points": "晶界腐蚀是指腐蚀过程沿着晶界进行，危害性最大；均匀腐蚀容易发现、危害性不大；点腐蚀集中于表面不大的区域向深处发展甚至穿透金属；应力腐蚀无预兆危害也较大。"}, {"tag": "应力腐蚀", "q": "关于应力腐蚀，下列说法正确的是（　）。", "opts": ["有明显的塑性变形预兆", "只发生在高温环境下", "只在压应力状态下发生", "钢在拉应力状态下发生，没有什么预兆，危害性比较大"], "ans": "D", "points": "钢在拉应力状态下能发生应力腐蚀破坏；应力腐蚀没有什么预兆，所以其危害性也比较大。"}, {"tag": "腐蚀原电池", "q": "腐蚀原电池是指（　）。", "opts": ["能够对外做功的电池", "只能导致金属腐蚀而不能对外做功的短路原电池", "电解池", "浓差电池"], "ans": "B", "points": "腐蚀原电池是只能导致金属腐蚀而不能对外做功的短路原电池；具有4个组成部分（阳极、阴极、电解质溶液、电路）和3个过程（阳极过程、阴极过程、电流流动），金属的腐蚀破坏集中出现在阳极区。"}, {"tag": "腐蚀破坏区", "q": "金属电化学腐蚀的破坏集中出现在（　）。", "opts": ["阳极区", "阴极区", "电解质溶液中", "整个表面均匀分布"], "ans": "A", "points": "腐蚀原电池中电流在阳极和阴极间流动，金属的腐蚀破坏集中出现在阳极区（阳极发生氧化溶解）。"}, {"tag": "腐蚀倾向判据", "q": "关于金属腐蚀倾向的判据，下列说法正确的是（　）。", "opts": ["ΔG>0时腐蚀反应可能发生", "ΔG=0时腐蚀最容易发生", "腐蚀倾向与ΔG无关", "ΔG\u003c0时腐蚀反应可能发生，而且越负越不稳定"], "ans": "D", "points": "ΔG\u003c0腐蚀反应可能发生，而且越负越不稳定；ΔG>0腐蚀反应不可能发生。ΔG只能判断金属腐蚀倾向的大小，不能判断腐蚀速度的大小；ΔG=nFE，只有当阳极电位小于阴极电位时才满足E>0。"}, {"tag": "电极电位判据", "q": "要使电化学腐蚀反应满足ΔG\u003c0（E>0）的条件，必须满足（　）。", "opts": ["阳极电位大于阴极电位", "阳极电位等于阴极电位", "阳极电位小于阴极电位", "电极电位与腐蚀倾向无关"], "ans": "C", "points": "电化学反应所作的有用功等于系统反应自由能的减少ΔG=nFE；满足ΔG\u003c0的必要条件是E>0，即只有当阳极电位小于阴极电位时，腐蚀才能自发进行；常用标准电极电位作为电化学腐蚀倾向的热力学判据。"}, {"tag": "耐蚀分级", "q": "腐蚀速度小于0.01 mm/年的不锈钢称为（　）。", "opts": ["完全耐蚀", "耐蚀", "耐酸钢", "不锈耐酸钢"], "ans": "A", "points": "仅能抵抗大气、水等介质腐蚀的钢叫不锈钢：腐蚀速度小于0.01 mm/年的不锈钢称为完全耐蚀，小于0.1 mm/年的称为耐蚀；在酸碱等介质中具有抗腐蚀能力的钢称耐酸钢，腐蚀速度小于0.1 mm/年的耐酸钢称为完全耐蚀，小于1 mm/年的称为耐蚀。"}, {"tag": "提高耐蚀性", "q": "提高钢耐腐蚀性能途径中，通过提高固溶体电极电位或形成稳定钝化区最理想的元素是（　）。", "opts": ["镍", "铬", "锰", "铜"], "ans": "B", "points": "提高钢耐蚀性的途径：①形成稳定保护膜（Cr、Al、Si有效）；②提高固溶体电极电位或形成稳定钝化区（Cr、Ni、Si，其中Ni贵而紧缺、Si易使钢脆化，Cr是理想的）；③获得单相组织（Ni、Mn→单相奥氏体）；④机械保护措施或覆盖层（电镀、发兰、涂漆）。"}, {"tag": "475℃脆性", "q": "高铬铁素体不锈钢的475℃脆性是指（　）。", "opts": ["在1000℃以上淬火产生的脆性", "在低温下产生的冷脆", "含铬>15%的钢在400~525℃长时间加热或缓慢冷却时变脆，以475℃加热为最甚", "含镍量过高引起的脆性"], "ans": "C", "points": "当Cr>15%时随Cr含量增加脆化倾向增大，在400~525℃长时间加热或缓慢冷却时钢变得很脆，以475℃加热为最甚；原因是脆化温度范围内长期停留时铬有序化形成α″相，与母相共格产生大内应力，使冲击韧度αK降低。"}, {"tag": "奥氏体不锈钢成分", "q": "世界各国奥氏体不锈钢的典型成分是（　）。", "opts": ["13Cr", "17Cr-2Ni", "9Cr18", "18Cr-8Ni"], "ans": "D", "points": "奥氏体不锈钢的主要合金成分是Cr和Ni，18Cr和8Ni的配合是世界各国奥氏体不锈钢的典型成分；Cr+Ni=18+8=26，耐蚀电位接近n/8定律中n=2的电位值，具有良好钝化性能，耐蚀性达到较高水平。"}], "fill": [{"tag": "腐蚀分类", "q": "按腐蚀机理，金属腐蚀分为化学腐蚀和____腐蚀两大类。", "ans": ["电化学"], "points": "按腐蚀机理分为：化学腐蚀（非离子导体介质：干燥气体、非电解质溶液）和电化学腐蚀（离子导体介质：电解质溶液）；按环境还可分为大气、海水、淡水、土壤、工业介质腐蚀。"}, {"tag": "腐蚀
